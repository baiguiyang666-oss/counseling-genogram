<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>家谱图 · Genogram</title>
<style>
:root{
  --bg:#f6f5f1;--canvas:#fbfaf7;--panel:#ffffff;
  --ink:#1f2937;--ink-2:#475467;--muted:#6b7280;
  --hair:#e7e4dc;--hair-strong:#dbd7cd;
  --accent:#2f6b5f;--accent-hover:#275a50;--accent-weak:#eaf1ee;
  --danger:#b23a34;--dot:#e4e0d6;
  --panel-2:#fcfbf8;--surface-hover:#f3f1eb;--surface-pressed:#eae7df;--line-soft:#f1eee7;--danger-weak:#fbeeed;--toast-bg:#20292f;--preview-bg:#efece5;--chip-border:#dfe6e6;--switch-track:#d5d0c6;--switch-on:#2f9e6a;--switch-on-ink:#22684a;--switch-on-border:#b6d7c4;--switch-on-bg:#f3faf6;--scroll-thumb:#dedbd2;--peek-bg:#fff6d8;--peek-ring:#f0d9a0;--gx-neg:#b23a34;--gx-pick:#7a5bb5;--accent-wash:rgba(47,107,95,.10);
  --r-sm:6px;--r-md:10px;--r-lg:14px;
  --sh-1:0 1px 2px rgba(20,30,40,.05);
  --sh-2:0 1px 2px rgba(20,30,40,.04),0 14px 34px rgba(20,30,40,.07);
  --font:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);
  color:var(--ink);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-size:14px;line-height:1.55;
}
#app{display:flex;flex-direction:column;height:100%}
#toolbar{
  display:flex;align-items:center;gap:8px;padding:0 14px;min-height:50px;background:var(--panel);
  border-bottom:1px solid var(--hair);flex:0 0 auto;overflow-x:auto;overflow-y:hidden;
  white-space:nowrap;scrollbar-width:thin;box-shadow:0 1px 0 rgba(20,30,40,.02);z-index:5;
}
.brand{font-size:17px;font-weight:600;letter-spacing:.01em;flex:0 0 auto}
.brand .sub{font-weight:400;color:var(--muted);font-size:9px;margin-left:7px;letter-spacing:.08em}
#title{
  flex:0 0 auto;width:156px;border:1px solid transparent;background:transparent;border-radius:var(--r-sm);
  padding:4px 8px;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);
  transition:border-color .15s,background .15s;
}
#title:hover{border-color:var(--hair)}
#title:focus{border-color:var(--accent);outline:none;background:var(--panel);box-shadow:0 0 0 2px var(--accent-weak)}
.tb-group{display:flex;align-items:center;gap:2px;flex:0 0 auto}
button.tb{
  font-family:inherit;font-size:14px;font-weight:450;padding:0 11px;height:30px;border-radius:var(--r-sm);
  border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;
  min-height:30px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;
}
button.tb:hover:not(:disabled){background:var(--surface-hover);color:var(--ink);border-color:transparent}
button.tb:active:not(:disabled){background:var(--surface-pressed)}
button.tb:disabled{opacity:.38;cursor:default}
button.tb:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.tb.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:500}
button.tb.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);color:var(--panel)}
.sep{width:1px;height:18px;background:var(--hair);margin:0 6px;flex:0 0 auto}
/* R21：纯动作型按钮改用内联 SVG（零外部依赖）。高度/圆角/hover 与文字按钮完全一致；
   ::after 把命中区上下各扩 1px，30px 视觉高度对应 32px 触控高度，不改变工具栏整体高度 */
button.tb.icon{position:relative;width:32px;padding:0;display:inline-flex;align-items:center;justify-content:center}
button.tb.icon svg{width:16px;height:16px;display:block;pointer-events:none}
button.tb.icon::after{content:"";position:absolute;left:-1px;right:-1px;top:-2px;bottom:-2px}
#stage{position:relative;flex:1 1 auto;display:flex;min-height:0}
#view{position:relative;flex:1 1 auto;min-width:0;min-height:0}
#canvas{
  position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;background-color:var(--canvas);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.4px);
  background-size:26px 26px;background-position:0 0;
}
#canvas.panning{cursor:grabbing}
#ghost{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
#emptyHint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;padding:24px;
}
#emptyHint[hidden]{display:none}
.eh-card{
  pointer-events:auto;background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-lg);
  box-shadow:var(--sh-2);padding:30px 32px 28px;max-width:400px;text-align:center;
}
.eh-card svg{display:block;margin:0 auto 12px}
.eh-card h2{margin:0 0 6px;font-size:17px;font-weight:500;letter-spacing:.01em}
.eh-card p{margin:0 0 18px;font-size:14px;line-height:1.6;color:var(--muted)}
#panel{
  width:340px;flex:0 0 340px;background:var(--panel);border-left:0;
  overflow-y:auto;padding:16px 18px 56px;font-size:14px;line-height:1.55;
}
#panel::-webkit-scrollbar{width:9px}
#panel::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:5px}
#panel[hidden]{display:none!important}
.sec{margin-bottom:18px}
.sec h3{
  margin:0 0 10px;font-size:17px;font-weight:600;color:var(--ink-2);letter-spacing:.06em;
  display:block;text-align:center;line-height:1.45;
}
.fld{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fld>span{flex:0 0 58px;color:var(--muted);font-size:12px}
.fld input[type=text],.fld input[type=number],.fld select,.fld input[type=date]{
  flex:1;min-width:0;font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--hair);
  border-radius:var(--r-sm);background:var(--panel-2);color:var(--ink);transition:border-color .15s,box-shadow .15s;
  font-variant-numeric:tabular-nums;
}
.fld input[type=number]{font-variant-numeric:tabular-nums}
.fld input:focus,.fld select:focus,.note-row input:focus,.note-row select:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak);background:var(--panel);
}
.chk{display:flex;align-items:center;gap:7px;font-size:14px;margin:0 0 9px;color:var(--ink-2);cursor:pointer}
.row-2{display:flex;flex-wrap:wrap;gap:8px}
.row-2 .fld{flex:1 1 136px;min-width:0;margin-bottom:8px}
.row-2 .fld>span{flex:0 0 42px}
.yr-row{display:flex;align-items:center;gap:8px}
.yr-row input[type=number]{flex:1;min-width:0}
.yr-row .chk{margin:0;font-size:12px;white-space:nowrap}
.note-row,.urec,.crec{
  border:1px solid var(--hair);border-radius:var(--r-md);padding:9px;margin-bottom:8px;background:var(--canvas);
}
.note-row .nr-top{display:flex;gap:6px;margin-bottom:6px}
.note-row select{flex:0 0 76px;font-size:12px;padding:4px 4px;border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--panel);font-family:inherit;color:var(--ink-2)}
.note-row input{flex:1;min-width:0;font-size:12px;padding:4px 6px;border:1px solid var(--hair);border-radius:var(--r-sm);font-family:inherit;background:var(--panel)}
.note-row .nr-bot{display:flex;gap:6px}
.note-row .nr-bot input{flex:1}
.mini{
  font-family:inherit;font-size:12px;padding:3px 8px;border-radius:var(--r-sm);border:1px solid var(--hair);
  background:var(--panel);cursor:pointer;color:var(--ink-2);height:auto;min-height:26px;transition:border-color .15s,color .15s,background .15s;
}
.mini:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.mini.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-weak)}
/* R21：遥控器/手柄焦点分区 —— 工具栏与面板内的焦点环与键盘一致 */
#panel button:focus-visible,#panel select:focus-visible,#panel input:focus-visible,#panel textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#toolbar .navring,#panel .navring{outline:2px solid var(--accent);outline-offset:2px}
.line-title{font-size:14px;color:var(--ink);font-weight:500;margin:0 0 7px}
/* R16-3：关系面板第一块内容是关系名称，顶部正中、大字号 */
.rel-hero{text-align:center;padding:2px 0 14px;margin:0 0 14px;border-bottom:1px solid var(--hair)}
.rel-name{display:inline-block;font-size:21px;line-height:1.3;font-weight:600;letter-spacing:.06em;color:var(--ink)}
.rel-sub{margin-top:5px;font-size:12px;line-height:1.5;color:var(--ink-2)}
.rel-code{display:inline-block;margin-top:6px;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:12px;color:var(--accent);background:var(--accent-weak);border-radius:4px;padding:1px 6px}
.empty{color:var(--muted);font-size:14px;line-height:1.7;padding:6px 0}
.hint{color:var(--muted);font-size:12px;line-height:1.65;margin-top:7px}
.meaning{border:1px solid var(--hair);border-left:3px solid var(--accent);border-radius:var(--r-md);background:var(--panel-2);padding:10px 12px}
.meaning .m-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.meaning .m-head b{font-size:14px;font-weight:500;color:var(--ink)}
.meaning code{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:12px;color:var(--accent);background:var(--accent-weak);border-radius:4px;padding:1px 5px}
.meaning p{margin:0;font-size:12px;line-height:1.6;color:var(--ink-2)}
.tag{
  display:inline-block;font-size:12px;padding:1px 6px;border-radius:4px;background:var(--accent-weak);
  color:var(--accent);margin-left:6px;font-weight:450;
}
#menu{
  position:fixed;z-index:50;min-width:158px;background:var(--panel);border:1px solid var(--hair);
  border-radius:var(--r-md);box-shadow:var(--sh-2);padding:5px;display:none;font-size:14px;
}
#menu.open{display:block}
#menu button{
  display:block;width:100%;text-align:left;font-family:inherit;font-size:14px;padding:7px 10px;
  border:0;background:transparent;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2);
}
#menu button:hover,#menu button:focus{background:var(--accent-weak);color:var(--ink);outline:none}
#menu .msep{height:1px;background:var(--hair);margin:4px 2px}
#menu button.danger{color:var(--danger)}
/* R21：触屏长按动作条 —— 与右键菜单共用同一份命令表，只是改成横向浮动呈现 */
#actbar{
  position:fixed;z-index:90;display:none;flex-wrap:wrap;align-items:center;gap:2px;
  max-width:min(340px,92vw);background:var(--panel);border:1px solid var(--hair);
  border-radius:var(--r-md);box-shadow:var(--sh-2);padding:4px;
}
#actbar.open{display:flex}
#actbar button{
  font-family:inherit;font-size:12px;line-height:1.2;padding:0 9px;height:34px;min-height:34px;
  border:0;background:transparent;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2);white-space:nowrap;
}
#actbar button:hover,#actbar button:focus{background:var(--accent-weak);color:var(--ink);outline:none}
#actbar button.danger{color:var(--danger)}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--toast-bg);color:var(--panel);
  padding:10px 18px;border-radius:var(--r-md);font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:80;max-width:78vw;box-shadow:var(--sh-2);
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.gx-inline{
  position:absolute;z-index:6;box-sizing:border-box;padding:0 5px;border:1px solid var(--accent);border-radius:3px;
  background:var(--panel);color:var(--gx-ink);font:500 14px "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  outline:none;box-shadow:0 2px 10px rgba(24,32,38,.16);
}
#help{
  position:fixed;inset:0;background:rgba(24,32,38,.36);z-index:60;display:none;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);
}
#help.open{display:flex}
.help-box{
  background:var(--panel);border-radius:var(--r-lg);max-width:860px;width:100%;max-height:88vh;overflow:auto;
  padding:22px 26px 28px;box-shadow:var(--sh-2);
}
.help-box h2{margin:0 0 4px;font-size:21px;font-weight:500}
.help-box h4{margin:20px 0 8px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.05em}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:6px 18px}
.legend-item{display:flex;align-items:center;gap:10px;font-size:12px;padding:2px 0}
.legend-item svg{flex:0 0 132px}
.legend-item .en{color:var(--muted);font-size:12px}
.help-note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px}
.kbd{
  display:inline-block;border:1px solid var(--hair);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:12px;background:var(--panel-2);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;color:var(--ink-2);
}
.close-x{
  float:right;border:0;background:transparent;font-size:21px;line-height:1;cursor:pointer;color:var(--muted);
}
/* ---- 新增：命中区 / 含义卡 / 选择器 / 对照表 / 主题 ---- */
.gx-ehit{fill:none;stroke:transparent;stroke-width:14}
.gx-ehit:hover{stroke:var(--accent-wash)}
.gx-age-unk{fill:var(--gx-edge);font-weight:400}
.gx-elink:hover path,.gx-ulink:hover path{stroke-opacity:1}
.meaning{border:1px solid var(--hair);border-left:3px solid var(--accent);border-radius:var(--r-md);background:var(--panel-2);padding:10px 12px}
.meaning .m-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.meaning .m-head b{font-size:14px;font-weight:500;color:var(--ink)}
.meaning code{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:12px;color:var(--accent);background:var(--accent-weak);border-radius:4px;padding:1px 5px}
.meaning p{margin:0 0 3px;font-size:12px;line-height:1.6;color:var(--ink-2)}
.meaning .m-tag{font-size:12px;color:var(--muted);border:1px solid var(--hair);border-radius:4px;padding:0 5px}
.pick{margin-top:6px}
.pick .pk-q{width:100%;font-size:12px;padding:5px 8px;border:1px solid var(--hair);border-radius:var(--r-sm);font-family:inherit;background:var(--panel);color:var(--ink)}
.pk-list{max-height:196px;overflow:auto;margin-top:5px;border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--panel)}
.pk-item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;
  border:0;border-bottom:1px solid var(--line-soft);background:var(--panel);font-family:inherit;font-size:12px;
  padding:6px 9px;cursor:pointer;color:var(--ink-2);
}
.pk-item:last-child{border-bottom:0}
.pk-item{justify-content:flex-start;align-items:center}
.pk-item em{font-style:normal;font-size:9px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;flex:0 0 auto}
.pk-item .pk-sv{flex:0 0 auto;line-height:0;display:block}
.pk-item .pk-tx{flex:1 1 auto;min-width:0;text-align:left;display:block}
.pk-item .pk-tx b{display:block;font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-item .pk-tx i{display:block;font-style:normal;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pk-item:hover{background:var(--accent-weak);color:var(--ink)}
.pk-item.sel{background:var(--accent-weak);color:var(--accent);font-weight:500}
/* 性别 / 符号合并下拉 */
.pt-btn{display:flex;align-items:center;gap:7px;width:100%;font-family:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--panel-2);color:var(--ink);cursor:pointer}
.pt-btn i{margin-left:auto;font-style:normal;color:var(--muted)}
.pt-sv{display:block;flex:0 0 auto}
.pt-list{max-height:224px;overflow:auto;margin-top:5px;border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--panel)}
.pt-list[hidden]{display:none}
.pt-item{border-radius:0}
/* R18-3：长枚举自绘下拉（>8 项）。原生 select 仅作隐藏取值源 */
.dd{position:relative}
.dd-src{display:none}
.dd-btn{display:flex;align-items:center;gap:6px;width:100%;font-family:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--panel-2);color:var(--ink);cursor:pointer;text-align:left;min-height:28px}
.dd-cur{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-ar{flex:0 0 auto;margin-left:auto;font-style:normal;color:var(--muted);font-size:12px}
.dd-pop{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:72;max-height:236px;overflow:auto;
  background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(20,30,40,.16);padding:3px}
.dd-pop[hidden]{display:none}
.dd-it{display:block;width:100%;text-align:left;border:0;background:var(--panel);font-family:inherit;font-size:12px;
  padding:5px 8px;border-radius:4px;color:var(--ink-2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-it:hover{background:var(--accent-weak);color:var(--ink)}
.dd-it.sel{background:var(--accent-weak);color:var(--accent);font-weight:500}
.dd-tight{flex:0 1 auto;min-width:104px;max-width:46%}
.dd-tight .dd-btn{font-size:12px;padding:3px 6px;min-height:24px}
.dd-tight .dd-pop{min-width:220px;right:auto}
/* 日期 */
.dfield{align-items:flex-start}
.dfield>span{padding-top:6px}
.dcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.dp{display:flex;gap:4px;align-items:center}
.dp[hidden]{display:none}
.dsel{flex:1;min-width:0;font-family:inherit;font-size:12px;padding:3px 3px;border:1px solid var(--hair);border-radius:4px;background:var(--panel);color:var(--ink-2)}
.dp .dd{flex:1;min-width:0}
.dp .dd-btn{font-size:12px;padding:3px 6px;min-height:25px;gap:3px}
.dp .dd-ar{font-size:9px}
.dp .dd-pop{max-height:210px;min-width:96px;right:auto;left:0}
/* 信息条目 */
.chipbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:7px}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:1px 7px;border-radius:10px;background:var(--accent-weak);color:var(--accent);border:1px solid var(--chip-border)}
.chip-x{margin-left:2px;border:0;background:none;padding:0 2px;font:inherit;line-height:1;color:inherit;cursor:pointer;opacity:.72}
.chip-x:hover,.chip-x:focus-visible{opacity:1}
.chip-in{flex:1 1 76px;min-width:64px;font-family:inherit;font-size:12px;line-height:1.5;padding:1px 6px;border:1px dashed var(--hair);border-radius:10px;background:var(--panel);color:var(--ink);outline:none}
.chip-in:focus{border-color:var(--accent);border-style:solid}
.addnote{display:flex;align-items:center;gap:6px;margin-top:6px}
.ncp-btn{flex:0 0 auto;max-width:110px;font-family:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--panel);color:var(--ink-2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncp-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-pop{position:fixed;z-index:80;width:150px;background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(20,30,40,.16);padding:3px;max-height:240px;overflow:auto}
.cat-pop[hidden]{display:none}

.cp-new button{flex:0 0 auto;font-family:inherit;font-size:12px;padding:3px 7px;border:1px solid var(--hair);border-radius:4px;background:var(--panel-2);cursor:pointer;color:var(--ink-2)}
.ntgroup{margin-bottom:6px}
.ntcat{font-size:12px;color:var(--muted);margin:0 0 4px}
.ntrow{display:flex;align-items:flex-start;gap:5px;border:1px solid var(--hair);border-radius:var(--r-sm);padding:5px 6px;margin-bottom:5px;background:var(--panel)}
.ntgrip{cursor:grab;color:var(--muted);font-size:12px;line-height:22px;user-select:none;flex:0 0 auto;touch-action:none}
.ntsel{flex:0 0 74px;font-size:12px;padding:3px 2px;border:1px solid var(--hair);border-radius:4px;font-family:inherit;color:var(--ink-2);background:var(--panel)}
.ntbox{position:relative;flex:1;min-width:0}
.nta{width:100%;box-sizing:border-box;font-family:inherit;font-size:12px;line-height:1.45;padding:4px 18px 4px 6px;border:1px solid var(--hair);border-radius:4px;background:var(--panel);color:var(--ink);resize:vertical;overflow:auto}
.nta::placeholder{opacity:.55}
.ntmore{position:absolute;right:2px;top:2px;padding:1px 4px;font-size:12px;line-height:14px;border:0;background:transparent;color:var(--accent);cursor:pointer}
.ntmore[hidden]{display:none}
/* 下拉展开：已选项临时高亮 */
.peek,.flash{animation:peekflash 1.05s ease}
@keyframes peekflash{0%{background:var(--peek-bg);box-shadow:0 0 0 2px var(--peek-ring)}100%{background:var(--panel);box-shadow:none}}
/* 全屏输入 */
.note-modal{position:fixed;inset:0;z-index:90;background:rgba(20,25,30,.55);display:flex;align-items:center;justify-content:center;padding:28px}
.note-modal .nm-bx{width:min(920px,92vw);height:min(78vh,720px);background:var(--panel);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
.note-modal .nm-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--hair);font-size:14px;color:var(--ink-2)}
.note-modal .nm-hd b{font-weight:500;color:var(--ink)}
.note-modal textarea{flex:1;border:0;outline:none;resize:none;padding:14px;font-family:inherit;font-size:14px;line-height:1.7;color:var(--ink)}
/* 情感线目标选择中的取消 */
#pickbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--hair);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:3px 5px 3px 10px;font-size:12px;color:var(--ink-2)}
#pickbar[hidden]{display:none}
#pickbar button{border:0;background:transparent;font-size:17px;line-height:1;cursor:pointer;color:var(--muted);padding:1px 4px}
.legend-row{
  display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;
  border-bottom:1px solid var(--line-soft);padding:7px 4px;cursor:pointer;border-radius:4px;
}
.legend-row:hover{background:var(--accent-weak)}
.legend-row .lr-tags{font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.01em}
.legend-row svg{display:block}
.legend-row .lr-name{font-size:14px;color:var(--ink);font-weight:450}
.legend-row .lr-code{font-size:9px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;display:block;margin-top:1px}
.legend-row .lr-desc{font-size:12px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.legend-row .lr-apply{border:0;background:none;color:var(--accent);font-family:inherit;font-size:12px;cursor:pointer;padding:0;margin-top:3px}
.legend-row .lr-apply:hover{text-decoration:underline}
.legend-sec{font-size:12px;color:var(--muted);letter-spacing:.05em;margin:16px 0 4px;font-weight:500}
.legend-search{width:100%;padding:8px 10px;border:1px solid var(--hair);border-radius:var(--r-sm);font-family:inherit;font-size:14px;margin-bottom:6px}
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.person-cell{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.theme-card{border:1px solid var(--hair);border-radius:var(--r-md);background:var(--panel);padding:10px;cursor:pointer;font-family:inherit;text-align:left}
.theme-card:hover{border-color:var(--accent)}
.theme-card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
.theme-card .sw{display:flex;gap:4px;margin-bottom:7px}
.theme-card .sw i{width:18px;height:18px;border-radius:4px;display:block;border:1px solid rgba(0,0,0,.08)}
.theme-card b{font-size:12px;font-weight:500;color:var(--ink)}
.color-rows{display:grid;gap:6px;margin-top:10px}
.color-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.color-row input[type=color]{width:38px;height:26px;border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--panel);padding:2px}
.guide-step{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.guide-step:last-child{border:0}
.guide-num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent-weak);color:var(--accent);font-size:12px;display:flex;align-items:center;justify-content:center}
.guide-step p{margin:0;font-size:12px;line-height:1.6;color:var(--ink-2)}
/* ---- 导出预览 / 打印文档 ---- */
#xprev{position:fixed;inset:0;background:rgba(24,32,38,.5);z-index:70;display:none;padding:18px;box-sizing:border-box}
#xprev.open{display:flex;justify-content:center}
.xp-wrap{background:var(--preview-bg);border-radius:var(--r-lg);box-shadow:var(--sh-2);width:min(1180px,100%);display:flex;flex-direction:column;overflow:hidden}
.xp-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--hair);flex-wrap:wrap}
.xp-title{font-weight:500;font-size:14px}
.xp-extra{font-size:12px;color:var(--muted)}
.xp-sw{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
.xp-sw[hidden]{display:none}
.xp-sw input{margin:0;width:14px;height:14px;accent-color:var(--accent);cursor:pointer}
.xp-tabs{display:flex;gap:4px;margin-left:auto}
.xp-tabs button{border:1px solid var(--hair);background:var(--panel);border-radius:var(--r-sm);font-family:inherit;font-size:12px;padding:4px 10px;cursor:pointer;color:var(--ink-2)}
.xp-tabs button.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:500}
.xp-tabs button:disabled{opacity:.4;cursor:default}
.xp-body{flex:1 1 auto;overflow:auto;padding:16px;background:var(--preview-bg)}
.xp-page{background:var(--panel);border-radius:6px;box-shadow:0 2px 12px rgba(20,30,40,.12);padding:12px;margin:0 auto 14px;max-width:1100px}
.xp-page[hidden]{display:none}
.xp-cap{font-size:12px;color:var(--muted);margin-bottom:8px}
.xp-fig svg{width:100%;height:auto;display:block}
/* 文本明细紧凑排版：预览 / 量页 / 打印共用同一组字号，保证界面页数 = 物理页数 */
.dm-c{font-size:9px;line-height:1.32;color:var(--ink)}
.dm-c h1{font-size:14px;font-weight:500;line-height:1.2;margin:0 0 2px}
.dm-c .dm-sub{color:var(--muted);font-size:9px;line-height:1.3;margin:0 0 7px}
.dm-c h2{font-size:9px;font-weight:500;line-height:1.25;margin:9px 0 3px;border-bottom:1px solid var(--hair);padding-bottom:2px}
.dm-c .dm-p{break-inside:avoid;margin:0 0 4px}
.dm-c .dm-p h3{font-size:9px;font-weight:500;line-height:1.25;margin:3px 0 0}
.dm-c ul{margin:0 0 0 14px;padding:0}
.dm-c li{margin:0;font-size:9px;line-height:1.32}
.dm-c .dm-p.dm-li{margin:0}
.xp-subcap{font-size:12px;color:var(--muted);margin:10px 0 5px;padding-top:8px;border-top:1px dashed var(--hair)}
.xp-subcap:first-child{border-top:0;padding-top:0;margin-top:0}
.xp-page .lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 18px}
.xp-page .lg-i{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.xp-page .lg-i em{font-style:normal;color:var(--muted);font-size:9px;margin-left:6px}
.xp-page .lg-i small{display:block;color:var(--muted);font-size:9px;line-height:1.4}
.xp-page .gx-sym{fill:var(--gx-sym);stroke:var(--gx-ink);stroke-width:1.6}
.xp-page .gx-inner{fill:none;stroke:var(--gx-ink);stroke-width:1.3}
.xp-page .gx-dead{stroke:var(--gx-ink);stroke-width:1.4;fill:none;opacity:.55}
#printRoot{display:none}
/* 文本明细的物理页量具：宽度 = A4 横向正文宽（297 - 2×10mm） */
#pgMeasure{position:fixed;left:-20000px;top:0;width:277mm;visibility:hidden;pointer-events:none;z-index:-1}
@media print{
  #app,#printHead,#menu,#toast,#help,#emptyHint,#xprev,#pgMeasure{display:none!important}
  #printRoot{display:block}
  .pr-page{page-break-after:always;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .pr-page:last-child{page-break-after:auto}
  .pr-h{font-size:9px;color:var(--muted);margin:0 0 6px}
  .pr-h b{font-size:14px;color:var(--ink)}
  /* 第 1 页：图形固定一页；header 之外剩余高度全部留给图，图在框内双向居中 */
  .pr-figpage{height:188mm;display:flex;flex-direction:column;box-sizing:border-box}
  .pr-figpage .pr-h{flex:0 0 auto}
  .pr-figpage .pr-fig{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pr-fig svg{width:auto;height:auto;max-width:100%;max-height:100%;display:block;margin:0 auto}
  .pr-doc .lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 18px}
  .pr-doc .lg-i{display:flex;align-items:center;gap:8px;font-size:9px;padding:3px 0}
  .pr-doc .gx-sym{fill:var(--gx-sym);stroke:var(--gx-ink);stroke-width:1.6}
  .pr-doc .gx-inner{fill:none;stroke:var(--gx-ink);stroke-width:1.3}
}
#printHead{display:none}
@media (max-width:760px){
  /* 小屏工具栏不再折成三行：保持单行、横向滚动，把高度留给画布 */
  #toolbar{gap:6px;padding:8px;min-height:0;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}
  .brand{font-size:14px}
  .brand .sub{display:none}
  #title{width:104px;font-size:12px}
  #panel{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;flex:none;height:56vh;
    border-left:0;border-top:1px solid var(--hair);border-radius:var(--r-lg) var(--r-lg) 0 0;
    transform:translateY(100%);transition:transform .22s ease;z-index:40;box-shadow:0 -10px 30px rgba(20,30,40,.12);
    padding-bottom:28px;
  }
  #panel.open{transform:translateY(0)}
  /* 面板展开时给画布留出底部 56vh（margin 参与 flex 计算，画布正好等于可见区） */
  body.pnl #stage{margin-bottom:56vh}
  button.tb{height:32px}
  #panelBtn{display:inline-block}
}
/* R21：≤430 窄屏把 12 个按钮压进单行视口内（不折行、不横向溢出）；标题栏让位给操作按钮 */
@media (max-width:430px){
  #toolbar{gap:0;padding:6px;overflow-x:visible}
  .brand{display:none}
  #title{display:none}
  #toolbar .sep{display:none}
  #toolbar .tb-group{gap:0}
  #toolbar button.tb{height:32px;padding:0 3px;font-size:12px;border-radius:6px}
  #toolbar button.tb.icon{width:32px;padding:0}
  #toolbar button.tb.icon::after{left:0;right:0;top:0;bottom:0}
}
@media (min-width:761px){#panelBtn{display:none}}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:0ms!important;animation-duration:0ms!important}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{height:auto;overflow:visible;background:var(--panel)}
  #toolbar,#panel,#menu,#toast,#help,#emptyHint{display:none!important}
  #app{display:block;height:auto}
  #stage{display:block}
  #view{position:static}
  #canvas{position:static;width:100%;height:auto;background:var(--panel);background-image:none;cursor:default}
  #printHead{display:block;font-size:9px;color:var(--muted);margin:0 0 4px;padding:0 2px}
  #printHead b{font-size:14px;font-weight:500;color:var(--ink)}
  .node .gx-selbox{display:none}
}

      <button class="tb icon" data-cmd="themeMenu" aria-label="主题"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M8 2.4a5.6 5.6 0 0 1 0 11.2z" fill="currentColor" stroke="none"/></svg></button>
      <button class="tb icon" data-cmd="help" aria-label="图例"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.6" y="2.6" width="10.8" height="10.8" rx="1.2"/><path d="M5 6h6M5 8h6M5 10h3.5"/></svg></button>

  <div id="stage">

      <svg id="canvas" role="application" aria-label="家谱图画布">
        <style id="svstyle">

  Object.keys(kidGroups).forEach(function(uid){
    var g = kidGroups[uid];
    if(g.some(function(l){ return l.manual; })) return;
    g.sort(function(a, b){
      var pa = pidx[a.child], pb = pidx[b.child];
      var ka = (pa && !pa.unborn) ? ageOf(pa) : null;
      var kb = (pb && !pb.unborn) ? ageOf(pb) : null;
      if(ka == null && kb == null) return a.id < b.id ? -1 : 1;
      if(ka == null) return 1;
      if(kb == null) return -1;
      if(kb !== ka) return kb - ka;
      return a.id < b.id ? -1 : 1;
    });
    g.forEach(function(l, i){ l.order = i; });
  });
  if(drops.length) console.warn('[genogram] 载入时丢弃了 ' + drops.length + ' 条无效亲子关系：' + drops.join('；'));

  var es = Array.isArray(d.emotionalLinks) ? d.emotionalLinks : [], eseen = {};
  out.emotionalLinks = es.filter(function(e){
    if(!e || !e.from || !e.to || e.from === e.to) return false;
    if(!pids[e.from] || !pids[e.to]) return false;
    var key = [e.from, e.to].sort().join('|');
    if(eseen[key]) return false;
    eseen[key] = 1; return true;
  }).map(function(e){
    return {
      id: e.id || uid('e'), from: e.from, to: e.to,
      type: emoCode(e.type),
      note: e.note || ''
    };
  });
  out.relLabels = !!d.relLabels;
  out.view = d.view && isFinite(d.view.scale) ? {x:+d.view.x || 0, y:+d.view.y || 0, scale:clamp(+d.view.scale, .25, 4)} : {x:0,y:0,scale:1};
  return out;
}

/* ============ 6. 历史 ============ */
function snapshot(){
  return JSON.stringify({
    persons: doc.persons, unions: doc.unions,
    parentLinks: doc.parentLinks, emotionalLinks: doc.emotionalLinks,
    probandId: doc.probandId || null
  });
}
function pushHistory(){
  var s = snapshot();
  if(undoStack.length && undoStack[undoStack.length - 1] === s) return;
  undoStack.push(s);
  if(undoStack.length > MAX_HIDE_STEP) undoStack.shift();
  redoStack.length = 0;
  updateToolbar();
}
/* 用指定快照入栈（拖动前快照），保证"拖动 + 贴合重排"整体算一步，Ctrl+Z 一次回拖动前 */
function pushHistoryOf(snap){
  if(!snap || (undoStack.length && undoStack[undoStack.length - 1] === snap)) return;
  undoStack.push(snap);
  if(undoStack.length > MAX_HIDE_STEP) undoStack.shift();
  redoStack.length = 0;
  updateToolbar();
}
/* 校验失败/输入被拒绝时，把刚才为这次输入压入的"无变化"快照弹出，
   否则撤销栈里会多出一个什么都不恢复的步骤 */
function dropNoopHistory(){
  if(undoStack.length && undoStack[undoStack.length - 1] === snapshot()){
    undoStack.pop(); updateToolbar();
  }
}
function restore(snap){
  var o = JSON.parse(snap);
  doc.persons = o.persons; doc.unions = o.unions;
  doc.parentLinks = o.parentLinks; doc.emotionalLinks = o.emotionalLinks;
  doc.probandId = o.probandId || null;
  if(selection.type === 'person' && !doc.persons.some(function(p){ return p.id === selection.id; })) selection = {type:null,id:null};
  if(selection.type === 'emotion' && !doc.emotionalLinks.some(function(e){ return e.id === selection.id; })) selection = {type:null,id:null};
}
function undo(){
  if(!undoStack.length) return;
  var cur = snapshot();
  var prev = undoStack.pop();
  redoStack.push(cur);
  restore(prev);
  commit(false);
  updateToolbar();
  toast('已撤销');
}
function redo(){
  if(!redoStack.length) return;
  var cur = snapshot();
  var next = redoStack.pop();
  undoStack.push(cur);
  restore(next);
  commit(false);
  updateToolbar();
  toast('已重做');
}

/* ============ 7. 布局 ============ */
function personById(id){ for(var i=0;i<doc.persons.length;i++) if(doc.persons[i].id===id) return doc.persons[i]; return null; }
function unionById(id){ for(var i=0;i<doc.unions.length;i++) if(doc.unions[i].id===id) return doc.unions[i]; return null; }
function unionsOf(id){ return doc.unions.filter(function(u){ return u.a===id || u.b===id; }); }
function otherOf(u, id){ return u.a===id ? u.b : u.a; }
function linksOfUnion(uid2){ return doc.parentLinks.filter(function(l){ return l.union===uid2; }); }
function primaryParentUnionOf(pid){
  var ls = doc.parentLinks.filter(function(l){ return l.child===pid && l.primary; });
  return ls.length ? unionById(ls[0].union) : null;
}
/* R13：独子单元（两位父母 + 唯一子女）。拖任一成员都按整组平移，
   保证「中继竖线 x = 父母中点 = 子女 x」，线在拖动过程中也不会弯 */
function singleChildUnitOf(pid){
  if(!layout || !layout.visible) return null;
  var vis = layout.visible;
  function singular(u){
    if(!u || !u.b || !vis[u.a] || !vis[u.b]) return null;
    var kids = linksOfUnion(u.id).filter(function(l){ return l.primary && vis[l.child]; });
    if(kids.length !== 1) return null;
    var c = kids[0].child;
    /* 独子只有这一条亲代链接，才允许把三人当刚性单元；共享子女不参与 */
    if(doc.parentLinks.filter(function(x){ return x.child === c; }).length !== 1) return null;
    return c;
  }
  var us = unionsOf(pid);
  for(var i = 0; i < us.length; i++){
    var c = singular(us[i]);
    if(c) return { union:us[i].id, ids:[us[i].a, us[i].b, c] };
  }
  var ls = doc.parentLinks.filter(function(l){ return l.child === pid && l.primary; });
  if(ls.length === 1){
    var u = unionById(ls[0].union), c2 = singular(u);
    if(c2) return { union:u.id, ids:[u.a, u.b, c2] };
  }
  return null;
}
/* R17-1/R17-2：直系（核心）人物 = 从最上面一代沿 parentLinks 血脉直系传下来的人。
   婚嫁进来的伴侣（仅作为伴侣出现、没有父母）不算直系；只有情感线相连的孤立人物也不算。
   情感线永远不赋予直系身份——这正是 R17-1「新建人物建完情感线后被锁进第一代」的根因：
   旧 coreSet() 把「被情感线连到核心人物」也算核心，于是松手时被代带吸附/钳制回 gen0。 */
function coreSet(){
  var core = {}, byId = {}, hasParent = {}, kidsOf = {};
  doc.persons.forEach(function(q){ byId[q.id] = q; });
  doc.parentLinks.forEach(function(l){
    hasParent[l.child] = 1;
    (kidsOf[l.union] = kidsOf[l.union] || []).push(l.child);
  });
  /* 每个有子女的 union：有父母的一方是血脉方；双方都无父母（根家庭）时按子女姓氏占比判定，平手取 union.a */
  var roots = {};
  doc.unions.forEach(function(u){
    var kids = kidsOf[u.id]; if(!kids || !kids.length) return;
    var aHas = !!hasParent[u.a], bHas = !!hasParent[u.b];
    if(aHas && bHas) return;
    if(aHas){ roots[u.a] = 1; return; }
    if(bHas){ roots[u.b] = 1; return; }
    var sn = {};
    kids.forEach(function(cid){
      var ch = String((byId[cid] && byId[cid].name) || '').trim().charAt(0);
      if(ch) sn[ch] = (sn[ch] || 0) + 1;
    });
    var sa = String((byId[u.a] && byId[u.a].name) || '').trim().charAt(0);
    var sb = String((byId[u.b] && byId[u.b].name) || '').trim().charAt(0);
    var ca = sn[sa] || 0, cb = sn[sb] || 0;
    roots[cb > ca ? u.b : u.a] = 1;
  });
  for(var id in roots) core[id] = 1;
  /* 向下传播：血脉方的子女也是直系，递归到所有后代 */
  var changed = true;
  while(changed){
    changed = false;
    doc.unions.forEach(function(u){
      var kids = kidsOf[u.id]; if(!kids || !kids.length) return;
      if(!core[u.a] && !core[u.b]) return;
      kids.forEach(function(cid){ if(!core[cid]){ core[cid] = 1; changed = true; } });
    });
  }
  return core;
}
function isCorePerson(pid){
  return !!coreSet()[pid];
}
function isAncestor(a, b){
  if(a===b) return true;
  var seen = {}, stack = [b];
  while(stack.length){
    var c = stack.pop();
    var ls = doc.parentLinks.filter(function(l){ return l.child===c; });
    for(var i=0;i<ls.length;i++){
      var u = unionById(ls[i].union);
      if(!u) continue;
      if(u.a===a || u.b===a) return true;
      [u.a,u.b].forEach(function(p){ if(p && !seen[p]){ seen[p]=1; stack.push(p); } });
    }
  }
  return false;
}

/* 折叠：返回隐藏集合与每个折叠节点的隐藏后代计数 */
function computeHidden(){
  var hidden = {}, counts = {};
  function hideUnder(rootId){
    var count = 0;
    (function hideDesc(p){
      unionsOf(p).forEach(function(u){
        linksOfUnion(u.id).forEach(function(l){
          if(l.child === p) return;
          var c = l.child;
          if(hidden[c]) { return; }
          hidden[c] = 1; count++;
          unionsOf(c).forEach(function(u2){
            var partner = otherOf(u2, c);
            if(partner && !hidden[partner] && !isAncestor(partner, p)){ hidden[partner] = 1; count++; }
          });
          hideDesc(c);
        });
      });
    })(rootId);
    return count;
  }
  doc.persons.forEach(function(p){
    if(p.collapsed && hasDescendants(p.id)) counts[p.id] = hideUnder(p.id);
  });
  return { hidden: hidden, counts: counts };
}
function hasDescendants(pid){
  return unionsOf(pid).some(function(u){
    return linksOfUnion(u.id).some(function(l){ return l.child !== pid; });
  });
}

/* 超宽且无法换行的文本：截断加省略号，避免溢出符号被线切到 */
function ellipsize(str, font, maxW){
  if(measure(str, font) <= maxW) return str;
  var s = str;
  while(s.length > 1 && measure(s + '…', font) > maxW) s = s.slice(0, -1);
  return s + '…';
}
function metricsFor(p){
  var name = (p.name || '').trim() || '未命名';
  var nl = wrap(name, N_FONT, LABEL_MAX, 2).map(function(l){ return ellipsize(l, N_FONT, LABEL_MAX); });
  var notes = Array.isArray(p.notes) ? p.notes : [];
  var items = notes.filter(function(n){
    return n && n.type !== 'quote' && n.type !== 'note' && n.type !== 'age' && n.type !== 'tag' && (n.value || n.label);
  }).sort(function(a,b){ return (NOTE_RANK[a.type]||9) - (NOTE_RANK[b.type]||9); });
  var shown = items.slice(0, MAX_ROWS).map(function(n){
    return ellipsize(wrap(String(n.value || n.label), I_FONT, LABEL_MAX, 1)[0], I_FONT, LABEL_MAX);
  });
  var extra = items.length - shown.length;
  var lines = shown.slice();
  if(extra > 0) lines.push('+' + extra);
  var mw = SYMBOL;
  nl.forEach(function(l){ mw = Math.max(mw, measure(l, N_FONT)); });
  lines.forEach(function(l){ mw = Math.max(mw, measure(l, I_FONT)); });
  var w = Math.min(LABEL_MAX + 8, mw + 8);
  /* 块高 = 符号底到姓名基线 77 + 其余姓名行 + 首条明细贴靠 + 其余明细行距（含底部留白） */
  var lead = lines.length > 4 ? ILH_LOOSE : ILH;
  var h = 77 + Math.max(0, nl.length - 1) * NLH + (lines.length ? FI + (lines.length - 1) * lead : 0);
  return { w: w, h: h, nameLines: nl, itemLines: lines, extra: extra };
}

function computeGen(visible){
  var gen = {}, hasPar = {};
  doc.persons.forEach(function(p){ gen[p.id] = 0; });
  doc.parentLinks.forEach(function(l){ if(visible[l.child]) hasPar[l.child] = 1; });
  var vu = doc.unions.filter(function(u){ return visible[u.a] && (!u.b || visible[u.b]); });
  /* 迭代次数与人数挂钩并设上限，残缺/环状数据也不会把代次推到几十层、拉出大片空行 */
  var lim = Math.min(60, doc.persons.length + 4);
  for(var it = 0; it < lim; it++){
    var changed = false;
    for(var i = 0; i < vu.length; i++){
      var u = vu[i];
      if(u.b){
        /* 伴侣同代：优先上提“没有父母链接”的一方，避免与亲子层级冲突形成无解环 */
        if(!hasPar[u.a] && !hasPar[u.b]){
          if(gen[u.a] !== gen[u.b]){ gen[u.a] = gen[u.b] = Math.max(gen[u.a], gen[u.b]); changed = true; }
        }else if(!hasPar[u.a] && gen[u.a] < gen[u.b]){ gen[u.a] = gen[u.b]; changed = true; }
        else if(!hasPar[u.b] && gen[u.b] < gen[u.a]){ gen[u.b] = gen[u.a]; changed = true; }
      }
      var g = u.b ? Math.max(gen[u.a], gen[u.b]) : gen[u.a];
      var ls = linksOfUnion(u.id);
      for(var j = 0; j < ls.length; j++){
        var l = ls[j];
        if(visible[l.child] && gen[l.child] < g + 1){ gen[l.child] = g + 1; changed = true; }
      }
    }
    if(!changed) break;
  }
  /* 最小代次归零，防止异常数据留下整片空行 */
  var minG = Infinity;
  doc.persons.forEach(function(p){ if(visible[p.id] && gen[p.id] < minG) minG = gen[p.id]; });
  if(isFinite(minG) && minG !== 0){
    doc.persons.forEach(function(p){ gen[p.id] -= minG; });
  }
  return gen;
}

function computeOrder(visible){
  var order = {}, counter = 0, walked = {};
  /* walk 与 order 分离：同一个人的所有伴侣/子女单元必须被枚举一次。
     旧实现只给伴侣编号就 return（order 已存在），导致"王芳 ←→ 未命名"这段 union
     永远不会被访问，新伴侣落到末尾兜底、排到整行最右，形成横贯画布的大空白。 */
  function walk(id){
    if(walked[id]) return;
    walked[id] = 1;
    if(order[id] === undefined) order[id] = ++counter;
    var us = unionsOf(id).slice().sort(function(a,b){ return (a.order||0) - (b.order||0); });
    us.forEach(function(u){
      var q = otherOf(u, id);
      if(q && visible[q]) walk(q);
      var ls = linksOfUnion(u.id).slice().sort(function(a,b){
        return kidOrderCmp(a, b);
      });
      ls.forEach(function(l){ if(visible[l.child]) walk(l.child); });
    });
  }
  var hasParent = {};
  doc.parentLinks.forEach(function(l){ hasParent[l.child] = 1; });
  doc.persons.filter(function(p){ return visible[p.id] && !hasParent[p.id]; }).forEach(function(p){ walk(p.id); });
  doc.persons.filter(function(p){ return visible[p.id] && order[p.id] === undefined; }).forEach(function(p){ order[p.id] = ++counter; });
  return order;
}

function relayout(){
  var vis = computeHidden();
  var hidden = vis.hidden;
  var visible = {};
  doc.persons.forEach(function(p){ if(!hidden[p.id]) visible[p.id] = 1; });

  var gen = computeGen(visible);
  var order = computeOrder(visible);
  var met = {};
  doc.persons.forEach(function(p){ if(visible[p.id]) met[p.id] = metricsFor(p); });

  // 行高
  var rowY = {}, rowsGen = [];
  var maxGen = 0;
  doc.persons.forEach(function(p){ if(visible[p.id] && gen[p.id] > maxGen) maxGen = gen[p.id]; });
  var y = 0;
  for(var g = 0; g <= maxGen; g++){
    var rowP = doc.persons.filter(function(p){ return visible[p.id] && gen[p.id] === g; });
    var maxH = SYMBOL;
    rowP.forEach(function(p){ maxH = Math.max(maxH, met[p.id].h); });
    rowY[g] = y;
    rowsGen.push({ g: g, y: y, maxH: maxH, persons: rowP });
    y += maxH + ROW_GAP;
  }

  /* ---- R26-2：代间净距按「实际文字占位」自适应 ----
     每代的下边界取该代人真实文字占位底（符号中心 + h - 28，含姓名/年龄/关系名/明细条目）；
     下一代的顶框线取「出生/死亡年份文字上缘」与「兄弟横线上缘」中更高的一条
     （中继线错层最多 3 档 ×9px → 行线上方 66+27=93）。
     只有净距不足 GEN_MIN_CLEAR 的那一对相邻代才补差，补完即止，其余代保持原紧凑度。
     已被用户拖离本代带（拖到下一代线以下）的人不参与本对净距，避免排版把他们/整行来回推。 */
  var INK_TOP = 50, INK_BOT = 28, GEN_MIN_CLEAR = 20;
  var rowShift = 0;
  for(var gi = 1; gi <= maxGen; gi++){
    if(rowShift){ rowY[gi] += rowShift; rowsGen[gi].y = rowY[gi]; }
    var hasIncoming = false;
    doc.parentLinks.forEach(function(l){
      if(hasIncoming) return;
      if(visible[l.child] && gen[l.child] === gi) hasIncoming = true;
    });
    var nextTopFrame = rowY[gi] - (hasIncoming ? 93 : INK_TOP);
    var prevBot = -Infinity;
    rowsGen[gi-1].persons.forEach(function(p){
      var oy = (p.offset && p.offset.y) || 0;
      if(rowY[gi-1] + oy > rowY[gi]) return;   /* 已被拖到下一代线以下，不参与 */
      var hh = (met[p.id] || { h: 77 }).h;
      prevBot = Math.max(prevBot, rowY[gi-1] + oy + hh - INK_BOT);
    });
    if(prevBot === -Infinity) continue;
    var lack = GEN_MIN_CLEAR - (nextTopFrame - prevBot);
    if(lack > 0.5){
      rowY[gi] += lack; rowsGen[gi].y += lack;
      rowShift += lack;
    }
  }

  /* ---- R26-1：吸附行 = 实际代数（0..maxGen 全在）+ 最高代上方 2 条 + 最低代下方 2 条 ----
     空层与实际代同口径取行距（最近一对真实代的行距），无人也留带，拖过去能吸住并对齐。 */
  var pitchTop = (maxGen >= 1) ? (rowY[1] - rowY[0]) : (SYMBOL + ROW_GAP);
  var pitchBot = (maxGen >= 1) ? (rowY[maxGen] - rowY[maxGen-1]) : (SYMBOL + ROW_GAP);
  rowY[-1] = rowY[0] - pitchTop;
  rowY[-2] = rowY[0] - pitchTop * 2;
  rowY[maxGen + 1] = rowY[maxGen] + pitchBot;
  rowY[maxGen + 2] = rowY[maxGen] + pitchBot * 2;

  // 初始化 x
  var X = {};
  /* 水平最小中心距按关系层级分档，写进求解里，所有行内相邻关系都走它，不靠默认值碰巧成立 */
  /* 相邻两人的关系层级：伴侣 / 同父母兄弟姐妹 / 有关系线相连（情感线）/ 跨家庭。
     R16-2 密度口径：1 框宽、1.5 框宽是「自动排版的底线（下限）」，不是统一目标值。
       有关系线直接相连（伴侣、情感线）→ 符号边缘净距 ≥1.5 框宽（84）
       其余相邻（兄弟姐妹、无连线跨家庭）→ ≥1 框宽（56），且全局可读下限 70 由 sepPass 兜住
     实际间距可大于底线，由子女对齐、避让、分组等约束撑开。 */
  function pairLevel(ia, ib){
    var us = unionsOf(ia);
    for(var i = 0; i < us.length; i++){
      var u = us[i];
      if(u.b && otherOf(u, ia) === ib){
        var kids = linksOfUnion(u.id).filter(function(l){ return l.primary && visible[l.child]; });
        return kids.length ? 'partnerK' : 'partner';
      }
    }
    var pa = primaryParentUnionOf(ia), pb = primaryParentUnionOf(ib);
    if(pa && pb && pa.id === pb.id) return 'sibling';
    if(doc.emotionalLinks.some(function(e){
      return (e.from === ia && e.to === ib) || (e.from === ib && e.to === ia);
    })) return 'linked';
    return 'cross';
  }
  function minDX(ia, ib){
    var A = met[ia] || { w: SYMBOL }, B = met[ib] || { w: SYMBOL };
    var wa = +A.w, wb = +B.w;
    /* 残缺数据兜底：0 宽 / NaN / 负值一律按符号宽度计算，否则间距会算出异常值 */
    if(!isFinite(wa) || wa < SYMBOL) wa = SYMBOL;
    if(!isFinite(wb) || wb < SYMBOL) wb = SYMBOL;
    var lv = pairLevel(ia, ib);
    var linked = lv === 'partner' || lv === 'partnerK' || lv === 'linked';
    /* 符号边缘净距底线：连线直连 1.5 框宽（84）→ 中心 ≥140；其余 1 框宽 → 中心 ≥126（全局净距 70 更严）。
       文字盒只要不重叠且留 BOX_GAP(28) 即可读，不按「框宽」放大，否则名字长的人会被文字宽度顶得很开。 */
    var symC = linked ? SYMBOL + 84 : MIN_CENTER;
    var txtC = wa/2 + wb/2 + BOX_GAP;
    return Math.max(symC, txtC, MIN_CENTER);
  }
  /* 行内次序：把「伴侣对」拉成相邻块。一个人有多个伴侣时左右交替（甲—乙—甲—丙），
     这样每段伴侣关系在水平线上都是相邻两框，不会出现隔着一整个人的婚线。 */
  function coupleSeq(ps){
    var inRow = {}, placed = {}, seq = [];
    ps.forEach(function(p){ inRow[p.id] = 1; });
    ps.slice().sort(function(a,b){ return (order[a.id]||0) - (order[b.id]||0); }).forEach(function(p){
      if(placed[p.id]) return;
      placed[p.id] = 1; seq.push(p.id);
      var queue = [p.id];
      while(queue.length){
        var cur = queue.shift();
        var side = 1;
        unionsOf(cur).slice().sort(function(a,b){ return (a.order||0)-(b.order||0) || (a.id < b.id ? -1 : 1); }).forEach(function(u){
          var q = otherOf(u, cur);
          if(!q || !inRow[q] || placed[q]) return;
          placed[q] = 1;
          var pos = seq.indexOf(cur);
          if(side > 0) seq.splice(pos + 1, 0, q);
          else seq.splice(pos, 0, q);
          side = -side;
          queue.push(q);
        });
      }
    });
    return seq.map(function(id){ return personById(id); }).filter(Boolean);
  }
  rowsGen.forEach(function(row){
    var ps = coupleSeq(row.persons);
    row.persons = ps;
    var prev = null;
    ps.forEach(function(p){
      if(!prev) X[p.id] = 0;
      else X[p.id] = X[prev.id] + minDX(prev.id, p.id);
      prev = p;
    });
  });

  var vu = doc.unions.filter(function(u){ return visible[u.a] && (!u.b || visible[u.b]); });
  var ux = {};
  var ITER = 28;
  for(var it = 0; it < ITER; it++){
    // 初始化
    rowsGen.forEach(function(row){
      var prev = null;
      row.persons.forEach(function(p){
        if(!prev) return;
        var need = minDX(prev.id, p.id);
        if(X[p.id] - X[prev.id] < need) X[p.id] = X[prev.id] + need;
        prev = p;
      });
    });

    ux = {};
    vu.forEach(function(u){ ux[u.id] = u.b ? (X[u.a] + X[u.b]) / 2 : X[u.a]; });

    var childTarget = {}, parentTarget = {};
    vu.forEach(function(u){
      var kids = linksOfUnion(u.id).filter(function(l){ return l.primary && visible[l.child]; })
        .sort(function(a,b){ return kidOrderCmp(a, b); });
      if(!kids.length) return;
      /* 子女组：按 minDX 依次排开后整体居中到伴侣单元中点（孩子多时向两侧同步拉开） */
      var pos = [], cur = 0;
      kids.forEach(function(l, i){
        if(i) cur += minDX(kids[i-1].child, l.child);
        pos.push(cur);
      });
      var mid = (pos[0] + pos[pos.length-1]) / 2;
      kids.forEach(function(l, i){ childTarget[l.child] = ux[u.id] - mid + pos[i]; });
      var cs = kids.map(function(l){ return childTarget[l.child]; });
      parentTarget[u.id] = (Math.min.apply(null, cs) + Math.max.apply(null, cs)) / 2;
    });

    var nextX = {};
    doc.persons.forEach(function(p){
      if(!visible[p.id]) return;
      var ts = [], ws = [];
      var pu = primaryParentUnionOf(p.id);
      if(pu && childTarget[p.id] !== undefined && visible[pu.a] && (!pu.b || visible[pu.b])){
        ts.push(childTarget[p.id]); ws.push(1.0);
      }
      unionsOf(p.id).forEach(function(u){
        if(!visible[u.a] || (u.b && !visible[u.b])) return;
        var q = otherOf(u, p.id);
        var hasKids = linksOfUnion(u.id).some(function(l){ return l.primary && visible[l.child]; });
        if(hasKids && parentTarget[u.id] !== undefined && q && visible[q]){
          // 目标相对于「伴侣对中点」，故取一半最小中心距
          var halfGap = minDX(p.id, q)/2;
          var left = X[p.id] <= X[q];
          ts.push(parentTarget[u.id] + (left ? -halfGap : halfGap)); ws.push(1.2);
        }else if(q && visible[q] && !hasKids && childTarget[p.id] === undefined){
          var hg2 = minDX(p.id, q);
          ts.push(X[q] + (X[p.id] <= X[q] ? -hg2 : hg2)); ws.push(1.0);
        }
      });
      if(!ts.length){ nextX[p.id] = X[p.id]; return; }
      var sum = 0, wsum = 0;
      for(var i=0;i<ts.length;i++){ sum += ts[i]*ws[i]; wsum += ws[i]; }
      nextX[p.id] = sum / wsum;
    });
    for(var k in nextX) X[k] = nextX[k];

    // 行内去重叠（保序）
    rowsGen.forEach(function(row){
      var ps = row.persons;
      for(var pass=0; pass<2; pass++){
        for(var i=1;i<ps.length;i++){
          var need = minDX(ps[i-1].id, ps[i].id);
          if(X[ps[i].id] - X[ps[i-1].id] < need) X[ps[i].id] = X[ps[i-1].id] + need;
        }
        for(var j=ps.length-2;j>=0;j--){
          var need2 = minDX(ps[j].id, ps[j+1].id);
          if(X[ps[j+1].id] - X[ps[j].id] < need2) X[ps[j].id] = X[ps[j+1].id] - need2;
        }
      }
    });
  }

  /* ---- 收尾：子女组相对父母中继竖线居中 + 对称去重叠 ----------------
     旧实现的三步（按 union 顺序覆盖共享伴侣 / 贴邻修复 / 仅向右推净距）会破坏
     主循环已经收敛的子女居中：越深的代越往左漂（gen3 实测偏差 -346px）。
     新实现只做两件事，且左右对称（净距不足时两侧各让一半，不改变整行重心）：
       1) 每组子女的跨度中点严格对齐父母中继竖线；
       2) 行内相邻净距不足时对称撑开。
     两步从最深层向上交替迭代，直到全组偏差 < 0.6px。 */
  function rowSym(row){
    var ps = row.persons.slice().sort(function(a,b){ return X[a.id] - X[b.id]; });
    row.persons = ps;
    for(var pass = 0; pass < 3; pass++){
      for(var i = 1; i < ps.length; i++){
        var need = minDX(ps[i-1].id, ps[i].id);
        var gap = X[ps[i].id] - X[ps[i-1].id];
        if(gap < need){
          var d = (need - gap) / 2;
          X[ps[i-1].id] -= d; X[ps[i].id] += d;
        }
      }
      for(var j = ps.length - 2; j >= 0; j--){
        var need2 = minDX(ps[j].id, ps[j+1].id);
        var gap2 = X[ps[j+1].id] - X[ps[j].id];
        if(gap2 < need2){
          var d2 = (need2 - gap2) / 2;
          X[ps[j].id] -= d2; X[ps[j+1].id] += d2;
        }
      }
    }
  }
  function trunkX(u){ return u.b ? (X[u.a] + X[u.b]) / 2 : X[u.a]; }
  function kidsOf(u, g){
    return linksOfUnion(u.id).filter(function(l){
      return l.primary && visible[l.child] && (g == null || gen[l.child] === g);
    }).sort(function(a,b){ return kidOrderCmp(a, b); });
  }
  function halfSpan(kids){
    if(!kids.length) return 0;
    var xs = kids.map(function(l){ return X[l.child]; });
    return (Math.max.apply(null, xs) - Math.min.apply(null, xs)) / 2;
  }
  /* 行内伴侣簇：同一行里通过伴侣关系连成一体的整块。整体平移才能保持伴侣贴邻 */
  function rowClusters(row){
    var ids = row.persons.map(function(p){ return p.id; });
    var inRow = {}, idx = {}, list = [];
    ids.forEach(function(id){ inRow[id] = 1; });
    ids.forEach(function(id){
      if(idx[id] != null) return;
      var cid = list.length, q = [id], mem = [];
      idx[id] = cid;
      while(q.length){
        var cur = q.shift(); mem.push(cur);
        unionsOf(cur).forEach(function(u){
          var q2 = otherOf(u, cur);
          if(q2 && inRow[q2] && idx[q2] == null){ idx[q2] = cid; q.push(q2); }
        });
      }
      list.push(mem);
    });
    return { idx: idx, list: list };
  }
  /* 两组子女在下一行挤住时，上一行对应父母的中继竖线间距在几何上必然不够。
     这里把「非共享的伴侣」沿外侧方向拉开，使两条中继竖线之间的距离增加 extra，
     而不是让子女组偏离自己的中继竖线。 */
  function widenTrunks(ua, ub, extra){
    var shared = null;
    if(ua.a === ub.a || ua.a === ub.b) shared = ua.a;
    else if(ua.b && (ua.b === ub.a || ua.b === ub.b)) shared = ua.b;
    if(shared){
      var pa = otherOf(ua, shared), pb = otherOf(ub, shared);
      if(!pa || !pb || pa === pb) return;
      var dirA = X[pa] <= X[shared] ? -1 : 1;
      var dirB = X[pb] <= X[shared] ? -1 : 1;
      if(dirA === dirB){
        var far = Math.abs(X[pa] - X[shared]) >= Math.abs(X[pb] - X[shared]) ? pa : pb;
        X[far] += dirA * extra * 2;
      }else{
        X[pa] += dirA * extra;
        X[pb] += dirB * extra;
      }
    }else{
      [ua.a, ua.b].forEach(function(id){ if(id) X[id] -= extra/2; });
      [ub.a, ub.b].forEach(function(id){ if(id) X[id] += extra/2; });
    }
  }
  function widenParents(row){
    var ps = row.persons.slice().sort(function(a,b){ return X[a.id] - X[b.id]; });
    for(var i = 1; i < ps.length; i++){
      var a = ps[i-1].id, b = ps[i].id;
      var ua = primaryParentUnionOf(a), ub = primaryParentUnionOf(b);
      if(!ua || !ub || ua === ub) continue;
      var ka = kidsOf(ua, null), kb = kidsOf(ub, null);
      if(!ka.length || !kb.length) continue;
      var gap = Math.abs(trunkX(ub) - trunkX(ua));
      var extra = halfSpan(ka) + halfSpan(kb) + minDX(a, b) - gap;
      if(extra > 1) widenTrunks(ua, ub, extra);
    }
  }
  /* 返回最后一轮的"最大组偏差"，供外层和分离器交替收敛时判断是否已稳定 */
  function alignGroups(){
    var worst = 0;
    for(var fix = 0; fix < 16; fix++){
      worst = 0;
      for(var g = maxGen; g >= 1; g--){
        var cl = rowClusters(rowsGen[g]);
        vu.forEach(function(u){
          var kids = kidsOf(u, g);
          if(!kids.length) return;
          var xs = kids.map(function(l){ return X[l.child]; });
          var delta = trunkX(u) - (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
          if(Math.abs(delta) <= 0.4) return;
          if(Math.abs(delta) > worst) worst = Math.abs(delta);
          var seen = {};
          kids.forEach(function(l){
            var cid = cl.idx[l.child];
            if(cid == null || seen[cid]) return;
            seen[cid] = 1;
            cl.list[cid].forEach(function(id){ X[id] += delta; });
          });
        });
        rowSym(rowsGen[g]);
        widenParents(rowsGen[g]);
      }
      if(worst < 0.6) break;
    }
    return worst;
  }
  alignGroups();

  /* ---- 同组子女等间距（R11-P1-10）：相邻中心距取同一个 g、整组以父母中点为轴 ----
     放在 alignGroups 之后作为末轮整形。只移动子女本身，随后把同行非本组邻居推开；
     不再回头跑 alignGroups，否则整簇平移会把刚做好的等间距重新打散。 */
  var eqLock = {};
  function bandXover(a, b){
    var ha = (met[a] || { h:77 }).h, hb = (met[b] || { h:77 }).h;
    var ya = rowY[gen[a]], yb = rowY[gen[b]];
    return ya - 34 < yb + hb - 28 && yb - 34 < ya + ha - 28;
  }
  function equalizeKidsFinal(){
    var worst = 0;
    vu.forEach(function(u){
      if(!u.b) return;                       // 单亲没有「两位父母中点」这条轴
      for(var g = 0; g <= maxGen; g++){
        var kids = kidsOf(u, g);
        if(kids.length < 2) continue;
        var only = kids.every(function(l){
          return doc.parentLinks.filter(function(x){ return x.child === l.child; }).length === 1;
        });
        if(!only) continue;
        kids.sort(function(a,b){ return X[a.child] - X[b.child]; });
        var lo = X[kids[0].child], hi = X[kids[kids.length-1].child];
        var need = 0;
        for(var i = 1; i < kids.length; i++) need = Math.max(need, minDX(kids[i-1].child, kids[i].child));
        /* 等间距 g 同时满足组内最大相邻下限与原有跨度：不压缩布局，避免把行内其他组挤成共线 */
        var gap = Math.max(need, MIN_CENTER, (hi - lo) / (kids.length - 1));
        var cx = (X[u.a] + X[u.b]) / 2;
        kids.forEach(function(l, i){
          var target = cx + (i - (kids.length - 1) / 2) * gap;
          var d = target - X[l.child];
          X[l.child] += d;
          eqLock[l.child] = 1;
          if(Math.abs(d) > worst) worst = Math.abs(d);
        });
      }
    });
    return worst;
  }
  /* 锁定子女不再让位：冲突时只推同行的非本组邻居 */
  function pushOffLocked(){
    var ids = Object.keys(X).filter(function(id){ return visible[id]; });
    for(var pass = 0; pass < 6; pass++){
      var moved = 0;
      for(var i = 0; i < ids.length; i++){
        for(var j = i+1; j < ids.length; j++){
          var a = ids[i], b = ids[j];
          if(!bandXover(a, b)) continue;
          var la = eqLock[a], lb = eqLock[b];
          if(la && lb) continue;
          var need = Math.max(minDX(a, b), MIN_CENTER);
          var d = need - Math.abs(X[b] - X[a]);
          if(d <= 0.01) continue;
          var sg = X[b] >= X[a] ? 1 : -1;
          if(la){ X[b] += sg*d; }
          else if(lb){ X[a] -= sg*d; }
          else { X[a] -= sg*d/2; X[b] += sg*d/2; }
          moved += d;
        }
      }
      if(moved < 0.2) break;
    }
  }
  /* 非锁定子女组重新居中的父母中线（父母被等间距动了之后跟着走） */
  function recenterOtherGroups(){
    for(var pass = 0; pass < 3; pass++){
      var moved = 0;
      vu.forEach(function(u){
        if(!u.b) return;
        for(var g = 0; g <= maxGen; g++){
          var kids = kidsOf(u, g);
          if(!kids.length) continue;
          if(kids.some(function(l){ return eqLock[l.child]; })) continue;
          var xs = kids.map(function(l){ return X[l.child]; });
          var delta = (X[u.a] + X[u.b]) / 2 - (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
          if(Math.abs(delta) < 0.2) continue;
          kids.forEach(function(l){ X[l.child] += delta; });
          if(Math.abs(delta) > moved) moved = Math.abs(delta);
        }
      });
      if(moved < 0.2) break;
      pushOffLocked();
    }
  }
  /* 单个子女被同行宽邻居挤开后：把这组的「松」父母（根人物、且未被锁定）沿轴向挪开，
     让父母中点重新对准这个独子——独子必须落在两人正中间（≤1px） */
  function fixSingleAnchors(){
    for(var pass = 0; pass < 6; pass++){
      var moved = 0;
      vu.forEach(function(u){
        if(!u.b) return;
        for(var g = 0; g <= maxGen; g++){
          var kids = kidsOf(u, g);
          if(kids.length !== 1) continue;
          var k = kids[0].child;
          if(doc.parentLinks.filter(function(x){ return x.child === k; }).length !== 1) continue;
          var mx = (X[u.a] + X[u.b]) / 2, dev = X[k] - mx;
          if(Math.abs(dev) <= 0.5) continue;
          var cand = [u.a, u.b].filter(function(id){
            return !eqLock[id] && doc.parentLinks.filter(function(x){ return x.child === id; }).length === 0;
          });
          if(!cand.length) continue;
          X[cand[0]] += dev * 2;          /* dev = 独子 − 父母中点：把中点挪到独子上 */
          pushOffLocked();
          if(Math.abs(dev) > moved) moved = Math.abs(dev);
        }
      });
      if(moved < 0.4) break;
    }
  }
  equalizeKidsFinal();
  pushOffLocked();
  recenterOtherGroups();
  fixSingleAnchors();
  equalizeKidsFinal();
  pushOffLocked();

  // 应用偏移 & 归一
  /* ---- 先叠用户拖拽偏移，再对齐与硬约束分离交替收敛，最后归一 ----
     旧实现只在末尾跑一次"文字盒相交才推开"，且下限是 BOX_GAP(28)：
     把某人拖到别人身上后全图最小符号净距会掉到 ~40。现改为：
       1) 分离器同时守两条硬下限：符号净距 ≥ MIN_NET(70)（中心距 ≥126）、文字盒净距 ≥ BOX_GAP；
       2) 分离与"整簇居中到中继竖线"交替迭代，居中只整块平移，不会把已拉开的净距再压回去；
       3) 最后一手固定跑分离，净距/不重叠优先于居中（spec §5 L0 > L3）。 */
  var baseX = {};
  Object.keys(X).forEach(function(id){ baseX[id] = X[id]; });
  doc.persons.forEach(function(p){
    if(!visible[p.id]) return;
    X[p.id] += (p.offset.x || 0);
  });

  var nodes = {};
  function rebuildNodes(){
    nodes = {};
    doc.persons.forEach(function(p){
      if(!visible[p.id]) return;
      var mm = met[p.id] || { w: SYMBOL, h: 77, nameLines: [''], itemLines: [], extra: 0 };
      nodes[p.id] = {
        id: p.id, x: X[p.id], y: rowY[gen[p.id]] + (p.offset.y || 0),
        rowY: rowY[gen[p.id]], gen: gen[p.id], w: mm.w, h: mm.h, out: symbolOuterPx(p), code: personCode(p),
        m: mm
      };
    });
  }
  function bandOverlap(A, B){
    return A.y - 34 < B.y + B.h - 28 && B.y - 34 < A.y + A.h - 28;
  }
  /* 被用户拖过的框：保持用户落点（不再"吸附回原位"），把不满足硬间距的邻居推开。
     旧做法是在"期望位置 + 所有禁区边界"里挑最近合法点，当落点紧邻某个宽邻居时，
     最近合法点恰好就是拖动前的位置，表现为"怎么拖都不动"。现在改为推邻居。
     正在被指针拖动的那个框（activeDragId）是唯一不可让位的固定点：它落在哪就留在哪，
     其余一律让位；否则"拖到别人正上方"时会被平分逻辑顶回一半，看起来像没拖到位。 */
  function resolveMoved(){
    var ids = Object.keys(nodes);
    var active = activeDragId && nodes[activeDragId] ? activeDragId : null;
    var movedIds = ids.filter(function(id){
      var pp = personById(id);
      /* R14：只有「用户亲手拖过」的人才受保护（dragX）；求解器自己推出来的 offset 不算，
         否则每次刷新都会被重新分赃一次，位置逐次漂移 */
      return !!(pp && Math.abs(pp.dragX || 0) > 0.5);
    });
    movedIds.forEach(function(id){
      for(var pass = 0; pass < 4; pass++){
        var moved = false;
        for(var k = 0; k < ids.length; k++){
          var o = ids[k];
          if(o === id) continue;
          var me = nodes[id], nb = nodes[o];
          if(!me || !nb || !bandOverlap(me, nb)) continue;
          var need = Math.max(minDX(id, o), MIN_CENTER) + (drag ? 0.02 : 0);
          var dd = need - Math.abs(nb.x - me.x);
          if(dd <= 0.01) continue;
          var sg = nb.x >= me.x ? 1 : -1;
          if(id === active){
            /* 我在被拖：整体推开邻居 */
            nb.x = me.x + sg * need; X[o] = nb.x;
          }else if(o === active){
            /* 邻居在被拖：我让位到它的另一侧 */
            me.x = nb.x - sg * need; X[id] = me.x;
          }else{
            var op = personById(o);
            var bothMoved = !!(op && Math.abs(op.dragX || 0) > 0.5);
            if(bothMoved){

function structureSVG(){

   同档保持传入时的相对顺序（稳定排序，不因多次打开而变化） */
function byAgeDesc(list){
  var now = new Date();
  return list.map(function(p, i){
    var a = (p && !p.unborn) ? ageOf(p, now) : null;
    return { p:p, i:i, a:(a == null ? null : a) };
  }).sort(function(x, y){
    if(x.a == null && y.a == null) return x.i - y.i;
    if(x.a == null) return 1;
    if(y.a == null) return -1;
    if(y.a !== x.a) return y.a - x.a;
    return x.i - y.i;
  }).map(function(r){ return r.p; });

/* 子女默认左右次序（P2）：显式 order 优先（用户 ↑/↓ 调过的顺序必须保留）；
   全部同序时按年龄降序（大的在左），无出生日期 / 未出生排在该组最右；
   age 相同或无值再按 id 作稳定兜底，保证每次打开顺序一致 */
function kidOrderCmp(a, b){
  var oa = a.order || 0, ob = b.order || 0;
  if(oa !== ob) return oa - ob;
  var ka = personAgeKey(personById(a.child)), kb = personAgeKey(personById(b.child));
  if(ka == null && kb == null) return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
  if(ka == null) return 1;
  if(kb == null) return -1;
  if(kb !== ka) return kb - ka;
  return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);

function reseqKids(u){
  if(!u) return;
  var g = linksOfUnion(u.id);
  if(g.some(function(l){ return l.manual; })) return;
  g.sort(function(a, b){
    var ka = personAgeKey(personById(a.child)), kb = personAgeKey(personById(b.child));
    if(ka == null && kb == null) return a.id < b.id ? -1 : 1;
    if(ka == null) return 1;
    if(kb == null) return -1;
    if(kb !== ka) return kb - ka;
    return a.id < b.id ? -1 : 1;
  });

/* 数据完整性自检（运行期断言）：不只看"路径有没有生成"，还要看"线有没有真的接到父母身上"。
   1) 主归属亲子关系缺线段；2) union 引用不存在；3) 中继线起点不在伴侣线上（悬空）；
   4) 子女入线顶端与兄弟横线 y 不一致（脱节） */
function verifyStructure(world){
  if(!world) return;
  var drawn = {}, topY = {};
  $$('.gx-lkin', world).forEach(function(g){
    var lid = g.getAttribute('data-lid');
    drawn[lid] = 1;
    var p = g.querySelector('path');
    var m = p && /^M([-\d.]+) ([-\d.]+)L/.exec(p.getAttribute('d') || '');
    if(m) topY[lid] = +m[2];
  });
  var missing = [], dangling = [], broken = [];
  doc.parentLinks.forEach(function(l){
    if(!personById(l.child)){ dangling.push(l.id + '→' + l.child + '(人物不存在)'); return; }
    var childVisible = !!layout.visible[l.child];
    var u = unionById(l.union);
    if(!childVisible) return;
    if(!u){ dangling.push(l.id + '→' + l.child + '(union ' + l.union + ' 不存在)'); return; }
    if(!l.primary) return;
    if(!layout.visible[u.a] || (u.b && !layout.visible[u.b])) return;
    if(!drawn[l.id]) missing.push(l.id + '→' + l.child + ' 无入线');
  });
  lastTrunks.forEach(function(t){
    var kids = t.kids.filter(function(l){ return layout.visible[l.child]; });
    if(!kids.length) return;
    var hx = t.head[0].x, hy = t.head[0].y;
    if(!t.single && !ptOnPts(t.head[0], t.couple, 1.2)){
      broken.push(t.u.id + ' 中继线起点(' + r2(hx) + ',' + r2(hy) + ')不在伴侣线上，子女 ' +
        kids.map(function(l){ return l.child; }).join('/'));
    }
    kids.forEach(function(l){
      var y = topY[l.id];
      if(y !== undefined && Math.abs(y - t.sibY) > 0.6){
        broken.push('l' + l.id + '(' + l.child + ') 入线顶端 y=' + r2(y) + ' 与兄弟横线 y=' + r2(t.sibY) + ' 脱节');
      }
    });
  });
  if(missing.length) console.warn('[genogram] 以下亲子关系未能布线：' + missing.join(', '));
  if(dangling.length) console.warn('[genogram] 以下亲子关系引用了不存在的伴侣单元：' + dangling.join(', '));
  if(broken.length) console.warn('[genogram] 以下亲子线未接到父母身上：' + broken.join('; '));
}

var TAG_SEP = /[\n\r，。、；：？！“”‘’（）【】《》〈〉「」『』〔〕〖〗…—～·,.;:?!"'()\[\]{}<>\/\\|_+=*&^%$#@~`\-！＂＃＄％＆＇＊＋－．／＜＝＞＠［＼］＾＿｀｛｜｝～]/;

/* 删除标签文本：跨条目清除所有同名片段，片段清空的条目一并移除 */
function removeTag(p, text){
  var out = [];
  (p.notes || []).forEach(function(n){
    if(!n || n.type !== 'tag'){ out.push(n); return; }
    var parts = String(n.value || '').split(TAG_SEP).map(function(x){ return x.trim(); })
      .filter(Boolean).filter(function(x){ return x !== text; });
    if(parts.length){ n.value = parts.join('\n'); out.push(n); }
  });
  p.notes = out;
}
function tagsOf(p){
  var out = [];
  (p.notes || []).forEach(function(n){
    if(!n || n.type !== 'tag') return;
    String(n.value || '').split(TAG_SEP).forEach(function(x){
      x = x.trim();
      if(x && out.indexOf(x) < 0) out.push(x);
    });
  });
  return out;
}
function noteMulti(v){ return String(v || '').indexOf('\n') >= 0 || String(v || '').length > 26; }

function addTags(p, text){

  String(text || '').split(TAG_SEP).forEach(function(x){

}

function catPopReveal(){

function catPopBindLong(){
  if(!catPopEl) return;
  /* 删态只用红叉：不再叠长按，避免两条删除路径同时触发 */
  if(catPopDel) return;
  Array.prototype.forEach.call(catPopEl.querySelectorAll('.cp-item[data-cpid]'), function(it){
    var tm = null;
    it.addEventListener('pointerdown', function(ev){
      ev.stopPropagation();
      if(tm) clearTimeout(tm);
      tm = setTimeout(function(){
        tm = null;
        catPopLong = true;
        catDelete(it.getAttribute('data-cpid'));
        setTimeout(function(){ catPopLong = false; }, 420);
      }, 550);
    });
    it.addEventListener('pointerup', function(){ if(tm){ clearTimeout(tm); tm = null; } });
    it.addEventListener('pointercancel', function(){ if(tm){ clearTimeout(tm); tm = null; } });
    it.addEventListener('pointerleave', function(){ if(tm){ clearTimeout(tm); tm = null; } });
  });
}
function catPopOpen(btn, pid){
  var p = personById(pid);
  if(!p) return;
  if(!catPopEl){
    catPopEl = document.createElement('div');
    catPopEl.id = 'catPop';
    catPopEl.className = 'cat-pop';
    catPopEl.setAttribute('hidden', '');
    catPopEl.addEventListener('click', function(ev){
      var cx = ev.target.closest('.cp-x');
      if(cx){
        ev.preventDefault(); ev.stopPropagation();
        if(catPopLong) return;   /* 长按已处理：同一次操作不重复删 */
        catDelete(cx.getAttribute('data-cpx'));
        return;
      }
      var it = ev.target.closest('.cp-item[data-cpid]');
      if(it){
        if(catPopLong || catPopDel){ ev.preventDefault(); ev.stopPropagation(); return; }
        noteCatSel = it.getAttribute('data-cpid');
        catPopClose();
        if(selection.type === 'person') renderPanel();
        return;
      }
      var act = ev.target.closest('[data-cpact]');
      if(!act) return;
      var a = act.getAttribute('data-cpact');
      if(a === 'del'){
        /* 删除态只是界面状态：不写文档、不进撤销栈 */
        catPopDel = !catPopDel;
        catPopPaint();
        return;
      }
      if(a === 'add'){
        var box = catPopEl.querySelector('.cp-new');
        box.removeAttribute('hidden');
        var qi = box.querySelector('.cp-input');
        qi.value = '';
        qi.focus();
        return;
      }
      if(a === 'confirm'){
        var p = personById(catPopPid);
        if(!p) return;
        var q2 = catPopEl.querySelector('.cp-input');
        var nm = (q2.value || '').trim();
        if(!nm){ q2.focus(); return; }
        var cs = catsOf(p);
        if(cs.some(function(c){ return c.name === nm; })){ q2.focus(); return; }
        pushHistory();
        var nid = 'c' + uid('c').slice(1);
        /* 必须写进 p.cats 本体：catsOf() 返回的是 filter 出的副本，push 到副本会丢失 */
        if(!Array.isArray(p.cats)) p.cats = cs.slice();
        p.cats.push({ id:nid, name:nm.slice(0, 12) });
        noteCatSel = nid;
        catPopClose();
        commit(false);
      }
    });
    document.body.appendChild(catPopEl);
  }
  catPopPid = pid;
  catPopLong = false;
  catPopDel = false;
  catPopEl.innerHTML = catPopBody(p, draftCat(p));
  catPopEl.removeAttribute('hidden');
  catPopBindLong();
  var r = btn.getBoundingClientRect();
  var h = catPopEl.offsetHeight || 220;
  var top = r.bottom + 4;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
  var left = Math.max(8, Math.min(window.innerWidth - 158, r.left));
  catPopEl.style.left = left + 'px';
  catPopEl.style.top = top + 'px';
  catPopPos = { left:left, top:top };
  catPopReveal();
}
function catDelete(cid){
  if(catDeleteBusy) return;   /* 防重入：连点/长按叠加时不重复删同一项 */
  var p = personById(catPopPid);
  if(!p) return;
  var cats = catsOf(p);
  var c = cats.filter(function(x){ return x.id === cid; })[0];
  if(!c) return;
  var used = p.notes.filter(function(n){ return n.type === cid; }).length;
  /* 叉掉 / 选「否」= 保留：直接返回，不写文档、不进撤销栈 */
  if(!confirm('是否删除此项？' + (used ? '\n（该类别下还有 ' + used + ' 条信息，将转入其他类别，不会丢失）' : ''))) return;
  catDeleteBusy = true;
  try{
  pushHistory();
  var rest = cats.filter(function(x){ return x.id !== cid; });
  /* 不静默丢条目：转入剩余的第一个类别；一个都不剩时新建「未分类」承接 */
  var into = rest[0] || { id: 'c_uncat', name: '未分类' };
  p.notes.forEach(function(n){
    if(n.type === cid){ n.type = into.id; n.label = into.name; }
  });
  p.cats = rest.length ? rest : [into];
  if(noteCatSel === cid) noteCatSel = into.id;
  var keepDel = catPopDel;
  commit(true);
  if(keepDel) catPopPaint(); else catPopClose();
  } finally { catDeleteBusy = false; }
}

function refreshDateDDs(wrap){

      its.push('<button type="button" class="dd-it' + (on ? ' sel' : '') + '" data-ddv="' +
        esc(o.value) + '">' + esc(o.text) + '</button>');

/* R18-4：年月变化时重建日选项，只保留当月真实存在的日；原选中日越界则归「不填」 */
function refreshDaySel(wrap){
  if(!wrap) return 31;
  var ysel = wrap.querySelector('select[data-dpy], select[data-upy]');
  var msel = wrap.querySelector('select[data-dpm], select[data-upm]');
  var dsel = wrap.querySelector('select[data-dpd], select[data-upd]');
  if(!dsel) return 31;
  var yv = ysel ? ysel.value : '', mv = msel ? msel.value : '';
  var max = (yv && mv) ? daysInMonth(+yv, +mv) : 31;
  var cur = dsel.value;

  for(var d = 1; d <= max; d++) html += '<option value="' + d + '"' + (String(d) === cur ? ' selected' : '') + '>' + d + '</option>';
  dsel.innerHTML = html;
  if(cur && +cur > max) dsel.value = '';
  refreshDateDDs(wrap);

}

function revealSelected(lst){

  ov.innerHTML = '<div class="nm-bx"><div class="nm-hd"><b>' + esc(catName(p, n.type)) + '</b>' +
    '<span style="flex:1"></span><button class="mini" data-nm="cancel" aria-label="取消">×</button>' +
    '<button class="mini" data-nm="save">完成</button></div><textarea></textarea></div>';
  document.body.appendChild(ov);
  var ta = ov.querySelector('textarea');
  ta.value = n.value;
  ta.focus();
  ta.selectionStart = ta.selectionEnd = ta.value.length;
  function close(save){
    if(save && ta.value !== n.value){ pushHistory(); n.value = ta.value; }
    if(ov.parentNode) ov.parentNode.removeChild(ov);
    if(save) commit(false);
  }
  ov.querySelector('[data-nm="cancel"]').onclick = function(){ close(false); };
  ov.querySelector('[data-nm="save"]').onclick = function(){ close(true); };
  ov.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ e.stopPropagation(); close(false); }
  });
}

var lastPanelKey = '';
function renderPanel(){
  var panel = $('#panel');
  var prevKey = lastPanelKey;
  lastPanelKey = selection.type + ':' + selection.id;
  function paint(html){
    /* 面板每次提交都会整体重绘；记住当前焦点在面板控件里的序号，重绘后放回去，
       这样方向键/回车在遥控器或手柄上连续操作时焦点不会掉到 body */
    var ae = document.activeElement, focusIdx = -1;
    if(ae && panel.contains(ae)){
      var list = panel.querySelectorAll('input,select,textarea,button');
      for(var i=0;i<list.length;i++){ if(list[i] === ae){ focusIdx = i; break; } }
    }
    panel.innerHTML = html;
    /* 自绘下拉（伴侣/亲子/情感线状态）：渲染即滚到已选项并临时高亮 */
    Array.prototype.forEach.call(panel.querySelectorAll('.pk-list'), revealSelected);
    /* 角标按实际渲染高度判断：超过一行才出现（不靠字符数猜） */
    Array.prototype.forEach.call(panel.querySelectorAll('.nta'), function(ta){
      var btn = ta.parentNode ? ta.parentNode.querySelector('.ntmore') : null;
      if(!btn) return;
      if(ta.scrollHeight > ta.clientHeight + 2) btn.removeAttribute('hidden');
      else btn.setAttribute('hidden', '');
    });
    if(prevKey !== lastPanelKey) panel.scrollTop = 0;
    if(focusIdx >= 0){
      var list2 = panel.querySelectorAll('input,select,textarea,button');
      if(list2.length > focusIdx){ try{ list2[focusIdx].focus(); }catch(e){} }
    }
    syncPanelOpen();
  }
  if(selection.type === 'person'){
    var p = personById(selection.id);
    if(!p){ selection = { type:null, id:null }; lastPanelKey = 'null:null'; }
    else{ paint(personPanel(p)); return; }
  }
  if(selection.type === 'emotion'){
    var e = doc.emotionalLinks.filter(function(x){ return x.id === selection.id; })[0];
    if(e){ paint(emotionPanel(e)); return; }
    selection = { type:null, id:null };
    lastPanelKey = 'null:null';
  }
  if(selection.type === 'union'){
    var u = unionById(selection.id);
    if(u){ paint(unionPanel(u)); return; }
    selection = { type:null, id:null };
    lastPanelKey = 'null:null';
  }
  if(selection.type === 'link'){
    var l = doc.parentLinks.filter(function(x){ return x.id === selection.id; })[0];
    if(l){ paint(linkPanel(l)); return; }
    selection = { type:null, id:null };
    lastPanelKey = 'null:null';
  }
  paint(emptyPanel());
}
function syncPanelOpen(){
  var panel = $('#panel');
  /* 没有选中对象时面板必须完全退出布局：hidden 走 display:none!important，
     同时清掉 .open（小屏 .open 会把空面板从底部推上来盖住画布） */
  var want = !!selection.type && !panelHold;
  var narrow = window.innerWidth <= 760;
  var was = document.body.classList.contains('pnl');
  var wasOpen = panelVis;
  panelVis = want;
  panel.hidden = !want;
  panel.classList.toggle('open', want && narrow);
  document.body.classList.toggle('pnl', want && narrow);
  /* 小屏首次展开面板时画布变矮：未手动平移则整个 fit；已平移则把视图夹回可见区 */
  if(want && narrow && !was){
    setTimeout(function(){
      if(!userPanned) centerContent({ fit:true, pad:24 });
      else { contentClamp(); applyView(false); }
    }, 70);
  }
  /* 关闭面板的策略：只重新居中、不改缩放（画布变宽后内容仍在视野里），
     且用户手动平移过就不打扰；桌面端面板同样占布局宽度，所以要一起处理 */
  if(!want && wasOpen && !userPanned && Date.now() >= viewMuteUntil){
    setTimeout(function(){ centerContent({ fit:false, pad:56 }); }, 70);
  }
}

function updateToolbar(){

function hideMenu(){ $('#menu').classList.remove('open'); }
/* R21：触屏长按浮动动作条。数据源就是 personMenuItems / canvasMenuItems，不另写命令逻辑 */
var actBarItems = null, actBarAnchor = null;
function actBarIsOpen(){ var b = $('#actbar'); return !!(b && b.classList.contains('open')); }
function hideActBar(){
  var b = $('#actbar');
  if(!b) return;
  b.classList.remove('open');
  actBarItems = null; actBarAnchor = null;
}
function placeActBar(){
  var bar = $('#actbar');
  if(!bar || !actBarAnchor || !actBarAnchor.getBoundingClientRect) return;
  var r = actBarAnchor.getBoundingClientRect();
  var bw = bar.offsetWidth, bh = bar.offsetHeight;
  var below = window.innerHeight - r.bottom - 8, above = r.top - 8;
  var y = (below >= bh + 10 || below >= above) ? r.bottom + 10 : r.top - bh - 10;
  y = Math.max(8, Math.min(y, window.innerHeight - bh - 8));
  var x = r.left + r.width/2 - bw/2;
  x = Math.max(8, Math.min(x, window.innerWidth - bw - 8));
  bar.style.left = Math.round(x) + 'px';
  bar.style.top = Math.round(y) + 'px';
}
function showActBar(items, anchorEl){
  var bar = $('#actbar');
  if(!bar) return;
  /* 拖动中/拖动刚结束：任何浮层都不许冒出来 */
  if(popSuppressed()) return;
  actBarItems = items; actBarAnchor = anchorEl;
  bar.innerHTML = items.map(function(it, i){
    if(it === '-') return '';
    return '<button data-mi="' + i + '"' + (it.disabled ? ' disabled style="opacity:.4"' : '') +
      (it.danger ? ' class="danger"' : '') + '>' + esc(it.label) + '</button>';
  }).join('');
  bar.onclick = function(ev){
    var b = ev.target.closest('button[data-mi]');
    if(!b) return;
    var it = actBarItems && actBarItems[+b.getAttribute('data-mi')];
    hideActBar();
    if(it && it.run) it.run();
  };
  bar.classList.add('open');
  placeActBar();
  /* 小屏选中会触发一次 fit，节点位置随后微移：再对齐一次，确保动作条始终贴在对象旁 */
  setTimeout(function(){ if(actBarIsOpen()) placeActBar(); }, 140);
}
function showMenu(x, y, items){
  var m = $('#menu');
  m.innerHTML = items.map(function(it, i){
    if(it === '-') return '<div class="msep"></div>';
    return '<button data-mi="' + i + '"' + (it.disabled ? ' disabled style="opacity:.4"' : '') +
      (it.danger ? ' class="danger"' : '') + '>' + esc(it.label) + '</button>';
  }).join('');
  m.classList.add('open');
  var w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
  m.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
  m.onclick = function(ev){
    var b = ev.target.closest('button[data-mi]');
    if(!b) return;
    var it = items[+b.getAttribute('data-mi')];
    hideMenu();
    if(it && it.run) it.run();
  };
}

/* ============ 13. 数据操作 ============ */
function fixPrimary(){
  var byChild = {};
  doc.parentLinks.forEach(function(l){ (byChild[l.child] = byChild[l.child] || []).push(l); });
  Object.keys(byChild).forEach(function(c){
    var ls = byChild[c];
    var prim = ls.filter(function(l){ return l.primary; });
    if(prim.length > 1) prim.slice(1).forEach(function(l){ l.primary = false; });
    if(!prim.length) ls[0].primary = true;
  });
}
function commit(animate, opts){
  opts = opts || {};
  fixPrimary();
  if(!opts.noLayout) relayout();
  render(animate === undefined ? false : animate, opts.skipPanel);
  if(!opts.noSave) autosave();
}
/* R18-2：间距诊断通道（只读，不进界面）

  var n = layout.nodes[p.id];
