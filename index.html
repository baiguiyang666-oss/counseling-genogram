<!doctype html>
<!--
  心理咨询家谱图编辑器 · Counseling Genogram Editor
  单文件、零依赖、无 CDN、无构建步骤：本文件即完整应用，双击即可离线使用。

  项目 counseling-genogram   ·   版本 1.0.0 (2025-2026)
  许可 MIT                  ·   版权 白贵阳 — 商用必须保留版权声明并署名，详见 NOTICE.md

  符号体系参考 McGoldrick 等公开家谱图传统，全部图形为本项目自绘 SVG，
  不含任何商业软件的代码或素材。所有数据仅保存在本机浏览器 localStorage，不联网。

  源文件分区：样式 → 规格表（人物/结构/亲子/情感线型） → 数据层（规范化与存档）
  → 排版布线 → 渲染 → 交互 → 导出（PNG / PDF 打印 / HTML / JSON）
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家谱图 · Genogram</title>
<style>
:root{
  --bg:#f6f5f1;--canvas:#fbfaf7;--panel:#ffffff;
  --ink:#1f2937;--ink-2:#475467;--muted:#6b7280;
  --hair:#e7e4dc;--hair-strong:#dbd7cd;
  --accent:#2f6b5f;--accent-hover:#275a50;--accent-weak:#eaf1ee;--accent-ring:rgba(47,107,95,.22);
  --danger:#b23a34;--dot:#e4e0d6;
  --r-sm:6px;--r-md:10px;--r-lg:14px;
  --sh-1:0 1px 2px rgba(20,30,40,.05);
  --sh-2:0 1px 2px rgba(20,30,40,.04),0 14px 34px rgba(20,30,40,.07);
  --font:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);
  color:var(--ink);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-size:13.5px;line-height:1.55;
}
#app{display:flex;flex-direction:column;height:100%}
#toolbar{
  display:flex;align-items:center;gap:8px;padding:0 14px;min-height:50px;background:#fff;
  border-bottom:1px solid var(--hair);flex:0 0 auto;overflow-x:auto;overflow-y:hidden;
  white-space:nowrap;scrollbar-width:thin;box-shadow:0 1px 0 rgba(20,30,40,.02);z-index:5;
}
.brand{font-size:15px;font-weight:600;letter-spacing:.01em;flex:0 0 auto}
.brand .sub{font-weight:400;color:var(--muted);font-size:10.5px;margin-left:7px;letter-spacing:.08em}
#title{
  flex:0 0 auto;width:156px;border:1px solid transparent;background:transparent;border-radius:var(--r-sm);
  padding:4px 8px;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);
  transition:border-color .15s,background .15s;
}
#title:hover{border-color:var(--hair)}
#title:focus{border-color:var(--accent);outline:none;background:#fff;box-shadow:0 0 0 2px var(--accent-weak)}
.tb-group{display:flex;align-items:center;gap:2px;flex:0 0 auto}
button.tb{
  font-family:inherit;font-size:13px;font-weight:450;padding:0 11px;height:30px;border-radius:var(--r-sm);
  border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;
  min-height:30px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;
}
button.tb:hover:not(:disabled){background:#f3f1eb;color:var(--ink);border-color:transparent}
button.tb:active:not(:disabled){background:#eae7df}
button.tb:disabled{opacity:.38;cursor:default}
button.tb:focus-visible,.node:focus-visible{outline:2px solid var(--accent-ring);outline-offset:2px}
button.tb.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
button.tb.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
.sep{width:1px;height:18px;background:var(--hair);margin:0 6px;flex:0 0 auto}
#stage{position:relative;flex:1 1 auto;display:flex;min-height:0}
#view{position:relative;flex:1 1 auto;min-width:0;min-height:0}
#canvas{
  position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;background-color:var(--canvas);
  background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.4px);
  background-size:26px 26px;background-position:0 0;
}
#canvas.panning{cursor:grabbing}
#ghost{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
#emptyHint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;padding:24px;
}
#emptyHint[hidden]{display:none}
.eh-card{
  pointer-events:auto;background:#fff;border:1px solid var(--hair);border-radius:var(--r-lg);
  box-shadow:var(--sh-2);padding:30px 32px 28px;max-width:400px;text-align:center;
}
.eh-card svg{display:block;margin:0 auto 12px}
.eh-card h2{margin:0 0 6px;font-size:17px;font-weight:500;letter-spacing:.01em}
.eh-card p{margin:0 0 18px;font-size:13px;line-height:1.6;color:var(--muted)}
#panel{
  width:340px;flex:0 0 340px;background:var(--panel);border-left:0;
  overflow-y:auto;padding:16px 18px 56px;font-size:13.5px;line-height:1.55;
}
#panel::-webkit-scrollbar{width:9px}
#panel::-webkit-scrollbar-thumb{background:#dedbd2;border-radius:5px}
#panel[hidden]{display:none!important}
.sec{margin-bottom:18px}
.sec h3{
  margin:0 0 9px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.05em;
  display:flex;align-items:center;gap:8px;line-height:1.4;
}
.sec h3::after{content:"";flex:1;height:1px;background:var(--hair)}
.fld{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fld>span{flex:0 0 58px;color:var(--muted);font-size:12.5px}
.fld input[type=text],.fld input[type=number],.fld select,.fld input[type=date]{
  flex:1;min-width:0;font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--hair);
  border-radius:var(--r-sm);background:#fcfbf8;color:var(--ink);transition:border-color .15s,box-shadow .15s;
  font-variant-numeric:tabular-nums;
}
.fld input[type=number]{font-variant-numeric:tabular-nums}
.fld input:focus,.fld select:focus,.note-row input:focus,.note-row select:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak);background:#fff;
}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;margin:0 0 9px;color:var(--ink-2);cursor:pointer}
.row-2{display:flex;gap:8px}
.row-2 .fld{flex:1;margin-bottom:8px}
.row-2 .fld>span{flex:0 0 42px}
.yr-row{display:flex;align-items:center;gap:8px}
.yr-row input[type=number]{flex:1;min-width:0}
.yr-row .chk{margin:0;font-size:12px;white-space:nowrap}
.note-row,.urec,.crec{
  border:1px solid var(--hair);border-radius:var(--r-md);padding:9px;margin-bottom:8px;background:#fbfaf7;
}
.note-row .nr-top{display:flex;gap:6px;margin-bottom:6px}
.note-row select{flex:0 0 76px;font-size:12.5px;padding:4px 4px;border:1px solid var(--hair);border-radius:var(--r-sm);background:#fff;font-family:inherit;color:var(--ink-2)}
.note-row input{flex:1;min-width:0;font-size:12.5px;padding:4px 6px;border:1px solid var(--hair);border-radius:var(--r-sm);font-family:inherit;background:#fff}
.note-row .nr-bot{display:flex;gap:6px}
.note-row .nr-bot input{flex:1}
.mini{
  font-family:inherit;font-size:12px;padding:3px 8px;border-radius:var(--r-sm);border:1px solid var(--hair);
  background:#fff;cursor:pointer;color:var(--ink-2);height:auto;min-height:26px;transition:border-color .15s,color .15s,background .15s;
}
.mini:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.mini.danger:hover{border-color:var(--danger);color:var(--danger);background:#fbeeed}
.line-title{font-size:13px;color:var(--ink);font-weight:500;margin:0 0 7px}
.empty{color:var(--muted);font-size:13px;line-height:1.7;padding:6px 0}
.hint{color:var(--muted);font-size:12.5px;line-height:1.65;margin-top:7px}
.meaning{border:1px solid var(--hair);border-left:3px solid var(--accent);border-radius:var(--r-md);background:#fcfbf8;padding:10px 12px}
.meaning .m-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.meaning .m-head b{font-size:13px;font-weight:500;color:var(--ink)}
.meaning code{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11px;color:var(--accent);background:var(--accent-weak);border-radius:4px;padding:1px 5px}
.meaning p{margin:0;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.tag{
  display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--accent-weak);
  color:var(--accent);margin-left:6px;font-weight:450;
}
#menu{
  position:fixed;z-index:50;min-width:158px;background:#fff;border:1px solid var(--hair);
  border-radius:var(--r-md);box-shadow:var(--sh-2);padding:5px;display:none;font-size:13px;
}
#menu.open{display:block}
#menu button{
  display:block;width:100%;text-align:left;font-family:inherit;font-size:13px;padding:7px 10px;
  border:0;background:transparent;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2);
}
#menu button:hover,#menu button:focus{background:var(--accent-weak);color:var(--ink);outline:none}
#menu .msep{height:1px;background:var(--hair);margin:4px 2px}
#menu button.danger{color:var(--danger)}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:#20292f;color:#fff;
  padding:10px 18px;border-radius:var(--r-md);font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:80;max-width:78vw;box-shadow:var(--sh-2);
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.gx-inline{
  position:absolute;z-index:6;box-sizing:border-box;padding:0 5px;border:1px solid #2c6e63;border-radius:3px;
  background:#fff;color:#24313a;font:500 13px "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  outline:none;box-shadow:0 2px 10px rgba(24,32,38,.16);
}
#help{
  position:fixed;inset:0;background:rgba(24,32,38,.36);z-index:60;display:none;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);
}
#help.open{display:flex}
.help-box{
  background:#fff;border-radius:var(--r-lg);max-width:860px;width:100%;max-height:88vh;overflow:auto;
  padding:22px 26px 28px;box-shadow:var(--sh-2);
}
.help-box h2{margin:0 0 4px;font-size:18px;font-weight:500}
.help-box h4{margin:20px 0 8px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.05em}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:6px 18px}
.legend-item{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:2px 0}
.legend-item svg{flex:0 0 132px}
.legend-item .en{color:var(--muted);font-size:11.5px}
.help-note{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:10px}
.kbd{
  display:inline-block;border:1px solid var(--hair);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font-size:11.5px;background:#fcfbf8;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;color:var(--ink-2);
}
.close-x{
  float:right;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);
}
/* ---- 新增：命中区 / 含义卡 / 选择器 / 对照表 / 主题 ---- */
.gx-ehit{fill:none;stroke:transparent;stroke-width:14}
.gx-ehit:hover{stroke:rgba(47,107,95,.10)}
.gx-age-unk{fill:#9aa4ae;font-weight:400}
.gx-elink:hover path,.gx-ulink:hover path{stroke-opacity:1}
.meaning{border:1px solid var(--hair);border-left:3px solid var(--accent);border-radius:var(--r-md);background:#fcfbf8;padding:10px 12px}
.meaning .m-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.meaning .m-head b{font-size:13px;font-weight:500;color:var(--ink)}
.meaning code{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11px;color:var(--accent);background:var(--accent-weak);border-radius:4px;padding:1px 5px}
.meaning p{margin:0 0 3px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.meaning .m-tag{font-size:11px;color:var(--muted);border:1px solid var(--hair);border-radius:4px;padding:0 5px}
.pick{margin-top:6px}
.pick .pk-q{width:100%;font-size:12.5px;padding:5px 8px;border:1px solid var(--hair);border-radius:var(--r-sm);font-family:inherit;background:#fff;color:var(--ink)}
.pk-list{max-height:196px;overflow:auto;margin-top:5px;border:1px solid var(--hair);border-radius:var(--r-sm);background:#fff}
.pk-item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;
  border:0;border-bottom:1px solid #f1eee7;background:#fff;font-family:inherit;font-size:12.5px;
  padding:6px 9px;cursor:pointer;color:var(--ink-2);
}
.pk-item:last-child{border-bottom:0}
.pk-item{justify-content:flex-start;align-items:center}
.pk-item em{font-style:normal;font-size:10.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;flex:0 0 auto}
.pk-item .pk-sv{flex:0 0 auto;line-height:0;display:block}
.pk-item .pk-tx{flex:1 1 auto;min-width:0;text-align:left;display:block}
.pk-item .pk-tx b{display:block;font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-item .pk-tx i{display:block;font-style:normal;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pk-item:hover{background:var(--accent-weak);color:var(--ink)}
.pk-item.sel{background:var(--accent-weak);color:var(--accent);font-weight:500}
.legend-row{
  display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;
  border-bottom:1px solid #f1eee7;padding:7px 4px;cursor:pointer;border-radius:4px;
}
.legend-row:hover{background:var(--accent-weak)}
.legend-row .lr-tags{font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.01em}
.legend-row svg{display:block}
.legend-row .lr-name{font-size:13px;color:var(--ink);font-weight:450}
.legend-row .lr-code{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;display:block;margin-top:1px}
.legend-row .lr-desc{font-size:12px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.legend-row .lr-apply{border:0;background:none;color:var(--accent);font-family:inherit;font-size:11.5px;cursor:pointer;padding:0;margin-top:3px}
.legend-row .lr-apply:hover{text-decoration:underline}
.legend-sec{font-size:12px;color:var(--muted);letter-spacing:.05em;margin:16px 0 4px;font-weight:500}
.legend-search{width:100%;padding:8px 10px;border:1px solid var(--hair);border-radius:var(--r-sm);font-family:inherit;font-size:13px;margin-bottom:6px}
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.person-cell{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.theme-card{border:1px solid var(--hair);border-radius:var(--r-md);background:#fff;padding:10px;cursor:pointer;font-family:inherit;text-align:left}
.theme-card:hover{border-color:var(--accent)}
.theme-card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-ring)}
.theme-card .sw{display:flex;gap:4px;margin-bottom:7px}
.theme-card .sw i{width:18px;height:18px;border-radius:4px;display:block;border:1px solid rgba(0,0,0,.08)}
.theme-card b{font-size:12.5px;font-weight:500;color:var(--ink)}
.color-rows{display:grid;gap:6px;margin-top:10px}
.color-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.color-row input[type=color]{width:38px;height:26px;border:1px solid var(--hair);border-radius:var(--r-sm);background:#fff;padding:2px}
.guide-step{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f1eee7}
.guide-step:last-child{border:0}
.guide-num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent-weak);color:var(--accent);font-size:12.5px;display:flex;align-items:center;justify-content:center}
.guide-step p{margin:0;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
/* ---- 导出预览 / 打印文档 ---- */
#xprev{position:fixed;inset:0;background:rgba(24,32,38,.5);z-index:70;display:none;padding:18px;box-sizing:border-box}
#xprev.open{display:flex;justify-content:center}
.xp-wrap{background:#efece5;border-radius:var(--r-lg);box-shadow:var(--sh-2);width:min(1180px,100%);display:flex;flex-direction:column;overflow:hidden}
.xp-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.xp-title{font-weight:500;font-size:13.5px}
.xp-extra{font-size:11.5px;color:var(--muted)}
.xp-tabs{display:flex;gap:4px;margin-left:auto}
.xp-tabs button{border:1px solid var(--hair);background:#fff;border-radius:var(--r-sm);font-family:inherit;font-size:12.5px;padding:4px 10px;cursor:pointer;color:var(--ink-2)}
.xp-tabs button.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:500}
.xp-tabs button:disabled{opacity:.4;cursor:default}
.xp-body{flex:1 1 auto;overflow:auto;padding:16px;background:#efece5}
.xp-page{background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(20,30,40,.12);padding:12px;margin:0 auto 14px;max-width:1100px}
.xp-page[hidden]{display:none}
.xp-cap{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.xp-fig svg{width:100%;height:auto;display:block}
.xp-page .dm h1{font-size:19px;font-weight:500;margin:0 0 4px}
.xp-page .dm-sub{color:#6b7280;font-size:11.5px;margin:0 0 12px}
.xp-page .dm h2{font-size:14px;font-weight:500;margin:16px 0 6px;border-bottom:1px solid var(--hair);padding-bottom:4px}
.xp-page .dm-p{break-inside:avoid;margin:0 0 8px}
.xp-page .dm-p h3{font-size:13px;font-weight:500;margin:8px 0 2px}
.xp-page .dm ul{margin:0 0 0 18px;padding:0}
.xp-page .dm li{margin:1px 0;font-size:12.5px;line-height:1.5}
.xp-page .lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 18px}
.xp-page .lg-i{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.xp-page .lg-i em{font-style:normal;color:var(--muted);font-size:10px;margin-left:6px}
.xp-page .lg-i small{display:block;color:var(--muted);font-size:10.5px;line-height:1.4}
.xp-page .gx-sym{fill:var(--gx-sym,#fff);stroke:var(--gx-ink,#24313a);stroke-width:1.6}
.xp-page .gx-inner{fill:none;stroke:var(--gx-ink,#24313a);stroke-width:1.3}
.xp-page .gx-dead{stroke:var(--gx-ink,#24313a);stroke-width:1.4;fill:none;opacity:.55}
#printRoot{display:none}
@media print{
  #app,#printHead,#menu,#toast,#help,#emptyHint,#xprev{display:none!important}
  #printRoot{display:block}
  .pr-page{page-break-after:always;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .pr-page:last-child{page-break-after:auto}
  .pr-h{font-size:10.5pt;color:#555;margin:0 0 6px}
  .pr-h b{font-size:13pt;color:#1f2937}
  .pr-fig svg{width:100%;height:auto;display:block}
  .pr-doc .dm h1{font-size:15pt;font-weight:500;margin:0 0 4px}
  .pr-doc .dm-sub{color:#6b7280;font-size:10pt;margin:0 0 12px}
  .pr-doc .dm h2{font-size:12pt;font-weight:500;margin:16px 0 6px;border-bottom:1px solid #e7e4dc;padding-bottom:4px}
  .pr-doc .dm-p{break-inside:avoid;margin:0 0 8px}
  .pr-doc .dm-p h3{font-size:11pt;font-weight:500;margin:8px 0 2px}
  .pr-doc .dm ul{margin:0 0 0 18px;padding:0}
  .pr-doc .dm li{font-size:11pt;line-height:1.5;margin:1px 0}
  .pr-doc .lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 18px}
  .pr-doc .lg-i{display:flex;align-items:center;gap:8px;font-size:10.5pt;padding:3px 0}

S_('person','person_male','男性','正方形','正方形表示男性，家谱图最基础的性别符号');

S_('person','person_unknown','性别未明','菱形','菱形表示性别未知；三角形留给怀孕');

/* 年龄：符号内数字的唯一来源。无月份时按年份差估算（已故取寿年） */
function ageOf(p, now){
  if(!p) return null;
  var today = now || new Date();
  var bd = parseDay(p.birthDate);
  var by = bd ? bd.y : (typeof p.birthYear === 'number' ? p.birthYear : null);
  if(by == null) return null;
  var end = { y:today.getFullYear(), m:today.getMonth() + 1, d:today.getDate() };
  if(p.deceased){
    var dd = parseDay(p.deathDate);
    if(dd) end = dd;
    else if(typeof p.deathYear === 'number') end = { y:p.deathYear, m:12, d:31 };
  }
  var yrs = end.y - by;
  if(bd && end.m != null && (end.m < bd.m || (end.m === bd.m && end.d < bd.d))) yrs--;
  return yrs < 0 ? null : yrs;
}

var _mctx = document.createElement('canvas').getContext('2d');
var _mcache = {};
function measure(text, font){
  var k = font + '|' + text;
  if(_mcache[k] !== undefined) return _mcache[k];
  _mctx.font = font;
  var w = _mctx.measureText(text).width;
  _mcache[k] = w;
  return w;
}
function wrap(text, font, maxW, maxLines){
  var chars = Array.from(String(text || ''));
  var lines = [], cur = '', i = 0, done = false;
  while(i < chars.length){
    var t = cur + chars[i];
    if(measure(t, font) <= maxW){ cur = t; i++; }
    else{
      if(cur){
        lines.push(cur); cur = '';
        if(lines.length >= maxLines){ done = true; break; }
      }else{
        lines.push(chars[i]); i++;
        if(lines.length >= maxLines){ done = true; break; }
      }
    }
  }
  if(!done && cur && lines.length < maxLines) lines.push(cur);
  var consumedAll = i >= chars.length;
  if(!consumedAll && lines.length){
    var last = lines[lines.length - 1];
    while(last.length && measure(last + '…', font) > maxW) last = last.slice(0, -1);
    lines[lines.length - 1] = last + '…';
  }
  return lines.length ? lines : [''];
}

/* ============ 4. 规范化 / 迁移 ============ */
function normalizeDoc(d){
  if(!d || typeof d !== 'object') throw new Error('bad doc');
  var out = emptyDoc();
  out.schemaVersion = 1;
  out.meta.title = (d.meta && d.meta.title) || '未命名家谱图';
  out.meta.createdAt = (d.meta && d.meta.createdAt) || out.meta.createdAt;
  out.meta.updatedAt = new Date().toISOString();
  var persons = Array.isArray(d.persons) ? d.persons : [];
  var seen = {};
  out.persons = persons.filter(function(p){
    if(!p || typeof p !== 'object' || !p.id || seen[p.id]) return false;
    seen[p.id] = 1; return true;
  }).map(function(p){
    var o = P(p.id, p.name || '', p.gender || 'unknown');
    o.deceased = !!p.deceased;
    o.birthDate = parseDay(p.birthDate) ? p.birthDate : '';
    o.deathDate = parseDay(p.deathDate) ? p.deathDate : '';
    o.birthYear = typeof p.birthYear === 'number' ? p.birthYear : (parseDay(p.birthDate) ? parseDay(p.birthDate).y : null);
    o.deathYear = typeof p.deathYear === 'number' ? p.deathYear : (parseDay(p.deathDate) ? parseDay(p.deathDate).y : null);
    if(o.birthYear == null && typeof p.age === 'number') o.birthYear = new Date().getFullYear() - p.age;
    o.symbol = PERSON_OPTS.indexOf(p.symbol) >= 0 ? p.symbol : '';
    o.pregnancy = (p.pregnancy === 'pregnant' || p.pregnancy === 'miscarriage') ? p.pregnancy : null;
    o.collapsed = !!p.collapsed;
    o.offset = (p.offset && isFinite(p.offset.x) && isFinite(p.offset.y)) ? {x:+p.offset.x, y:+p.offset.y} : {x:0,y:0};
    o.notes = (Array.isArray(p.notes) ? p.notes : []).filter(function(n){ return n && n.type && n.type !== 'age'; }).map(function(n){
      var ty = NOTE_DEFAULT[n.type] ? n.type : 'note';
      return { id: n.id || uid('n'), type: ty, label: n.label || NOTE_DEFAULT[ty] || '', value: n.value == null ? '' : String(n.value) };
    });
    /* 重要事件 / 经历：时间允许模糊写法（2019 / 约2015 / 6岁 / 大学期间），只做长度与空值处理 */
    function cut(v, n){ return String(v == null ? '' : v).slice(0, n); }
    o.events = (Array.isArray(p.events) ? p.events : []).filter(function(e){ return e && typeof e === 'object'; }).map(function(e){
      return { id: e.id || uid('ev'), time: cut(e.time, 40), place: cut(e.place, 80), text: cut(e.text, 200),
        note: cut(e.note, 120), tag: cut(e.tag, 20) };
    });
    return o;
  });
  var pids = {}; out.persons.forEach(function(p){ pids[p.id] = 1; });
  /* 单一索引：doc.probandId 是唯一数据源；旧备份里的每人一个 isIndex 一次性迁移。
     多人带标记属于坏数据，收敛到第一个并点名告警，绝不出现两个双框 */
  var marked = persons.filter(function(p){ return p && p.isIndex; }).map(function(p){ return p.id; });
  var pid0 = (typeof d.probandId === 'string' && pids[d.probandId]) ? d.probandId : (marked.length ? marked[0] : null);
  out.probandId = pid0 || null;
  if(marked.length > 1 && pid0){
    console.warn('[genogram] 检测到 ' + marked.length + ' 人带索引标记，已收敛为唯一索引咨访：' + pid0 +
      '；已清除：' + marked.filter(function(id){ return id !== pid0; }).join('、'));
  }
  var us = Array.isArray(d.unions) ? d.unions : [], useen = {};
  out.unions = us.filter(function(u){
    if(!u || !u.id || useen[u.id] || !pids[u.a]) return false;
    if(u.b && !pids[u.b]) return false;
    if(u.b === u.a) return false;
    useen[u.id] = 1; return true;
  }).map(function(u){
    /* 旧稿/外部导入可能写的是同义状态码：统一收敛到本工具的规范键，
       否则会静默落回 married，导致"改了状态但线型没变" */
    var ST_ALIAS = { cohabit:'cohabiting', cohabitation:'cohabiting', 'living-together':'cohabiting',
      breakup:'broken', severed:'broken', cutoff:'broken', 'no-contact':'broken',
      remarry:'remarried', remarriage:'remarried', 'one-night':'oneNight', onenight:'oneNight' };
    var raw = ST_ALIAS[u.status] || u.status;
    var st = UNION_STATUS.some(function(s){ return s[0] === raw; }) ? raw : 'married';
    if(!u.b) st = 'single';
    return {
      id:u.id, a:u.a, b:u.b || null, status:st,
      since: typeof u.since === 'number' ? u.since : null,
      until: typeof u.until === 'number' ? u.until : null,
      order: typeof u.order === 'number' ? u.order : 0,
      note: u.note || ''
    };
  });
  var uids = {}; out.unions.forEach(function(u){ uids[u.id] = 1; });
  var ls = Array.isArray(d.parentLinks) ? d.parentLinks : [], lseen = {}, drops = [];
  out.parentLinks = ls.filter(function(l){
    if(!l || !l.id) return false;
    /* 坏数据不能静默丢弃：被丢掉的那条关系恰是"父母存在但孩子没入线"的来源，
       这里必须逐条列 id 告警，否则运行期断言永远看不到它们 */
    if(!pids[l.child]){ drops.push(l.id + '→' + l.child + '(人物不存在)'); return false; }
    if(!uids[l.union]){ drops.push(l.id + '(' + l.child + ')→' + l.union + '(伴侣单元不存在)'); return false; }
    if(lseen[l.id] || lseen[l.child + '@' + l.union]) return false;
    var u = out.unions.filter(function(x){ return x.id === l.union; })[0];
    if(!u) return false;
    if(l.child === u.a || l.child === u.b){ drops.push(l.id + '(' + l.child + ') 把自己当成了父母'); return false; }
    lseen[l.id] = 1; lseen[l.child + '@' + l.union] = 1;
    return true;
  }).map(function(l){
    return {
      id:l.id, child:l.child, union:l.union,
      kind: KIND.some(function(k){ return k[0] === l.kind; }) ? l.kind : 'biological',
      order: typeof l.order === 'number' ? l.order : 0,
      primary: !!l.primary
    };
  });
  // 每个 child 必须有且仅有一条 primary（若有多条，保留第一条）
  var childPrimary = {}; out.parentLinks.forEach(function(l){ if(l.primary && !childPrimary[l.child]) childPrimary[l.child] = l.id; });
  out.parentLinks.forEach(function(l){ l.primary = (childPrimary[l.child] === l.id); if(!childPrimary[l.child] && l === out.parentLinks.filter(function(x){return x.child===l.child;})[0]) { l.primary = true; childPrimary[l.child] = l.id; } });
  if(drops.length) console.warn('[genogram] 载入时丢弃了 ' + drops.length + ' 条无效亲子关系：' + drops.join('；'));

  var es = Array.isArray(d.emotionalLinks) ? d.emotionalLinks : [], eseen = {};
  out.emotionalLinks = es.filter(function(e){
    if(!e || !e.from || !e.to || e.from === e.to) return false;
    if(!pids[e.from] || !pids[e.to]) return false;
    var key = [e.from, e.to].sort().join('|');
    if(eseen[key]) return false;
    eseen[key] = 1; return true;
  }).map(function(e){
    return {
      id: e.id || uid('e'), from: e.from, to: e.to,
      type: emoCode(e.type),
      note: e.note || ''
    };
  });
  out.view = d.view && isFinite(d.view.scale) ? {x:+d.view.x || 0, y:+d.view.y || 0, scale:clamp(+d.view.scale, .25, 4)} : {x:0,y:0,scale:1};
  return out;
}

}
function loadDoc(){
  var raw = null;
  try{ raw = localStorage.getItem(K_DOC); }catch(err){}
  if(!raw) return demoDoc();
  try{
    var d = normalizeDoc(JSON.parse(raw));
    var v = localStorage.getItem(K_VIEW);
    if(v){ var jv = JSON.parse(v); if(isFinite(jv.scale)){ view = {x:+jv.x||0, y:+jv.y||0, scale:clamp(+jv.scale,.25,4)}; } }
    return d;
  }catch(err){
    try{ localStorage.removeItem(K_DOC); }catch(e2){}
    setTimeout(function(){ toast('本地存档损坏，已重置为演示数据'); }, 400);
    return demoDoc();
  }
}

/* ============ 6. 历史 ============ */
function snapshot(){
  return JSON.stringify({
    persons: doc.persons, unions: doc.unions,
    parentLinks: doc.parentLinks, emotionalLinks: doc.emotionalLinks,
    probandId: doc.probandId || null
  });
}
function pushHistory(){
  var s = snapshot();
  if(undoStack.length && undoStack[undoStack.length - 1] === s) return;
  undoStack.push(s);
  if(undoStack.length > MAX_HIDE_STEP) undoStack.shift();
  redoStack.length = 0;
  updateToolbar();
}
/* 用指定快照入栈（拖动前快照），保证"拖动 + 贴合重排"整体算一步，Ctrl+Z 一次回拖动前 */
function pushHistoryOf(snap){
  if(!snap || (undoStack.length && undoStack[undoStack.length - 1] === snap)) return;
  undoStack.push(snap);
  if(undoStack.length > MAX_HIDE_STEP) undoStack.shift();
  redoStack.length = 0;
  updateToolbar();
}
/* 校验失败/输入被拒绝时，把刚才为这次输入压入的"无变化"快照弹出，
   否则撤销栈里会多出一个什么都不恢复的步骤 */
function dropNoopHistory(){
  if(undoStack.length && undoStack[undoStack.length - 1] === snapshot()){
    undoStack.pop(); updateToolbar();
  }
}
function restore(snap){
  var o = JSON.parse(snap);
  doc.persons = o.persons; doc.unions = o.unions;
  doc.parentLinks = o.parentLinks; doc.emotionalLinks = o.emotionalLinks;
  doc.probandId = o.probandId || null;
  if(selection.type === 'person' && !doc.persons.some(function(p){ return p.id === selection.id; })) selection = {type:null,id:null};
  if(selection.type === 'emotion' && !doc.emotionalLinks.some(function(e){ return e.id === selection.id; })) selection = {type:null,id:null};
}
function undo(){
  if(!undoStack.length) return;
  var cur = snapshot();
  var prev = undoStack.pop();
  redoStack.push(cur);
  restore(prev);
  commit(false);
  updateToolbar();
  toast('已撤销');
}
function redo(){
  if(!redoStack.length) return;
  var cur = snapshot();
  var next = redoStack.pop();
  undoStack.push(cur);
  restore(next);
  commit(false);
  updateToolbar();
  toast('已重做');
}

/* ============ 7. 布局 ============ */
function personById(id){ for(var i=0;i<doc.persons.length;i++) if(doc.persons[i].id===id) return doc.persons[i]; return null; }
function unionById(id){ for(var i=0;i<doc.unions.length;i++) if(doc.unions[i].id===id) return doc.unions[i]; return null; }
function unionsOf(id){ return doc.unions.filter(function(u){ return u.a===id || u.b===id; }); }
function otherOf(u, id){ return u.a===id ? u.b : u.a; }
function linksOfUnion(uid2){ return doc.parentLinks.filter(function(l){ return l.union===uid2; }); }
function primaryParentUnionOf(pid){
  var ls = doc.parentLinks.filter(function(l){ return l.child===pid && l.primary; });
  return ls.length ? unionById(ls[0].union) : null;
}
function isAncestor(a, b){
  if(a===b) return true;
  var seen = {}, stack = [b];
  while(stack.length){
    var c = stack.pop();
    var ls = doc.parentLinks.filter(function(l){ return l.child===c; });
    for(var i=0;i<ls.length;i++){
      var u = unionById(ls[i].union);
      if(!u) continue;
      if(u.a===a || u.b===a) return true;
      [u.a,u.b].forEach(function(p){ if(p && !seen[p]){ seen[p]=1; stack.push(p); } });
    }
  }
  return false;
}

/* 折叠：返回隐藏集合与每个折叠节点的隐藏后代计数 */
function computeHidden(){
  var hidden = {}, counts = {};
  function hideUnder(rootId){
    var count = 0;
    (function hideDesc(p){
      unionsOf(p).forEach(function(u){
        linksOfUnion(u.id).forEach(function(l){
          if(l.child === p) return;
          var c = l.child;
          if(hidden[c]) { return; }
          hidden[c] = 1; count++;
          unionsOf(c).forEach(function(u2){
            var partner = otherOf(u2, c);
            if(partner && !hidden[partner] && !isAncestor(partner, p)){ hidden[partner] = 1; count++; }
          });
          hideDesc(c);
        });
      });
    })(rootId);
    return count;
  }
  doc.persons.forEach(function(p){
    if(p.collapsed && hasDescendants(p.id)) counts[p.id] = hideUnder(p.id);
  });
  return { hidden: hidden, counts: counts };
}
function hasDescendants(pid){
  return unionsOf(pid).some(function(u){
    return linksOfUnion(u.id).some(function(l){ return l.child !== pid; });
  });
}

/* 超宽且无法换行的文本：截断加省略号，避免溢出符号被线切到 */
function ellipsize(str, font, maxW){
  if(measure(str, font) <= maxW) return str;
  var s = str;
  while(s.length > 1 && measure(s + '…', font) > maxW) s = s.slice(0, -1);
  return s + '…';
}
function metricsFor(p){
  var name = (p.name || '').trim() || '未命名';
  var nl = wrap(name, N_FONT, LABEL_MAX, 2).map(function(l){ return ellipsize(l, N_FONT, LABEL_MAX); });
  var items = p.notes.filter(function(n){
    return n.type !== 'quote' && n.type !== 'note' && n.type !== 'age' && (n.value || n.label);
  }).sort(function(a,b){ return (NOTE_RANK[a.type]||9) - (NOTE_RANK[b.type]||9); });
  var shown = items.slice(0, MAX_ROWS).map(function(n){
    return ellipsize(wrap(String(n.value || n.label), I_FONT, LABEL_MAX, 1)[0], I_FONT, LABEL_MAX);
  });
  var extra = items.length - shown.length;
  var lines = shown.slice();
  if(extra > 0) lines.push('+' + extra);
  /* 画布只显示最近 1 条经历（面板里看全部）：避免长列表撑爆节点。
     这一行进入同一文字盒的行数与宽度计算，因此会撑高块高、参与净距 ≥70 与防遮线的约束 */
  var evs = p.events || [], lastEv = null;
  for(var ei = evs.length - 1; ei >= 0; ei--){
    var ev0 = evs[ei];
    if(ev0 && (ev0.text || ev0.place || ev0.time)){ lastEv = ev0; break; }
  }
  if(lastEv){
    var evTxt = [lastEv.time, lastEv.text].filter(function(x){ return x; }).join(' · ') || (lastEv.place || '');
    lines.push(ellipsize('• ' + evTxt, I_FONT, LABEL_MAX));
  }
  var mw = SYMBOL;
  nl.forEach(function(l){ mw = Math.max(mw, measure(l, N_FONT)); });
  lines.forEach(function(l){ mw = Math.max(mw, measure(l, I_FONT)); });
  var w = Math.min(LABEL_MAX + 8, mw + 8);
  /* 块高 = 符号底到姓名基线 77 + 其余姓名行 + 首条明细贴靠 + 其余明细行距（含底部留白） */
  var lead = lines.length > 4 ? ILH_LOOSE : ILH;
  var h = 77 + Math.max(0, nl.length - 1) * NLH + (lines.length ? FI + (lines.length - 1) * lead : 0);
  return { w: w, h: h, nameLines: nl, itemLines: lines, extra: extra };
}

function computeGen(visible){
  var gen = {};
  doc.persons.forEach(function(p){ gen[p.id] = 0; });
  var vu = doc.unions.filter(function(u){ return visible[u.a] && (!u.b || visible[u.b]); });
  for(var it = 0; it < 40; it++){
    var changed = false;
    for(var i=0;i<vu.length;i++){
      var u = vu[i];
      var g = u.b ? Math.max(gen[u.a], gen[u.b]) : gen[u.a];
      var ls = doc.parentLinks;
      for(var j=0;j<ls.length;j++){
        var l = ls[j];
        if(l.union === u.id && visible[l.child] && gen[l.child] < g + 1){ gen[l.child] = g + 1; changed = true; }
      }
      if(u.b){
        var m = Math.max(gen[u.a], gen[u.b]);
        if(gen[u.a] !== m || gen[u.b] !== m){ gen[u.a] = gen[u.b] = m; changed = true; }
      }
    }
    if(!changed) break;
  }
  return gen;
}

function computeOrder(visible){
  var order = {}, counter = 0;
  function visit(id){
    if(order[id] !== undefined) return;
    order[id] = ++counter;
    var us = unionsOf(id).slice().sort(function(a,b){ return (a.order||0) - (b.order||0); });
    us.forEach(function(u){
      var q = otherOf(u, id);
      if(q && visible[q] && order[q] === undefined) order[q] = ++counter;
      var ls = linksOfUnion(u.id).slice().sort(function(a,b){
        return (a.order||0) - (b.order||0) || (a.id < b.id ? -1 : 1);
      });
      ls.forEach(function(l){ if(visible[l.child]) visit(l.child); });
    });
  }
  var hasParent = {};
  doc.parentLinks.forEach(function(l){ hasParent[l.child] = 1; });
  doc.persons.filter(function(p){ return visible[p.id] && !hasParent[p.id]; }).forEach(function(p){ visit(p.id); });
  doc.persons.filter(function(p){ return visible[p.id] && order[p.id] === undefined; }).forEach(function(p){ order[p.id] = ++counter; });
  return order;
}

function relayout(){
  var vis = computeHidden();
  var hidden = vis.hidden;
  var visible = {};
  doc.persons.forEach(function(p){ if(!hidden[p.id]) visible[p.id] = 1; });

  var gen = computeGen(visible);
  var order = computeOrder(visible);
  var met = {};
  doc.persons.forEach(function(p){ if(visible[p.id]) met[p.id] = metricsFor(p); });

  // 行高
  var rowY = {}, rowsGen = [];
  var maxGen = 0;
  doc.persons.forEach(function(p){ if(visible[p.id] && gen[p.id] > maxGen) maxGen = gen[p.id]; });
  var y = 0;
  for(var g = 0; g <= maxGen; g++){
    var rowP = doc.persons.filter(function(p){ return visible[p.id] && gen[p.id] === g; });
    var maxH = SYMBOL;
    rowP.forEach(function(p){ maxH = Math.max(maxH, met[p.id].h); });
    rowY[g] = y;
    rowsGen.push({ g: g, y: y, maxH: maxH, persons: rowP });
    y += maxH + ROW_GAP;
  }

  // 初始化 x
  var X = {};
  /* 水平最小中心距：文字块之间至少留 20px；同时硬保证两个符号边到边净距 ≥ SYM_GAP(70px)。
     这条约束写进求解里，所有行内相邻关系（伴侣 / 兄弟姐妹 / 不同分支）都走它，不靠默认值碰巧成立 */
  function minDX(ia, ib){
    var wa = met[ia].w, wb = met[ib].w;
    return Math.max(wa/2 + wb/2 + 20, SYMBOL + SYM_GAP);
  }
  rowsGen.forEach(function(row){
    var ps = row.persons.slice().sort(function(a,b){ return order[a.id] - order[b.id]; });
    row.persons = ps;
    var prev = null;
    ps.forEach(function(p){
      if(!prev) X[p.id] = 0;
      else X[p.id] = X[prev.id] + minDX(prev.id, p.id);
      prev = p;
    });
  });

  var vu = doc.unions.filter(function(u){ return visible[u.a] && (!u.b || visible[u.b]); });
  var ux = {};
  var ITER = 28;
  for(var it = 0; it < ITER; it++){
    // 初始化
    rowsGen.forEach(function(row){
      var prev = null;
      row.persons.forEach(function(p){
        if(!prev) return;
        var need = minDX(prev.id, p.id);
        if(X[p.id] - X[prev.id] < need) X[p.id] = X[prev.id] + need;
        prev = p;
      });
    });

    ux = {};
    vu.forEach(function(u){ ux[u.id] = u.b ? (X[u.a] + X[u.b]) / 2 : X[u.a]; });

    var childTarget = {}, parentTarget = {};
    vu.forEach(function(u){
      var kids = linksOfUnion(u.id).filter(function(l){ return l.primary && visible[l.child]; })
        .sort(function(a,b){ return (a.order||0)-(b.order||0) || (a.id<b.id?-1:1); });
      if(!kids.length) return;
      /* 子女组：按 minDX 依次排开后整体居中到伴侣单元中点（孩子多时向两侧同步拉开） */
      var pos = [], cur = 0;
      kids.forEach(function(l, i){
        if(i) cur += minDX(kids[i-1].child, l.child);
        pos.push(cur);
      });
      var mid = (pos[0] + pos[pos.length-1]) / 2;
      kids.forEach(function(l, i){ childTarget[l.child] = ux[u.id] - mid + pos[i]; });
      var cs = kids.map(function(l){ return childTarget[l.child]; });
      parentTarget[u.id] = (Math.min.apply(null, cs) + Math.max.apply(null, cs)) / 2;
    });

    var nextX = {};
    doc.persons.forEach(function(p){
      if(!visible[p.id]) return;
      var ts = [], ws = [];
      var pu = primaryParentUnionOf(p.id);
      if(pu && childTarget[p.id] !== undefined && visible[pu.a] && (!pu.b || visible[pu.b])){
        ts.push(childTarget[p.id]); ws.push(1.0);
      }
      unionsOf(p.id).forEach(function(u){
        if(!visible[u.a] || (u.b && !visible[u.b])) return;
        var q = otherOf(u, p.id);
        var hasKids = linksOfUnion(u.id).some(function(l){ return l.primary && visible[l.child]; });
        if(hasKids && parentTarget[u.id] !== undefined && q && visible[q]){
          // 目标相对于「伴侣对中点」，故取一半最小中心距
          var halfGap = minDX(p.id, q)/2;
          var left = X[p.id] <= X[q];
          ts.push(parentTarget[u.id] + (left ? -halfGap : halfGap)); ws.push(1.2);
        }else if(q && visible[q] && !hasKids && childTarget[p.id] === undefined){
          var hg2 = minDX(p.id, q);
          ts.push(X[q] + (X[p.id] <= X[q] ? -hg2 : hg2)); ws.push(1.0);
        }
      });
      if(!ts.length){ nextX[p.id] = X[p.id]; return; }
      var sum = 0, wsum = 0;
      for(var i=0;i<ts.length;i++){ sum += ts[i]*ws[i]; wsum += ws[i]; }
      nextX[p.id] = sum / wsum;
    });
    for(var k in nextX) X[k] = nextX[k];

    // 行内去重叠（保序）
    rowsGen.forEach(function(row){
      var ps = row.persons;
      for(var pass=0; pass<2; pass++){
        for(var i=1;i<ps.length;i++){
          var need = minDX(ps[i-1].id, ps[i].id);
          if(X[ps[i].id] - X[ps[i-1].id] < need) X[ps[i].id] = X[ps[i-1].id] + need;
        }
        for(var j=ps.length-2;j>=0;j--){
          var need2 = minDX(ps[j].id, ps[j+1].id);
          if(X[ps[j+1].id] - X[ps[j].id] < need2) X[ps[j].id] = X[ps[j+1].id] - need2;
        }
      }
    });
  }

  // 两端对齐：父母中心距 = 子女首末跨度 S，左父母对齐首子、右父母对齐末子
  // 自最深层向上处理：先定好深层子女，再由浅层父母去贴合，避免下一层把上一层打乱
  doc.unions.slice().sort(function(a,b){
    return (gen[b.a] || 0) - (gen[a.a] || 0);
  }).forEach(function(u){
    var kids = linksOfUnion(u.id).filter(function(l){ return l.primary && visible[l.child]; })
      .sort(function(a,b){ return (a.order||0)-(b.order||0) || (a.id<b.id?-1:1); });
    if(kids.length < 2 || !u.b) return;
    var xs = kids.map(function(l){ return X[l.child]; });
    var lo = Math.min.apply(null, xs), hi = Math.max.apply(null, xs);
    var leftId = X[u.a] <= X[u.b] ? u.a : u.b, rightId = leftId === u.a ? u.b : u.a;
    X[leftId] = lo; X[rightId] = hi;
  });

  /* 最终保险：两端对齐之后再按实际 X 顺序补一遍净距检查。ITER 内是按 order 顺序去重叠，
     order 与 X 顺序不一致时（例如再婚/婚外情伴侣），相邻两框净距可能只有 ~65px，这里撑到 ≥70px */
  rowsGen.forEach(function(row){
    var ps = row.persons.slice().sort(function(a,b){ return X[a.id] - X[b.id]; });
    for(var i=1;i<ps.length;i++){
      var need3 = minDX(ps[i-1].id, ps[i].id);
      if(X[ps[i].id] - X[ps[i-1].id] < need3) X[ps[i].id] = X[ps[i-1].id] + need3;
    }
  });

  // 应用偏移 & 归一
  var nodes = {};
  doc.persons.forEach(function(p){
    if(!visible[p.id]) return;
    nodes[p.id] = {
      id: p.id, x: X[p.id] + (p.offset.x || 0), y: rowY[gen[p.id]] + (p.offset.y || 0),
      rowY: rowY[gen[p.id]], gen: gen[p.id], w: met[p.id].w, h: met[p.id].h,
      m: met[p.id]
    };
  });
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for(var id in nodes){
    var n = nodes[id];
    minX = Math.min(minX, n.x - Math.max(n.w/2 + 8, 72));
    maxX = Math.max(maxX, n.x + Math.max(n.w/2 + 8, 40));
    minY = Math.min(minY, n.y - 52);
    maxY = Math.max(maxY, n.y + n.h - SYMBOL/2);
  }
  if(!isFinite(minX)){ minX = 0; minY = 0; maxX = 100; maxY = 100; }
  var dx = PAD - minX, dy = PAD - minY;
  for(var id2 in nodes){ nodes[id2].x += dx; nodes[id2].y += dy; }

  layout = {
    nodes: nodes, gen: gen, order: order, rowY: rowY, hidden: hidden,
    collapsedCount: vis.counts, visible: visible,
    bounds: { x: minX + dx, y: minY + dy, w: maxX - minX, h: maxY - minY }
  };
  return layout;
}

/* ============ 8. 渲染：几何工具 ============ */
function polyD(pts){
  if(!pts.length) return '';
  var s = 'M' + r2(pts[0].x) + ' ' + r2(pts[0].y);
  for(var i=1;i<pts.length;i++) s += 'L' + r2(pts[i].x) + ' ' + r2(pts[i].y);
  return s;
}
function r2(v){ return Math.round(v * 100) / 100; }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function quadPts(p0, p1, c, n){
  var pts = [];
  for(var i=0;i<=n;i++){
    var t = i/n, mt = 1-t;
    pts.push({
      x: mt*mt*p0.x + 2*mt*t*c.x + t*t*p1.x,
      y: mt*mt*p0.y + 2*mt*t*c.y + t*t*p1.y
    });
  }
  return pts;
}
function normalAt(pts, i){
  var a = pts[Math.max(0, i-1)], b = pts[Math.min(pts.length-1, i+1)];
  var tx = b.x-a.x, ty = b.y-a.y, L = Math.hypot(tx,ty) || 1;
  return { x: ty/L, y: -tx/L };
}
function offsetPts(pts, o){
  return pts.map(function(p,i){
    var n = normalAt(pts, i);
    return { x: p.x + n.x*o, y: p.y + n.y*o };
  });
}
function arcLen(pts){
  var L = 0;
  for(var i=1;i<pts.length;i++) L += dist(pts[i], pts[i-1]);
  return L;
}
function zigPts(pts, amp, wl){
  amp = amp || 5; wl = wl || 20;
  var total = arcLen(pts) || 1, s = 0, out = [];
  for(var i=0;i<pts.length;i++){
    if(i) s += dist(pts[i], pts[i-1]);
    var taper = Math.min(1, s/6, (total-s)/6);
    var tri = (2/Math.PI) * Math.asin(Math.sin(2*Math.PI*s/wl));
    var n = normalAt(pts, i);
    out.push({ x: pts[i].x + n.x*amp*tri*taper, y: pts[i].y + n.y*amp*tri*taper });
  }
  return out;
}
function edgePoint(A, B){ return portOf(A, sideOf(A, B)); }

/* ---- 正交布线：所有关系线只允许水平/垂直段，锚定符号边框 ---- */
var ORTHO_STUB = 14;
function symRect(n){ return { x:n.x-28, y:n.y-28, w:56, h:56 }; }
function sideOf(n, t){
  var dx = t.x - n.x, dy = t.y - n.y;
  if(Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? 'r' : 'l';
  return dy >= 0 ? 'b' : 't';
}
function portOf(n, side, slot){
  var r = symRect(n), slotv = slot || 0;
  if(side === 'r') return { x: r.x + r.w, y: clamp(n.y + slotv, r.y + 9, r.y + r.h - 9), dir: { x:1, y:0 } };
  if(side === 'l') return { x: r.x, y: clamp(n.y + slotv, r.y + 9, r.y + r.h - 9), dir: { x:-1, y:0 } };
  if(side === 'b') return { x: clamp(n.x + slotv, r.x + 9, r.x + r.w - 9), y: r.y + r.h, dir: { x:0, y:1 } };
  return { x: clamp(n.x + slotv, r.x + 9, r.x + r.w - 9), y: r.y, dir: { x:0, y:-1 } };
}
function segHits(a, b, R, pad){
  pad = pad == null ? 8 : pad;
  var x1 = Math.min(a.x,b.x) - pad, x2 = Math.max(a.x,b.x) + pad;
  var y1 = Math.min(a.y,b.y) - pad, y2 = Math.max(a.y,b.y) + pad;
  return !(x2 < R.x || x1 > R.x + R.w || y2 < R.y || y1 > R.y + R.h);
}
function routeClear(pts, skipIds){

    if(skipIds.indexOf(id) >= 0) continue;
    var n = layout.nodes[id];
    var box = { x:n.x - n.w/2 - 3, y:n.y - 36, w:n.w + 6, h:n.h + 10 };
    if(segHits(a, b, box, 2)) return false;
  }
  return true;
}
/* 折线上 x 处最低的点（同一 x 可能同时属于绕行线的顶段与下折段，
   取最低的那一点，中继线从下折段末端接着往下走，才不会用实线盖掉虚线的伴侣线） */
function lowestOnPathAt(pts, x){
  var best = null;
  for(var i = 1; i < pts.length; i++){
    var a = pts[i-1], b = pts[i];
    if(Math.abs(a.x - b.x) <= 0.6){
      if(Math.abs(a.x - x) <= 0.6) best = Math.max(best == null ? -Infinity : best, Math.max(a.y, b.y));
    }else if(x >= Math.min(a.x, b.x) - 0.6 && x <= Math.max(a.x, b.x) + 0.6){
      best = Math.max(best == null ? -Infinity : best, a.y);
    }
  }
  return best == null ? null : best;
}
/* 中继竖线的落点必须落在伴侣线本体上。候选 = 每条水平段内离子女重心最近的点，
   先按距离、再按 y 从下往上排；该处直落会压到人（含伴侣自己）就换下一条 */
function coupleAnchor(pts, A, B, kx, kids){
  var runs = coupleRuns(pts).map(function(g){
    var x = clamp(kx, g.x0, g.x1);
    var y = lowestOnPathAt(pts, x);
    return { x:x, y:(y == null ? g.y : y), gap:Math.abs(kx - x) };
  });
  runs.sort(function(p, q){ return p.gap - q.gap || q.y - p.y; });
  var top = Infinity;
  kids.forEach(function(l){ top = Math.min(top, layout.nodes[l.child].y - 48); });
  for(var s = 0; s < runs.length; s++){
    /* 起点本身就在伴侣线上（可能贴着父母符号边框），故前 2px 不参与碰撞判定 */
    if(dropClear(runs[s].x, runs[s].y + 2, top, [])) return { x:runs[s].x, y:runs[s].y };
  }
  if(!runs.length){
    /* 伴侣线完全竖直（两人上下相邻）：从最低端点直落 */
    var deep = pts[0];
    pts.forEach(function(p){ if(p.y > deep.y) deep = p; });
    return { x:deep.x, y:deep.y };
  }
  return { x:runs[0].x, y:runs[0].y };
}
/* 点是否落在折线上（容差内），用于"中继线起点是否真的接在伴侣线上"的判定 */
function ptOnPts(p, pts, tol){
  tol = tol == null ? 1.2 : tol;
  if(pts.length === 1) return dist(p, pts[0]) <= tol;
  for(var i = 1; i < pts.length; i++){
    var a = pts[i-1], b = pts[i];
    var vx = b.x - a.x, vy = b.y - a.y, L2 = vx*vx + vy*vy;
    var t = L2 ? clamp(((p.x - a.x)*vx + (p.y - a.y)*vy)/L2, 0, 1) : 0;
    if(dist(p, { x:a.x + vx*t, y:a.y + vy*t }) <= tol) return true;
  }
  return false;
}

function structureSVG(){
  var out = '', trunks = [];
  doc.unions.forEach(function(u){
    if(!layout.visible[u.a]) return;
    if(u.b && !layout.visible[u.b]) return;
    if(u.b) out += partnerSVG(u);
    var kids = linksOfUnion(u.id).filter(function(l){ return l.primary && layout.visible[l.child]; })
      .sort(function(a,b){ return (a.order||0)-(b.order||0) || (a.id<b.id?-1:1); });
    if(!kids.length) return;
    /* 中继线 x 取子女首末跨度的中点（不是平均 x），保证多子女时竖线居中 */
    var kLo = Infinity, kHi = -Infinity;
    kids.forEach(function(l){
      var x = layout.nodes[l.child].x;
      kLo = Math.min(kLo, x); kHi = Math.max(kHi, x);
    });
    var kx = (kLo + kHi) / 2;
    if(u.b){
      var A = layout.nodes[u.a], B = layout.nodes[u.b];
      /* 伴侣线可能因中间坐着第三人而被抬高/压低，此时它的"中点"根本不在人身上。
         中继竖线的起点必须落在这条线的本体上，否则线就是悬空的（张杰 bug 的根因） */
      var rp = orthoRoute(A, B, 0, 0).pts;
      var anc = coupleAnchor(rp, A, B, kx, kids);
      trunks.push({ u:u, kids:kids, x:anc.x, startY:anc.y, single:false,
        head:[{ x:anc.x, y:anc.y }], couple:rp, kx:kx });
    }else{
      /* 单亲：符号正下方紧跟着文字块，从文字块底部起线同样是一根悬空的线。
         改为从符号侧边（朝子女那一侧）引出，贴着文字块外缘下垂，保证与父母符号相接 */
      var A2 = layout.nodes[u.a];
      var side = kx >= A2.x ? 'r' : 'l', sgn = side === 'r' ? 1 : -1;
      var xs = A2.x + sgn*(A2.w/2 + 10);
      trunks.push({ u:u, kids:kids, x:xs, startY:A2.y, single:true,
        head:[portOf(A2, side), { x:xs, y:A2.y }], couple:null, kx:kx });
    }
  });
  // 主干错层
  var lanes = {};
  trunks.forEach(function(t, i){
    var c = 0;
    for(var j=0;j<i;j++){ if(Math.abs(trunks[j].x - t.x) < 14 && !lanes[trunks[j].u.id+'_free']) c++; }
    t.lane = Math.min(c, 3);
  });
  trunks.forEach(function(t){
    var top = Infinity;
    t.kids.forEach(function(l){ top = Math.min(top, layout.nodes[l.child].y - 52); });
    var sibY = Math.max(t.startY + 18, top - 14 - t.lane*9);
    var minX = Infinity, maxX = -Infinity;
    t.kids.forEach(function(l){
      var k = layout.nodes[l.child];
      minX = Math.min(minX, k.x); maxX = Math.max(maxX, k.x);
    });
    /* 中继线：起于 head（伴侣线上的锚点 / 单亲符号侧边），垂直落到兄弟横线 y。
       原"独子正好对齐某位父母就把中继线挪到该父母 x、起点改到文字块底部"的捷径
       会让中继线与伴侣线之间出现几十像素空档，已整段删除 */
    var hp = t.head.concat([{ x:t.x, y:sibY }]);
    var hd = polyD(dedupePts(hp));
    t.sibY = sibY;
    var tp = '<path class="gx-edg" d="'+hd+'" stroke="#9aa4ae" stroke-width="1.6" fill="none"/>';
    // 兄弟横线必须把中继线与所有子女连起来（含单孩子/中继线不在孩子正上方的情况），否则会出现断线
    var barL = Math.min(minX, t.x), barR = Math.max(maxX, t.x);
    if(barR - barL > 0.5) tp += '<path d="M'+r2(barL)+' '+r2(sibY)+'L'+r2(barR)+' '+r2(sibY)+'" stroke="#9aa4ae" stroke-width="1.6" fill="none"/>';
    // 中继线与兄弟横线同样要可点：加宽命中层包进同一个 union 组，点整段都选中该伴侣单元
    tp += '<path class="gx-ehit" d="'+hd+'"/>';
    if(barR - barL > 0.5) tp += '<path class="gx-ehit" d="M'+r2(barL)+' '+r2(sibY)+'L'+r2(barR)+' '+r2(sibY)+'"/>';
    out += '<g class="gx-ulink" data-uid="'+esc(t.u.id)+'" style="cursor:pointer">' + tp + '</g>';
    t.kids.forEach(function(l){
      var k = layout.nodes[l.child];
      var ks = KID_BY_KIND[l.kind] || KID_BY_KIND.biological;
      var dash = ks.dash ? ' stroke-dasharray="' + ks.dash + '"' : '';
      var ty = k.y - 28;
      out += '<g class="gx-lkin" data-lid="'+esc(l.id)+'" style="cursor:pointer">' +
        '<path d="M'+r2(k.x)+' '+r2(sibY)+'L'+r2(k.x)+' '+r2(ty)+'" stroke="#8b949c" stroke-width="1.5" fill="none" '+dash+'/>' +
        '<path class="gx-ehit" d="M'+r2(k.x)+' '+r2(sibY)+'L'+r2(k.x)+' '+r2(ty)+'"/></g>';
      if(ks.label){
        out += '<text class="gx-yr" x="'+r2(k.x+8)+'" y="'+r2((sibY+ty)/2 + 4)+'">'+ks.label+'</text>';
      }
    });
  });
  // 附加父母线（DAG）
  doc.parentLinks.forEach(function(l){
    if(l.primary || !layout.visible[l.child]) return;
    var u = unionById(l.union);
    if(!u || !layout.visible[u.a] || (u.b && !layout.visible[u.b])) return;
    var A = layout.nodes[u.a], B = u.b ? layout.nodes[u.b] : null;
    var pm2 = B ? pathMid(orthoRoute(A, B, 0, 0).pts) : { x:A.x, y:A.y + 28 };
    var sx = pm2.x, sy = pm2.y;
    var k = layout.nodes[l.child];
    var cy = k.y - 28;
    var laneY = cy > sy ? sy + 20 : sy - 20;
    var pts2 = [{ x:sx, y:sy }, { x:sx, y:laneY }, { x:k.x, y:laneY }, { x:k.x, y:cy }];
    out += '<path d="' + polyD(dedupePts(pts2)) + '" stroke="#b9c2cb" stroke-width="1.4" stroke-dasharray="3 4" fill="none"/>';
  });
  lastTrunks = trunks;
  return out;
}

function emotionSVG(){
  var live = doc.emotionalLinks.filter(function(e){ return layout.nodes[e.from] && layout.nodes[e.to]; });
  var kA = {}, kB = {}, cA = {}, cB = {}, ia = {}, ib = {};
  live.forEach(function(e){
    var A = layout.nodes[e.from], B = layout.nodes[e.to];
    kA[e.id] = e.from + '|' + sideOf(A, B);
    kB[e.id] = e.to + '|' + sideOf(B, A);
    cA[kA[e.id]] = (cA[kA[e.id]] || 0) + 1;
    cB[kB[e.id]] = (cB[kB[e.id]] || 0) + 1;
  });
  Object.keys(cA).forEach(function(k){ ia[k] = -1; });
  Object.keys(cB).forEach(function(k){ ib[k] = -1; });
  var out = '';
  live.forEach(function(e){
    var A = layout.nodes[e.from], B = layout.nodes[e.to];
    ia[kA[e.id]]++;
    ib[kB[e.id]]++;
    var sa = clamp((ia[kA[e.id]] - (cA[kA[e.id]] - 1) / 2) * 12, -18, 18);
    var sb = clamp((ib[kB[e.id]] - (cB[kB[e.id]] - 1) / 2) * 12, -18, 18);
    var route = orthoRoute(A, B, sa, sb);
    var sel = selection.type === 'emotion' && selection.id === e.id;
    var spec = emoOf(e.type);
    var body = buildEmotional(A, B, e.type, { halo: sel, route: route });
    out += '<g class="gx-elink" data-eid="' + esc(e.id) + '" style="cursor:pointer">' +
      body + '<path class="gx-ehit" d="' + polyD(route.pts) + '"/></g>';
  });
  return out;
}

function personCode(p){
  if(p.symbol) return p.symbol;
  if(p.gender === 'female') return 'person_female';
  if(p.gender === 'male') return 'person_male';
  if(p.gender === 'other') return 'person_nonbinary';
  return 'person_unknown';
}
function personShape(code, R){
  switch(code){
    case 'person_female': return '<circle class="gx-sym" r="'+R+'"/>';
    case 'person_unknown': return '<polygon class="gx-sym" points="0,'+(-R)+' '+R+',0 0,'+R+' '+(-R)+',0"/>';
    case 'person_nonbinary': return '<path class="gx-sym" d="M'+(-R)+' '+R+'V0A'+R+' '+R+' 0 0 1 '+R+' 0V'+R+'Z"/>';
    case 'person_intersex': return '<circle class="gx-sym" r="'+R+'"/><path class="gx-inner" d="M0 '+(-R+2)+'V'+(R-2)+'"/>';
    case 'person_trans_male': return '<rect class="gx-sym" x="'+(-R)+'" y="'+(-R)+'" width="'+(2*R)+'" height="'+(2*R)+'"/><circle class="gx-inner" r="'+r2(R/2)+'"/>';
    case 'person_trans_female': return '<circle class="gx-sym" r="'+R+'"/><rect class="gx-inner" x="'+r2(-R/2)+'" y="'+r2(-R/2)+'" width="'+R+'" height="'+R+'"/>';
    case 'person_pet': return '<polygon class="gx-sym" points="0,-'+R+' '+R+',0 0,'+R+' '+(-R)+',0" style="stroke-dasharray:4 3"/>';
    default: return '<rect class="gx-sym" x="'+(-R)+'" y="'+(-R)+'" width="'+(2*R)+'" height="'+(2*R)+'"/>';
  }
}
function isProband(id){ return !!id && doc.probandId === id; }
/* 提示用姓名：未填姓名时给「未命名人物」，不留空也不显示 undefined */
function probandName(id){
  var p = personById(id);
  var n = p ? String(p.name || '').trim() : '';
  return n || '未命名人物';
}
/* 设置/取消索引咨访。已有人选时再设他人 = 拒绝操作：不转移、不覆盖、不产生撤销步 */
function setProband(id){
  var cur = doc.probandId;
  if(id && cur && cur !== id){
    toast('索引咨访已选中 ' + probandName(cur) + '，更改请先取消选中。');
    return false;
  }
  pushHistory();
  doc.probandId = id || null;
  commit(true);
  if(!id) toast('已取消索引咨访（全图无双框）');
  else toast('已设为索引咨访：' + personName(id));
  return true;
}
function symbolSVG(p){
  var R = 28, code = personCode(p), s = personShape(code, R);
  if(isProband(p.id)){
    var O = R + 3;
    if(code === 'person_female' || code === 'person_trans_female') s += '<circle class="gx-inner" r="'+O+'"/>';
    else if(code === 'person_unknown' || code === 'person_pet') s += '<polygon class="gx-inner" points="0,-'+O+' '+O+',0 0,'+O+' '+(-O)+',0"/>';
    else s += '<rect class="gx-inner" x="'+(-O)+'" y="'+(-O)+'" width="'+(2*O)+'" height="'+(2*O)+'"/>';
  }
  var age = ageOf(p);
  if(p.deceased){
    // 死亡叉线：贯穿符号内部，端点贴边界不越界；圆形按内接 45° 裁在圆内
    var circle = (code === 'person_female' || code === 'person_trans_female' || code === 'person_intersex');
    var a = circle ? R * 0.7071 : (code === 'person_nonbinary' || code === 'person_pet' ? R * 0.72 : R - 0.8);
    s += '<path class="gx-dead" d="M'+r2(-a)+' '+r2(-a)+'L'+r2(a)+' '+r2(a)+'"/>' +
         '<path class="gx-dead" d="M'+r2(a)+' '+r2(-a)+'L'+r2(-a)+' '+r2(a)+'"/>';
  }
  /* 孕产：怀孕用符号内正三角（规范里三角形专留给怀孕），流产用实心小圆点；
     画在右下角内切位置，避开年龄数字 */
  if(p.pregnancy === 'pregnant'){
    var t = R * 0.30, cx = R * 0.52, cy = R * 0.52;
    s += '<polygon class="gx-preg" points="' + r2(cx) + ',' + r2(cy-t) + ' ' + r2(cx+t) + ',' + r2(cy+t*0.75) + ' ' + r2(cx-t) + ',' + r2(cy+t*0.75) + '"/>';
  }else if(p.pregnancy === 'miscarriage'){
    s += '<circle class="gx-preg" cx="' + r2(R*0.52) + '" cy="' + r2(R*0.52) + '" r="' + r2(R*0.17) + '"/>';
  }
  s += '<text class="gx-age' + (age == null ? ' gx-age-unk' : '') + '" x="0" y="0">' + (age == null ? '?' : age) + '</text>';
  return s;
}

function nodeSVG(p){
  var n = layout.nodes[p.id];
  var m = n.m;
  var sel = selection.type === 'person' && selection.id === p.id;
  var pickable = pickTarget && pickTarget.from !== p.id;
  var aria = (p.name || '未命名') + '，' + (GENDER.filter(function(g){return g[0]===p.gender;})[0]||['','未明'])[1] +
    (p.birthYear ? '，' + p.birthYear + ' 年生' : '') + (p.deceased ? '，已故' : '');
  var body = '';
  body += '<rect class="gx-hit" x="'+r2(-n.w/2-7)+'" y="-34" width="'+r2(n.w+14)+'" height="'+r2(n.h+6)+'" fill="transparent"/>';
  body += symbolSVG(p);
  if(p.birthYear != null) body += '<text class="gx-yr" data-ef="birthYear" x="-36" y="-37" text-anchor="start">'+p.birthYear+'</text>';
  if(p.birthDate) body += '<text class="gx-yr" data-ef="birthDate" x="-36" y="-23" text-anchor="end">'+esc(p.birthDate.slice(5))+'</text>';
  if(p.deceased && p.deathYear != null) body += '<text class="gx-yr" data-ef="deathYear" x="36" y="-37" text-anchor="end">'+p.deathYear+'</text>';
  var y = 43;
  m.nameLines.forEach(function(line){
    body += '<text class="gx-nm" data-ef="name" x="0" y="'+r2(y)+'">'+esc(line)+'</text>';
    y += NLH;
  });
  /* 姓名是标题，第一条明细紧贴最后一行姓名（FI），不再叠一个整行高 */
  if(m.itemLines.length) y = 43 + (m.nameLines.length - 1) * NLH + FI;
  m.itemLines.forEach(function(line, i){
    /* 首条明细紧贴姓名（FI），其余按字号×1.05–1.15 的行距；超过 4 行放宽到 1.2 便于阅读 */
    if(i) y += (m.itemLines.length > 4 ? ILH_LOOSE : ILH);
    body += '<text class="gx-it" x="0" y="'+r2(y)+'">'+esc(line)+'</text>';
  });
  var count = layout.collapsedCount[p.id];
  if(p.collapsed && count > 0){
    body += '<g transform="translate(24,24)"><circle class="gx-badge-c" r="11"/>' +
      '<text class="gx-badge-t" x="0" y="3.8">+'+count+'</text></g>';
  }
  if(sel){
    /* 选中框：与符号同心。符号轮廓半径 28，索引双框 31，描边 1.6/2；
       取半宽 34 使四边留白完全相等，且全部在节点局部坐标系内，
       随 #world 的 CSS transform 一起缩放，不会在任何缩放档位失配 */
    var HB = 34, TOP = -34;
    body += '<g class="sel"><rect class="gx-selbox" x="'+(-HB)+'" y="'+TOP+'" width="'+(2*HB)+
      '" height="'+(2*HB)+'" rx="4"/></g>';
  }
  if(pickable) body += '<rect x="-32" y="-32" width="64" height="64" fill="none" stroke="#7a5bb5" stroke-width="2" stroke-dasharray="4 3"/>';
  return '<g class="gx-node" data-id="'+esc(p.id)+'" transform="translate('+r2(n.x)+' '+r2(n.y)+
    ')" role="button" tabindex="0" aria-label="'+esc(aria)+'"><g class="gx-inner">'+body+'</g></g>';
}

function buildInner(){
  var s = '<g class="gx-edges">' + structureSVG() + '</g>';
  s += '<g class="gx-emo">' + emotionSVG() + '</g>';
  var ns = '';
  doc.persons.forEach(function(p){ if(layout.visible[p.id]) ns += nodeSVG(p); });
  s += '<g class="gx-nodes">' + ns + '</g>';
  return s;
}
/* 数据完整性自检（运行期断言）：不只看"路径有没有生成"，还要看"线有没有真的接到父母身上"。
   1) 主归属亲子关系缺线段；2) union 引用不存在；3) 中继线起点不在伴侣线上（悬空）；
   4) 子女入线顶端与兄弟横线 y 不一致（脱节） */
function verifyStructure(world){
  if(!world) return;
  var drawn = {}, topY = {};
  $$('.gx-lkin', world).forEach(function(g){
    var lid = g.getAttribute('data-lid');
    drawn[lid] = 1;
    var p = g.querySelector('path');
    var m = p && /^M([-\d.]+) ([-\d.]+)L/.exec(p.getAttribute('d') || '');
    if(m) topY[lid] = +m[2];
  });
  var missing = [], dangling = [], broken = [];
  doc.parentLinks.forEach(function(l){
    if(!personById(l.child)){ dangling.push(l.id + '→' + l.child + '(人物不存在)'); return; }
    var childVisible = !!layout.visible[l.child];
    var u = unionById(l.union);
    if(!childVisible) return;
    if(!u){ dangling.push(l.id + '→' + l.child + '(union ' + l.union + ' 不存在)'); return; }
    if(!l.primary) return;
    if(!layout.visible[u.a] || (u.b && !layout.visible[u.b])) return;
    if(!drawn[l.id]) missing.push(l.id + '→' + l.child + ' 无入线');
  });
  lastTrunks.forEach(function(t){
    var kids = t.kids.filter(function(l){ return layout.visible[l.child]; });
    if(!kids.length) return;
    var hx = t.head[0].x, hy = t.head[0].y;
    if(!t.single && !ptOnPts(t.head[0], t.couple, 1.2)){
      broken.push(t.u.id + ' 中继线起点(' + r2(hx) + ',' + r2(hy) + ')不在伴侣线上，子女 ' +
        kids.map(function(l){ return l.child; }).join('/'));
    }
    kids.forEach(function(l){
      var y = topY[l.id];
      if(y !== undefined && Math.abs(y - t.sibY) > 0.6){
        broken.push('l' + l.id + '(' + l.child + ') 入线顶端 y=' + r2(y) + ' 与兄弟横线 y=' + r2(t.sibY) + ' 脱节');
      }
    });
  });
  if(missing.length) console.warn('[genogram] 以下亲子关系未能布线：' + missing.join(', '));
  if(dangling.length) console.warn('[genogram] 以下亲子关系引用了不存在的伴侣单元：' + dangling.join(', '));
  if(broken.length) console.warn('[genogram] 以下亲子线未接到父母身上：' + broken.join('; '));
}

function render(animate, skipPanel){
  var world = $('#world');
  applyView();
  var old = renderedPos;
  world.innerHTML = buildInner();
  /* 空状态提示：只有真的一个人都没有时才出现（删空后也会即时出现，不是只在首次启动显示） */
  var ehint = $('#emptyHint');
  if(ehint) ehint.hidden = doc.persons.length > 0;
  verifyStructure(world);
  var next = {};
  for(var id in layout.nodes){ next[id] = { x: layout.nodes[id].x, y: layout.nodes[id].y }; }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(animate !== false && !reduce){
    $$('.gx-node', world).forEach(function(el){
      var id = el.getAttribute('data-id');
      var inner = el.querySelector('.gx-inner');
      if(!inner) return;
      if(old[id]){
        var dx = old[id].x - next[id].x, dy = old[id].y - next[id].y;
        if(dx || dy){
          inner.animate([{ transform:'translate(' + dx + 'px,' + dy + 'px)' }, { transform:'translate(0,0)' }],
            { duration: 220, easing: 'cubic-bezier(.33,1,.68,1)' });
        }
      }else{
        inner.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: 'ease-out' });
      }
    });
  }
  renderedPos = next;
  if(!skipPanel) renderPanel();
  updateToolbar();
}

var lastPanelKey = '';
function renderPanel(){
  var panel = $('#panel');
  var prevKey = lastPanelKey;
  lastPanelKey = selection.type + ':' + selection.id;
  function paint(html){
    panel.innerHTML = html;
    if(prevKey !== lastPanelKey) panel.scrollTop = 0;
    syncPanelOpen();
  }
  if(selection.type === 'person'){
    var p = personById(selection.id);
    if(!p){ selection = { type:null, id:null }; lastPanelKey = 'null:null'; }
    else{ paint(personPanel(p)); return; }
  }
  if(selection.type === 'emotion'){
    var e = doc.emotionalLinks.filter(function(x){ return x.id === selection.id; })[0];
    if(e){ paint(emotionPanel(e)); return; }
    selection = { type:null, id:null };
    lastPanelKey = 'null:null';
  }
  if(selection.type === 'union'){
    var u = unionById(selection.id);
    if(u){ paint(unionPanel(u)); return; }
    selection = { type:null, id:null };
    lastPanelKey = 'null:null';
  }
  if(selection.type === 'link'){
    var l = doc.parentLinks.filter(function(x){ return x.id === selection.id; })[0];
    if(l){ paint(linkPanel(l)); return; }
    selection = { type:null, id:null };
    lastPanelKey = 'null:null';
  }
  paint(emptyPanel());
}

     同时清掉 .open（小屏 .open 会把空面板从底部推上来盖住画布） */
  var want = !!selection.type;
  var narrow = window.innerWidth <= 760;
  var was = document.body.classList.contains('pnl');
  var wasOpen = panelVis;
  panelVis = want;
  panel.hidden = !want;
  panel.classList.toggle('open', want && narrow);
  document.body.classList.toggle('pnl', want && narrow);
  /* 小屏首次展开面板时画布变矮，重新按可见区域 fit 一次（仅展开瞬间，之后不干预手动缩放） */
  if(want && narrow && !was){
    setTimeout(function(){ centerContent({ fit:true, pad:24 }); }, 70);
  }
  /* 关闭面板的策略：只重新居中、不改缩放（画布变宽后内容仍在视野里），
     且用户手动平移过就不打扰；桌面端面板同样占布局宽度，所以要一起处理 */
  if(!want && wasOpen && !userPanned){
    setTimeout(function(){ centerContent({ fit:false, pad:56 }); }, 70);
  }
}

/* ============ 12. 工具栏状态 / toast / 菜单 ============ */
function updateToolbar(){
  var hasP = selection.type === 'person';
  var hasSel = !!selection.type;
  $$('#toolbar [data-cmd]').forEach(function(b){
    var c = b.getAttribute('data-cmd');
    if(c === 'addPartner' || c === 'addChild') b.disabled = !hasP;
    if(c === 'del') b.disabled = !hasSel;
  });
  var u = $$('#toolbar [data-cmd="undo"]')[0], r = $$('#toolbar [data-cmd="redo"]')[0];
  if(u) u.disabled = !undoStack.length;
  if(r) r.disabled = !redoStack.length;
  var t = $('#title');
