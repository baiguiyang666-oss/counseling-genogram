    for(var k in layout.nodes){
      if(k === p.id) continue;
      minEdge = Math.min(minEdge, layout.nodes[k].x - Math.max(layout.nodes[k].w / 2, 72));
    }

/* R13-2：伴侣并排就位——新框放到伴侣"更空的一侧"（到最近邻居的空隙更大那边） */
function edgeSpaceOf(pid, side, exclude){
  var n = layout.nodes[pid];
  if(!n) return 0;
  var best = Infinity;
  for(var id in layout.nodes){
    if(id === pid) continue;
    if(exclude && exclude.indexOf(id) >= 0) continue;
    var q = layout.nodes[id];
    if(q.gen !== n.gen) continue;
    if(side === 'l'){ if(q.x < n.x) best = Math.min(best, n.x - q.x - SYMBOL); }
    else { if(q.x > n.x) best = Math.min(best, q.x - n.x - SYMBOL); }
  }
  return isFinite(best) ? +best.toFixed(1) : null; /* null：该侧到行端，视作空隙最大 */
}
function placeBesideEmptierSide(newId, partnerId){
  var np = personById(newId), pn = layout.nodes[partnerId], nn = layout.nodes[newId];
  if(!np || !pn || !nn) return null;
  var gl = edgeSpaceOf(partnerId, 'l', [newId]);
  var gr = edgeSpaceOf(partnerId, 'r', [newId]);
  var L = gl == null ? Infinity : gl, R = gr == null ? Infinity : gr;
  var side = L > R ? 'l' : 'r';
  var need = MIN_CENTER;
  var targetX = pn.x + (side === 'r' ? need : -need);
  var targetY = pn.y;
  var baseX2 = nn.x - (np.offset.x || 0), baseY2 = nn.y - (np.offset.y || 0);
  np.offset.x = targetX - baseX2;
  np.offset.y = targetY - baseY2;
  return { side:side, left:gl, right:gr, targetX:+targetX.toFixed(1) };
}

function unionReason(aId, bId){
  if(!aId || !bId || aId === bId) return 'self';
  if(isAncestor(aId, bId) || isAncestor(bId, aId)) return 'direct';
  /* 继亲冲突：一方是“另一方所在伴侣单元”的孩子，会与代次约束互锁 */
  var step = doc.unions.some(function(u){
    var hasA = u.a === aId || u.b === aId, hasB = u.a === bId || u.b === bId;
    if(!hasA && !hasB) return false;
    return linksOfUnion(u.id).some(function(l){
      return (hasA && l.child === bId) || (hasB && l.child === aId);
    });
  });
  return step ? 'step' : '';
}
function unionBlocked(aId, bId){
  var r = unionReason(aId, bId);
  if(!r) return false;
  if(r === 'direct') toast('不能为直系亲属建立伴侣关系');
  else if(r === 'step') toast('不能与该人物的继亲/继子女建立伴侣关系');
  return true;
}
function createUnionBetween(aId, bId){
  if(!aId || !bId || aId === bId) return;
  if(unionBlocked(aId, bId)) return;
  var ex = doc.unions.filter(function(u){
    return (u.a === aId && u.b === bId) || (u.a === bId && u.b === aId);
  })[0];
  if(ex){ selection = { type:'union', id:ex.id }; commit(false, {noSave:true}); toast('两人已有伴侣关系，已选中'); return; }
  pushHistory();
  var single = doc.unions.filter(function(u){ return u.a === aId && !u.b; })[0];
  var u;

  else{
    u = { id:uid('u'), a:aId, b:bId, status:'married', since:null, until:null, order:0, note:'' };
    doc.unions.push(u);
  }
  selection = { type:'union', id:u.id };
  commit(true);
  /* R13-2：新建人物选完伴侣后自动并排到伴侣更空的一侧（不是整行行尾、也不是远处） */
  var fresh = null, partner = null;
  if(isFreshLoosePerson(aId) && !isFreshLoosePerson(bId)){ fresh = aId; partner = bId; }
  else if(isFreshLoosePerson(bId) && !isFreshLoosePerson(aId)){ fresh = bId; partner = aId; }
  else if(isFreshLoosePerson(aId) && isFreshLoosePerson(bId)){ fresh = bId; partner = aId; }
  if(fresh){
    placeBesideEmptierSide(fresh, partner);
    commit(true);
  }
  toast('已建立伴侣关系');
}
function createParentChild(parentId, childId){
  if(!parentId || !childId || parentId === childId) return;

  }

/* ============ 15. 画布：缩放 / 平移 / 拖拽 ============ */
function canvasRect(){ return $('#canvas').getBoundingClientRect(); }
/* 小屏局部聚焦：只把"选中人物（没选中就用索引咨访）+ 其父母/伴侣/子女"这一支算进包围盒；

function branchRoot(){
  if(selection && selection.type === 'node' && personById(selection.id)) return selection.id;
  var idx = (doc.probandId ? personById(doc.probandId) : null) || doc.persons[0];
  return idx ? idx.id : null;
}
function branchIds(pid){
  pid = pid || branchRoot();

    if(!l.primary) return;
    var u = unionById(l.union); if(!u) return;
    if(l.child === pid){ if(u.a) ids[u.a] = 1; if(u.b) ids[u.b] = 1; uids[u.id] = 1; }
    else if(u.a === pid || u.b === pid){ ids[l.child] = 1; uids[u.id] = 1; }
  });
  doc.unions.forEach(function(u){
    if(u.a === pid || u.b === pid){
      if(u.a) ids[u.a] = 1; if(u.b) ids[u.b] = 1; uids[u.id] = 1;
      doc.parentLinks.forEach(function(l){ if(l.primary && l.union === u.id) ids[l.child] = 1; });
    }

}
function branchPred(pid){
  var bi = branchIds(pid); if(!bi) return null;
  var lm = {}, em = {};
  doc.parentLinks.forEach(function(l){ lm[l.id] = l; });
  doc.emotionalLinks.forEach(function(e){ em[e.id] = e; });
  return function(el){
    var g;
    if((g = el.closest('.gx-node'))) return !!bi.ids[g.getAttribute('data-id')];
    if((g = el.closest('.gx-ulink'))) return !!bi.uids[g.getAttribute('data-uid')];
    if((g = el.closest('.gx-lkin'))){
      var l = lm[g.getAttribute('data-lid')];
      return !!(l && bi.ids[l.child]);
    }
    if((g = el.closest('.gx-elink'))){
      var e = em[g.getAttribute('data-eid')];
      return !!(e && bi.ids[e.from] && bi.ids[e.to]);
    }
    return false;
  };
}
function settleAnims(){
  /* 结构变化时 render() 会给 .gx-inner 挂 FLIP 过渡（translate 旧位置→新位置），
     墨迹盒靠 getCTM 取坐标，会把"旧位置"的临时位移量算进去：折叠张建国这一支后
     实测居中偏了 -252px。测量前先让动画直接到位（finish），坐标才等于最终布局 */
  $$('.gx-inner').forEach(function(el){
    if(!el.getAnimations) return;
    el.getAnimations().forEach(function(a){ try{ a.finish(); }catch(e){} });
  });
}
function centerContent(opt){
  opt = opt || {};
  settleAnims();
  var r = canvasRect(), b = layout && layout.bounds;
  if(!r.width) return;
  /* 进入/主动 fit：边距只留可视区短边的 0.8%（至少 4px），把屏幕尽量交给图形；
     之前固定 56px 在手机上吃掉近 30% 宽高，导致整图被缩得比「恰好装下」还小一档；
     8px→4px 是因为 390×844 下 8px 下限会把宽占比压到 95.9%，达不到 ≥97.5% 的验收线 */
  var pad = opt.pad == null ? Math.max(4, Math.round(Math.min(r.width, r.height) * 0.008)) : opt.pad;
  /* 居中基准用可见墨迹包围盒 */
  var bp = opt.branch ? branchPred(opt.branch) : null;
  var cb = (function(){ try{ return contentBox(bp); }catch(e){ return null; } })();
  if(cb && cb.w > 1 && cb.h > 1) b = { x:cb.x, y:cb.y, w:cb.w, h:cb.h };
  if(!b) return;
  if(opt.fit){
    var aw = Math.max(1, r.width - pad*2), ah = Math.max(1, r.height - pad*2);
    var s = Math.min(aw / Math.max(b.w, 1), ah / Math.max(b.h, 1));

  applyView(false);

    /* gm 是 #world 在画布 SVG 用户坐标里的 CTM（原点 = 画布左上角），
       所以和画布自身的 w/2、h/2 比，不能混入窗口坐标 */
    view.x -= (gm.a*cxw + gm.c*cyw + gm.e) - r.width/2;
    view.y -= (gm.b*cxw + gm.d*cyw + gm.f) - r.height/2;
  }
  applyView(true);
  saveView();
  updateToolbar();
  userPanned = false;
}
function fitToContent(){ centerContent({ fit:true }); }
/* 只看选中分支：保留为手动操作，首次打开不再自动聚焦分支 */
function focusBranch(){

}
/* 结构发生变化（增删节点、折叠展开）后：整体自动 fit 并居中，不再依赖用户是否平移过 */
function recenterIfFree(){
  if(!layout || !layout.bounds) return;
  centerContent({ fit:true });
}
/* R16-1：删除人物后不缩放视图。scale 原样保留；重排会让每个幸存人物发生位移，
   取它们的平均世界位移做等量反向 view 平移（最小必要 pan），使整体停在原屏幕位置附近 */
function keepViewAfterDelete(snap){
  if(!snap || !layout || !layout.nodes) return;
  var dx = 0, dy = 0, n = 0;
  for(var id in snap){
    var nn = layout.nodes[id];

    dx += nn.x - snap[id].x;
    dy += nn.y - snap[id].y;
    n++;

/* 需求七：确保某个节点可见；不在视野内才平移（必要时放大），已在视野内则不动 */
function revealPerson(id){
  if(!layout || !layout.nodes[id]) return;
  var r = canvasRect(), n = layout.nodes[id];
  if(!r.width || !r.height) return;
  var sx = view.x + n.x * view.scale, sy = view.y + n.y * view.scale;
  var m = 110;
  if(sx < m || sx > r.width - m || sy < m || sy > r.height - m){
    view.x = r.width / 2 - n.x * view.scale;
    view.y = r.height / 2 - n.y * view.scale;

    contentClamp();
    applyView(true);
    saveView();
  }
}
function zoomBy(factor){
  var r = $('#canvas').getBoundingClientRect();
  zoomAt(r.width/2, r.height/2, factor);
}
function zoomAt(sx, sy, factor){
  var s2 = clamp(view.scale * factor, 0.05, 4);
  var wx = (sx - view.x) / view.scale, wy = (sy - view.y) / view.scale;
  view.x = sx - wx*s2;
  view.y = sy - wy*s2;
  view.scale = s2;
  userPanned = true;
  contentClamp();
  applyView(false);
  saveView();

function resetZoom(){ zoomAt($('#canvas').getBoundingClientRect().width/2, $('#canvas').getBoundingClientRect().height/2, 1/view.scale); }

/* ============ 15b. 触屏手势：单指平移 / 双指中点锚定缩放 / 松手惯性 ============ */
var MIN_SCALE = 0.05, MAX_SCALE = 4;
var touchG = null, inertiaRAF = null;
/* 平移/缩放的边界：内容包围盒至少留一小块在可视区内，拖不丢 */
function contentClamp(){

  /* 以「节点符号的并集」为边界：即使拖到尽头，也保证至少有一块符号区域留在画布内 */
  var b = null, ids = Object.keys(layout.nodes || {});
  if(ids.length){
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    ids.forEach(function(id){
      var n = layout.nodes[id]; if(!n) return;
      x0 = Math.min(x0, n.x - SYMBOL/2); x1 = Math.max(x1, n.x + SYMBOL/2);
      y0 = Math.min(y0, n.y - SYMBOL/2); y1 = Math.max(y1, n.y + SYMBOL/2);
    });
    if(isFinite(x0)) b = { x:x0, y:y0, w:x1 - x0, h:y1 - y0 };
  }
  if(!b) b = layout.bounds;
  if(!b) return;
  var vis = Math.min(140, Math.max(56, Math.min(b.w, b.h) * view.scale / 2.5));
  var loX = vis - (b.x + b.w) * view.scale;
  var hiX = r.width - vis - b.x * view.scale;
  if(loX > hiX){ var mx = (loX + hiX) / 2; loX = mx; hiX = mx; }
  view.x = clamp(view.x, loX, hiX);
  var loY = vis - (b.y + b.h) * view.scale;
  var hiY = r.height - vis - b.y * view.scale;

function stopInertia(){ if(inertiaRAF){ cancelAnimationFrame(inertiaRAF); inertiaRAF = null; } }

    vx *= k; vy *= k;
    contentClamp(); applyView(false);
    if(Math.hypot(vx, vy) * 16.7 < 0.6){ inertiaRAF = null; saveView(); return; }
    inertiaRAF = requestAnimationFrame(step);

  inertiaRAF = requestAnimationFrame(step);
}
/* R22：触屏三态判定 —— 短按 / 拖动 / 长按不动，三者互斥

   · 拖动：位移超过 6px → 人物框跟手 + 代带磁吸；期间与松手后都不弹任何浮层

var LP_MS = 1000, LP_MOVE = 6;

function cancelLP(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; } }
/* 拖动抑制窗口：覆盖 pointerdown→pointermove→pointerup 全链路。
   拖动进行中 popBlocked=true；松手后再留 320ms，挡住同一手势合成的 click/dblclick；
   新的独立手势一开始（touchstart / 鼠标 pointerdown）立即解除，不吃掉正常短按与长按松手 */
var popBlocked = false, popBlockedUntil = 0;
function enterDragBlock(){ popBlocked = true; hideActBar(); hideMenu(); }
function endDragBlock(){
  if(!popBlocked) return;
  popBlocked = false;
  popBlockedUntil = Date.now() + 320;
}
function clearDragBlock(){ if(!popBlocked) popBlockedUntil = 0; }
function popSuppressed(){ return popBlocked || Date.now() < popBlockedUntil; }
function startLongPress(el){
  cancelLP();
  if(!longPressTarget(el) || actBarIsOpen()) return;
  lpEl = el;
  lpTimer = setTimeout(function(){
    lpTimer = null;
    /* 阈值内出现位移 = 拖动，长按作废；只有「按住不动」才置位，动作条等松手再弹 */
    if(!touchG || touchG.moved) return;
    touchG.longReady = true;
  }, LP_MS);
}
function longPressTarget(el){
  if(!el || !el.closest) return null;
  return el.closest('.gx-node') || el.closest('.gx-elink') || el.closest('.gx-ulink') || el.closest('.gx-lkin');
}
/* 选中会触发一次重绘，旧 DOM 引用会失效；按 id 重新取锚点，动作条才能贴着对象 */
function freshAnchor(sel){
  if(!sel || !sel.type) return null;
  if(sel.type === 'person') return document.querySelector('#world .gx-node[data-id="' + sel.id + '"]');
  if(sel.type === 'emotion') return document.querySelector('#world .gx-elink[data-eid="' + sel.id + '"]');
  if(sel.type === 'union') return document.querySelector('#world .gx-ulink[data-uid="' + sel.id + '"]');
  if(sel.type === 'link') return document.querySelector('#world .gx-lkin[data-lid="' + sel.id + '"]');
  return null;
}
function onLongPress(el){
  if(popSuppressed()) return;
  /* 长按只给动作条：置 panelHold，commit 时详情面板保持收起 */
  panelHold = true;
  var nodeEl = el && el.closest ? el.closest('.gx-node') : null;
  var anchor = longPressTarget(el);
  if(!anchor) return;
  if(nodeEl){
    var pid = nodeEl.getAttribute('data-id');
    selection = { type:'person', id: pid };
    showMeaning = true;
    commit(false, { noSave:true });
    showActBar(personMenuItems(pid), freshAnchor(selection) || anchor);
  }else{
    var eEl = el.closest('.gx-elink'), uEl = el.closest('.gx-ulink'), lEl = el.closest('.gx-lkin');
    if(eEl) selection = { type:'emotion', id:eEl.getAttribute('data-eid') };
    else if(uEl) selection = { type:'union', id:uEl.getAttribute('data-uid') };
    else selection = { type:'link', id:lEl.getAttribute('data-lid') };
    showMeaning = true;
    commit(false, { noSave:true });
    showActBar(canvasMenuItems(), freshAnchor(selection) || anchor);
  }
}
function onTouchStart(ev){
  /* 新的独立手势开始：先解除上一段拖动留下的抑制窗口，短按/长按松开照常可用 */
  panelHold = false;
  if(!touchG) clearDragBlock();
  /* 点空白：动作条先收起（点在动作条自身则保留，交给按钮 click 处理） */
  if(actBarIsOpen() && ev.touches[0]){
    var at = document.elementFromPoint(ev.touches[0].clientX, ev.touches[0].clientY);
    if(!(at && at.closest && at.closest('#actbar'))) hideActBar();
  }
  if(ev.touches.length >= 2){
    stopInertia();
    cancelLP();
    /* 单指拖动中落下第二根手指：先把这次人物拖动收口（磁吸落位），再转双指缩放 */
    if(pnTouchDrag) finishTouchPointerDrag();
    var r = canvasRect();
    var a = ev.touches[0], c = ev.touches[1];
    var mx = (a.clientX + c.clientX)/2 - r.left, my = (a.clientY + c.clientY)/2 - r.top;
    var d = Math.hypot(a.clientX - c.clientX, a.clientY - c.clientY) || 1;
    touchG = { mode:'pinch', d0:d, s0:view.scale, ax:(mx - view.x)/view.scale, ay:(my - view.y)/view.scale,
      vx:view.x, vy:view.y, samples:[{ t:Date.now(), x:mx, y:my }] };
  }else if(ev.touches.length === 1){
    /* 人物框上的手势已由指针链路独占：touch 只挡默认行为，不再重复处理 */
    if(pnTouchDrag){ if(ev.cancelable) ev.preventDefault(); return; }
    stopInertia();
    var r2 = canvasRect(), t = ev.touches[0];
    var hitEl = document.elementFromPoint(t.clientX, t.clientY);
    touchG = { mode:'pan', sx:t.clientX - r2.left, sy:t.clientY - r2.top,
      vx:view.x, vy:view.y, moved:false, longReady:false, hit:hitEl, t0:Date.now(),
      samples:[{ t:Date.now(), x:t.clientX, y:t.clientY }] };
    startLongPress(hitEl);
  }
  if(touchG) $('#canvas').classList.add('panning');
  if(ev.cancelable) ev.preventDefault();
}
function onTouchMove(ev){
  if(!touchG) return;
  if(touchG.mode === 'pinch'){
    if(ev.touches.length < 2) return;
    var r = canvasRect();
    var a = ev.touches[0], c = ev.touches[1];
    var mx = (a.clientX + c.clientX)/2 - r.left, my = (a.clientY + c.clientY)/2 - r.top;
    var d = Math.hypot(a.clientX - c.clientX, a.clientY - c.clientY) || 1;
    var s2 = clamp(touchG.s0 * (d / touchG.d0), MIN_SCALE, MAX_SCALE);
    view.scale = s2;
    view.x = mx - touchG.ax * s2;
    view.y = my - touchG.ay * s2;
    userPanned = true;
    applyView(false);
    touchG.samples.push({ t:Date.now(), x:mx, y:my });
    if(touchG.samples.length > 8) touchG.samples.shift();
  }else{
    var t = ev.touches[0], r2 = canvasRect();
    var p = { x:t.clientX - r2.left, y:t.clientY - r2.top };
    var dx = p.x - touchG.sx, dy = p.y - touchG.sy;
    if(!touchG.moved && Math.hypot(dx, dy) > LP_MOVE){ touchG.moved = true; touchG.longReady = false; cancelLP(); }
    if(touchG.moved){
      view.x = touchG.vx + dx; view.y = touchG.vy + dy;
      userPanned = true;
      contentClamp();
      applyView(false);
    }
    touchG.samples.push({ t:Date.now(), x:t.clientX, y:t.clientY });
    if(touchG.samples.length > 8) touchG.samples.shift();
  }
  if(ev.cancelable) ev.preventDefault();
}
function touchSelect(el){
  if(popSuppressed()) return;
  var nodeEl = el && el.closest ? el.closest('.gx-node') : null;
  var lEl = el && el.closest ? el.closest('.gx-lkin') : null;
  var uEl = el && el.closest ? el.closest('.gx-ulink') : null;
  var eEl = el && el.closest ? el.closest('.gx-elink') : null;
  var tapEl = nodeEl || eEl || uEl || lEl;
  if(tapEl){
    tapEl.classList.add('gx-tap');
    setTimeout(function(){ tapEl.classList.remove('gx-tap'); }, 700);
  }
  if(nodeEl){
    var nid = nodeEl.getAttribute('data-id');
    /* 点选模式（触屏与鼠标同一口径）：点人物 = 以起点建伴侣/情感线，完成后回到正常面板 */
    if(pickTarget){
      var from = pickTarget.from, kind = pickTarget.kind;
      pickTarget = null;
      if(nid !== from){
        if(kind === 'partner') createUnionBetween(from, nid);
        else createEmotion(from, nid);
      }
      syncPickbar();
      commit(false, {noSave:true});
      return;
    }
    selection = { type:'person', id:nid };
    showMeaning = true;
    commit(false, { noSave:true });
    return;
  }
  if(eEl){ selection = { type:'emotion', id:eEl.getAttribute('data-eid') }; showMeaning = true; commit(false,{noSave:true}); return; }
  if(uEl){ selection = { type:'union', id:uEl.getAttribute('data-uid') }; showMeaning = true; commit(false,{noSave:true}); return; }
  if(lEl){ selection = { type:'link', id:lEl.getAttribute('data-lid') }; showMeaning = true; commit(false,{noSave:true}); return; }
  /* 点选状态下点空白：只收起选择状态，不改变当前选中（与鼠标一致） */
  if(pickTarget){
    pickTarget = null;
    commit(false, {noSave:true});
    return;
  }
  selection = { type:null, id:null };
  showMeaning = false;
  commit(false, { noSave:true });
}
function onTouchEnd(ev){
  if(!touchG) return;
  if(ev.touches.length >= 1){
    /* 双指变单指：以剩下那根手指重新锚定，避免跳变 */
    var r = canvasRect(), t = ev.touches[0];
    touchG = { mode:'pan', sx:t.clientX - r.left, sy:t.clientY - r.top, vx:view.x, vy:view.y,
      moved:true, hit:null, t0:Date.now(), samples:[{ t:Date.now(), x:t.clientX, y:t.clientY }] };
    return;
  }
  var g = touchG; touchG = null;
  cancelLP();
  $('#canvas').classList.remove('panning');
  /* 线/空白上的长按：松手才出动作条 */
  if(g.longReady){ onLongPress(g.hit); return; }
  if(g.mode === 'pan' && !g.moved && Date.now() - g.t0 < LP_MS){
    touchSelect(g.hit);
    return;
  }
  /* 末速度 → 惯性：取最近 90ms 的位移，整体上限 1.5px/ms，滑行约 0.3-0.5 秒后停住 */
  var s = g.samples || [], n = s.length;
  if(n >= 2){
    var last = s[n-1], ref = s[0];
    for(var i = n-1; i >= 0; i--){ if(last.t - s[i].t >= 90){ ref = s[i]; break; } }
    var dt = Math.max(1, last.t - ref.t);
    var vx = (last.x - ref.x) / dt, vy = (last.y - ref.y) / dt;
    var sp = Math.hypot(vx, vy);
    if(sp > 1.5){ vx *= 1.5/sp; vy *= 1.5/sp; }
    startInertia(vx, vy);
  }else saveView();
}

var drag = null;
/* 触屏落在人物框上时，由指针链路独占这次手势（pointer capture 挂在 #canvas 上，
   重排替换 #world 子节点也不会中断手势；touch 链路此时只负责双指缩放） */
var pnTouchDrag = null;
var activeDragId = null;   /* 当前指针正在拖的节点：排版里唯一不可让位的固定点 */
var popupSwallow = false;  // 本次 pointerdown 只用于收起浮层
var lastSnapInfo = null;   /* 最近一次松手贴合重排的诊断信息（调试/验收用） */
function canvasPoint(ev){
  var r = $('#canvas').getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
/* 这一点上叠着哪些关系线（上→下）：Alt+点击时用来循环命中，避免只能选最上层 */
function edgeStackAt(x, y){
  var out = [];
  (document.elementsFromPoint(x, y) || []).forEach(function(el){
    if(!el.closest) return;
    var g = el.closest('.gx-lkin') || el.closest('.gx-elink') || el.closest('.gx-ulink');
    if(g && out.indexOf(g) < 0) out.push(g);
  });
  return out;
}
function edgeSelOf(g){
  if(g.classList.contains('gx-elink')) return { type:'emotion', id:g.getAttribute('data-eid') };
  if(g.classList.contains('gx-ulink')) return { type:'union', id:g.getAttribute('data-uid') };
  return { type:'link', id:g.getAttribute('data-lid') };
}
/* R14：找出指针所在的那一对「同一行、紧邻、中间确有空白」的人物。
   只在这两框之间的空白带里生效，用于直接拖动两人的间距。 */
function gapPairAt(wp){
  if(!layout || !layout.nodes) return null;
  var best = null;
  for(var k in layout.nodes){
    var A = layout.nodes[k];
    if(!A) continue;
    if(wp.y < A.y - 34 || wp.y > A.y + A.h) continue;
    for(var j in layout.nodes){
      var B = layout.nodes[j];
      if(!B || B.id === A.id || B.gen !== A.gen || B.x <= A.x) continue;
      var gapL = A.x + A.w/2, gapR = B.x - B.w/2;
      if(gapR - gapL < 24) continue;
      if(wp.x <= gapL + 5 || wp.x >= gapR - 5) continue;
      var blocked = false;
      for(var m in layout.nodes){
        var C = layout.nodes[m];
        if(C && C !== A && C !== B && C.gen === A.gen && C.x > A.x && C.x < B.x){ blocked = true; break; }
      }
      if(blocked) continue;
      var d = Math.abs(wp.x - (gapL + gapR) / 2);
      if(!best || d < best.d) best = { a:A.id, b:B.id, d:d };
    }
  }
  return best;
}
/* 人物框拖动的三个公共步骤：触屏与鼠标共用同一套磁吸/联动/撤销逻辑，避免两套实现漂移 */
function makeNodeDrag(pid, sx, sy, pointerId){
  var p = personById(pid);
  if(!p || !layout || !layout.nodes[pid]) return null;
  var unit = singleChildUnitOf(pid), unitOx = {}, unitBase = {};
  if(unit) unit.ids.forEach(function(id){
    var q = personById(id), nn = layout.nodes[id];
    if(q) unitOx[id] = q.offset.x || 0;
    if(nn && q) unitBase[id] = nn.x - (q.offset.x || 0);
  });
  activeDragId = pid;
  /* 拖动一开始就收掉所有浮层，保证拖动期间不会有东西挂在那 */
  hideActBar();
  hideMenu();
  return { mode:'node', id:pid, sx:sx, sy:sy, ox:p.offset.x, oy:p.offset.y,
    moved:false, pointerId:pointerId, pre:snapshot(), unit:unit, unitOx:unitOx, unitBase:unitBase };
}
function applyNodeDragMove(dr, dx, dy){
  var p = personById(dr.id);
  if(!p) return;
  /* 需求一：不再做 ±600 钳制；只受世界坐标有限值保护，任何框都能拖到任意其他框附近 */
  var nx = dr.ox + dx / view.scale, ny = dr.oy + dy / view.scale;
  if(!isFinite(nx)) nx = dr.ox;
  if(!isFinite(ny)) ny = dr.oy;
  /* R17-2：硬钳制降级为软吸附。靠近代带时磁力随距离衰减（越近越强），
     拖得够远就能越过并落到任意代；两代之间与没有任何人的空带都不做限制。
     直系只在自身代带附近有磁力（松手终归本代）；非直系吸最近代线。
     MAG_R 为磁力半径（世界坐标），超出后跟手、不吸。 */
  var lq = layout.nodes[p.id];
  if(lq && lq.rowY != null && layout.rowY){
    var MAG_R = 46, magT = null, magD = Infinity;
    if(isCorePerson(p.id)){
      magT = 0; magD = Math.abs(ny);          /* 本代线在 offset 坐标里恒为 0 */
    }else{
      /* R19-1：非直系按「代带」磁力——带半径与松手吸附同一口径（28–130），
         带内线性吸向最近代线，越界即跟手不吸。 */
      var magG = null;
      for(var gk in layout.rowY){
        var magY = layout.rowY[gk] - lq.rowY, magA = Math.abs(ny - magY);
        if(magA < magD){ magD = magA; magT = magY; magG = gk; }
      }
      if(magG != null) MAG_R = bandOfGen(layout.rowY, magG);
    }
    if(magT != null && magD < MAG_R){
      ny = magT + (ny - magT) * (magD / MAG_R);
    }
  }
  /* R14：独子单元不再「整组横移」——那会把伴侣一起搬走，两人净距永远不变
     · 拖父母中的一位：只让独子跟到新中点，另一位伴侣原地不动 → 伴侣净距可自由改变；
     · 拖独子本人：两位父母成对平移（保持彼此净距），竖线仍然竖直。 */
  if(dr.unit && dr.unit.ids && dr.unitBase){
    var uids = dr.unit.ids, ua = uids[0], ub = uids[1], uc = uids[2];
    var dxu = nx - dr.ox;
    if(isFinite(dr.unitBase[ua]) && isFinite(dr.unitBase[ub]) && isFinite(dr.unitBase[uc])){
      if(p.id === uc){
        [ua, ub].forEach(function(id){
          var q = personById(id); if(!q) return;
          q.offset = { x: (dr.unitOx[id] || 0) + dxu, y: (q.offset && q.offset.y) || 0 };
        });
      }else{
        var xa2 = dr.unitBase[ua] + (p.id === ua ? nx : (dr.unitOx[ua] || 0));
        var xb2 = dr.unitBase[ub] + (p.id === ub ? nx : (dr.unitOx[ub] || 0));
        var qc2 = personById(uc);
        if(qc2) qc2.offset = { x: (xa2 + xb2) / 2 - dr.unitBase[uc], y: (qc2.offset && qc2.offset.y) || 0 };
      }
    }
  }
  p.offset = { x: nx, y: ny };
  p.dragX = nx;
  commit(false, {skipPanel:true, noSave:true});
  $('#canvas').classList.add('panning');
}
function finishNodeDrag(dr){
  if(!dr) return null;
  /* 拖动 + 贴合重排算一步：入栈的是"拖动前"快照，Ctrl+Z 一次回拖动前 */
  var pre = dr.pre, pid = dr.id;
  pushHistoryOf(pre);
  /* 重排期间 activeDragId 仍指向被拖者：落点固定、邻居让位；重排完成后再解除 */
  var sinfo = snapAndRelayout(pid);
  lastSnapInfo = sinfo;
  activeDragId = null;
  return sinfo;
}
/* 双指落下/手势被打断时，把触屏指针拖动收口（磁吸落位），并关掉抑制窗口 */
function finishTouchPointerDrag(){
  var d = pnTouchDrag;
  pnTouchDrag = null;
  if(!d) return;
  if(drag === d) drag = null;
  try{ $('#canvas').releasePointerCapture(d.pointerId); }catch(e){}
  if(d.moved){
    finishNodeDrag(d);
    endDragBlock();
  }else{
    activeDragId = null;
  }
}
function onPointerDown(ev){
  /* 这一次按下已经被「点击浮层外部」消费：只收起浮层，不再触发取消选中/平移 */
  if(popupSwallow){ popupSwallow = false; return; }
  if(ev.button === 2) return;
  /* 新的独立手势：解除上一段拖动留下的抑制窗口 */
  clearDragBlock();
  hideMenu();
  /* 触屏：只有落在人物框上才由指针链路接管（拖动 / 短按 / 长按）；
     空白与线仍走原生 touch 手势，避免和单指平移、双指缩放抢事件 */
  if(ev.pointerType === 'touch'){
    /* 已经有手势在进行（单指平移/双指缩放/已有人物指针拖动）：新落的手指不再抢管 */
    if(pnTouchDrag || touchG) return;
    var tHit = document.elementFromPoint(ev.clientX, ev.clientY);
    var tNode = tHit && tHit.closest ? tHit.closest('.gx-node') : null;
    var tPid = tNode ? tNode.getAttribute('data-id') : null;
    if(!tPid || !personById(tPid)) return;
    var tDrag = makeNodeDrag(tPid, ev.clientX, ev.clientY, ev.pointerId);
    if(!tDrag) return;
    tDrag.touch = true;
    tDrag.hit = tHit;
    tDrag.longReady = false;
    drag = tDrag;
    pnTouchDrag = tDrag;
    try{ $('#canvas').setPointerCapture(ev.pointerId); }catch(e){}
    /* 长按：按住不动 1000ms 只置位，动作条等松手才弹 */
    cancelLP();
    lpEl = tHit;
    lpTimer = setTimeout(function(){
      lpTimer = null;
      if(!pnTouchDrag || pnTouchDrag.moved) return;
      pnTouchDrag.longReady = true;
    }, LP_MS);
    ev.preventDefault();
    return;
  }
  var nodeEl = ev.target.closest ? ev.target.closest('.gx-node') : null;
  var linkEl = ev.target.closest ? ev.target.closest('.gx-elink') : null;
  var uEl = ev.target.closest ? ev.target.closest('.gx-ulink') : null;
  var lEl = ev.target.closest ? ev.target.closest('.gx-lkin') : null;
  /* 交叉/重叠的线：按住 Alt 点击，在这一点上的线里循环切换，否则只能选中 z 序最上层那条 */
  if(ev.altKey && !nodeEl && (linkEl || uEl || lEl) && edgeStackAt && edgeSelOf){
    var st = edgeStackAt(ev.clientX, ev.clientY);
    if(st.length > 1){
      var at = -1;
      st.forEach(function(g, i){
        var s = edgeSelOf(g);
        if(s.type === selection.type && s.id === selection.id) at = i;
      });
      var nxg = st[(at + 1) % st.length];
      selection = edgeSelOf(nxg);
      showMeaning = true;
      commit(false, {noSave:true});
      toast('重叠 ' + st.length + ' 条线 · 已切到下一层');
      return;
    }
  }
  if(nodeEl){
    var pid = nodeEl.getAttribute('data-id');
    /* R11-P2：按下不立即弹详情。按下→松手位移 ≤4px 才算点击（松手时才开面板）；
       超过阈值只走拖动，全程不打开详情 */
    var p = personById(pid);
    if(!p) return;
    drag = makeNodeDrag(pid, ev.clientX, ev.clientY, ev.pointerId);
    if(!drag) return;
    drag.hit = nodeEl;
    try{ $('#canvas').setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();

    var l = 1e9, r = -1e9, t = 1e9, b = -1e9;
    [[il,it],[ir,it],[il,ib],[ir,ib]].forEach(function(q){
      var px = M.a*q[0] + M.c*q[1] + M.e, py = M.b*q[0] + M.d*q[1] + M.f;
      if(px < l) l = px; if(px > r) r = px;
      if(py < t) t = py; if(py > b) b = py;
    });
    var owner = '';
    var nd = el.closest('.gx-node');
    if(nd) owner = nd.getAttribute('data-id') || '';
    else {
      var eg = el.closest('.gx-ulink,.gx-elink,.gx-lkin');
      if(eg) owner = eg.getAttribute('data-uid') || eg.getAttribute('data-eid') || eg.getAttribute('data-lid') || '';
    }
    el.setAttribute('data-gx', 'text');
    el.setAttribute('data-owner', owner);
    el.setAttribute('data-tx', r2(l));
    el.setAttribute('data-ty', r2(t));
    el.setAttribute('data-tw', r2(r - l));
    el.setAttribute('data-th', r2(b - t));
  });
}
function contentBox(pred){
  var bb = null;
  try{ bb = inkBoxWorld(pred); }catch(e){ bb = null; }
  if(!bb || !bb.w || !bb.h){
    var l = layout && layout.bounds;
    if(!l) return { x:0, y:0, w:1, h:1 };
    bb = { x:l.x, y:l.y, w:l.w, h:l.h };
  }
  return bb;
}
function expFit(){
  var b = contentBox();
  var s = Math.min((EXP_PAGE.w - EXP_PAD*2) / Math.max(b.w,1), (EXP_PAGE.h - EXP_PAD*2) / Math.max(b.h,1));
  var vw = EXP_PAGE.w / s, vh = EXP_PAGE.h / s;
  return { x:(b.x + b.w/2) - vw/2, y:(b.y + b.h/2) - vh/2, w:vw, h:vh, s:s, box:b, pad:EXP_PAD };
}
/* 导出文档里没有 html 根，CSS 变量必须自带一份（:root 在独立 SVG 里就是 <svg> 本身） */
function themeVarsCSS(){
  var t = themeNow();
  var acc = themeState.accent || t.v['--accent'];
  var can = themeState.canvas || t.v['--canvas'];
  var parts = [];
  for(var k in t.v){
    if(!Object.prototype.hasOwnProperty.call(t.v, k)) continue;
    var val = t.v[k];
    if(k === '--accent') val = acc;
    if(k === '--canvas') val = can;
    parts.push(k + ':' + val);
  }
  return ':root{' + parts.join(';') + ';--gx-sym:' + (themeState.sym || t.sym) +
    ';--gx-ink:' + t.ink + ';--gx-halo:' + can +
    ';--gx-t2:' + t.v['--ink-2'] + ';--gx-t3:' + t.v['--muted'] +
    ';--gx-acc:' + acc + ';--gx-edge:' + t.edge + '}';
}
function canvasBg(){ return themeState.canvas || themeNow().v['--canvas']; }
/* 唯一序列化路径：预览、PNG、HTML、打印都用它 */
function svgMarkup(scale, fit){
  fit = fit || expFit();
  var vx = fit.x, vy = fit.y, vw = fit.w, vh = fit.h;
  var W = Math.round(EXP_PAGE.w * scale), H = Math.round(EXP_PAGE.h * scale);
  while(W > 8192 || H > 8192){ scale = scale / 2; W = Math.round(EXP_PAGE.w*scale); H = Math.round(EXP_PAGE.h*scale); }
  var holder = document.createElement('div');
  holder.innerHTML = '<svg xmlns="' + SVG_NS + '">' + $('#world').innerHTML + '</svg>';
  var root = holder.firstElementChild;
  $$('.sel, .gx-hit, .gx-ehit', root).forEach(function(n){ if(n.parentNode) n.parentNode.removeChild(n); });
  var style = $('#svstyle').outerHTML.replace(/^<style[^>]*>/, '').replace(/<\/style>$/, '');
  var str = '<svg xmlns="' + SVG_NS + '" width="' + W + '" height="' + H + '" viewBox="' +
    r2(vx) + ' ' + r2(vy) + ' ' + r2(vw) + ' ' + r2(vh) + '" preserveAspectRatio="xMidYMid meet">' +
    '<style>' + themeVarsCSS() + style + '</style>' +
    '<rect x="' + r2(vx) + '" y="' + r2(vy) + '" width="' + r2(vw) + '" height="' + r2(vh) +
    '" fill="' + canvasBg() + '"/>' + root.innerHTML + '</svg>';
  return { str: str, w: W, h: H };
}
function exportSVGString(scale, fit){ return svgMarkup(scale, fit); }
function downloadBlob(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 1200);
}
function exportPNG(scale, rect){
  if(!layout) return;
  try{
    var s = svgMarkup(scale || 1, rect);
    var svgBlob = new Blob([s.str], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(svgBlob);
    var img = new Image();
    img.onload = function(){
      try{
        var cv = document.createElement('canvas');
        cv.width = s.w; cv.height = s.h;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = canvasBg();
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function(b){
          if(!b){ toast('PNG 生成失败'); return; }
          downloadBlob(b, safeName() + '_' + scale + 'x.png');
          toast('PNG 已导出：' + s.w + '×' + s.h);
        }, 'image/png');
      }catch(e){ toast('PNG 生成失败：' + e.message); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); toast('PNG 渲染失败，请尝试导出 SVG'); };
    img.src = url;
  }catch(e){ toast('导出失败：' + e.message); }
}
function exportSVG(){
  var s = exportSVGString(2);
  downloadBlob(new Blob([s.str], { type:'image/svg+xml;charset=utf-8' }), safeName() + '.svg');

}

/* ---- 明细按真实物理页切分：A4 横向正文宽 277mm；可用高 190mm，取 186mm 留 4mm 安全量 ---- */
var PG_MM_W = 277, PG_MM_H = 186;
function pgMmPx(mm){ return mm * 96 / 25.4; }
function pgMeasureBox(){
  var b = document.getElementById('pgMeasure');
  if(!b){
    b = document.createElement('div');
    b.id = 'pgMeasure'; b.setAttribute('aria-hidden','true');
    document.body.appendChild(b);
  }
  b.style.width = PG_MM_W + 'mm';
  return b;
}
function pgIsH2(html){ return /^<h2[\s>]/.test(html); }
function detailPagesHTML(){
  var blocks = detailBlocks();
  var box = pgMeasureBox();
  box.innerHTML = '<div class="dm dm-c">' + blocks.join('') + '</div>';
  var kids = box.firstElementChild.children;
  if(!kids.length) return [];
  var top = [], bot = [], hgt = [];
  for(var i = 0; i < kids.length; i++){
    var r = kids[i].getBoundingClientRect();
    top.push(r.top); bot.push(r.bottom); hgt.push(r.bottom - r.top);
  }
  var pageH = pgMmPx(PG_MM_H);
  var pages = [], cur = [], used = 0;
  for(var i = 0; i < blocks.length; i++){
    var gap = cur.length ? Math.max(0, top[i] - bot[i-1]) : 0;
    var add = gap + hgt[i];
    /* 标题不落单：h2 至少要带下一块一起换页 */
    if(pgIsH2(blocks[i]) && cur.length && i + 1 < blocks.length){
      var gNext = Math.max(0, top[i+1] - bot[i]);
      var withNext = hgt[i] + gNext + hgt[i+1];
      if(used + gap + withNext > pageH){ pages.push(cur); cur = []; used = 0; add = hgt[i]; gap = 0; }
    }
    if(cur.length && used + add > pageH){ pages.push(cur); cur = []; used = 0; add = hgt[i]; }
    cur.push(i); used += add;
  }
  if(cur.length) pages.push(cur);
  return pages.map(function(ids){
    return '<div class="dm dm-c">' + ids.map(function(k){ return blocks[k]; }).join('') + '</div>';
  });
}

   到边缘没有候选时回绕到反方向，保证按键一定有可见响应 */
function moveFocus(dir){
  if(!layout || !layout.nodes) return false;
  var ids = Object.keys(layout.nodes);
  if(!ids.length) return false;
  var cur = navFocusId;
  if(!cur || !layout.nodes[cur]){
    var ae = document.activeElement;
    if(ae && ae.closest){ var f = ae.closest('.gx-node'); if(f) cur = f.getAttribute('data-id'); }
  }
  if(!cur && selection && selection.type === 'person' && layout.nodes[selection.id]) cur = selection.id;
  if(!cur) return setNavFocus(branchRoot() || ids[0]);
  var A = layout.nodes[cur];
  var horiz = (dir === 'left' || dir === 'right');
  var sign = (dir === 'right' || dir === 'down') ? 1 : -1;
  var best = null, bestScore = Infinity, wrap = null, wrapScore = Infinity;
  for(var i = 0; i < ids.length; i++){

    var along = horiz ? (B.x - A.x) * sign : (B.y - A.y) * sign;
    var perp = horiz ? Math.abs(B.y - A.y) : Math.abs(B.x - A.x);
    if(along > 4){
      var sc = along + perp * 3;
      if(sc < bestScore){ bestScore = sc; best = id; }
    }else{
      /* 边缘回绕：取最远侧的同列/同行节点，避免在最近两点之间来回跳 */

    pushHistory();
    p.name = v;
    commit(false);
    return;
  }
  /* 画布上双击编辑日期：统一走部分日期（年 / 年-月 / 年-月-日 / 留空） */
  var nd = normDate(v);

  }

  if(job.field === 'birthDate'){

    if(dd && bd0 && bd0.y > dd.y){ toast('出生日期不能晚于死亡日期，已恢复'); return; }
  }else if(job.field === 'deathDate'){
    var bb = parseDay(p.birthDate);
    var dd0 = parseDay(nd);
    if(bb && dd0 && dd0.y < bb.y){ toast('死亡日期不能早于出生日期，已恢复'); return; }
  }

  p[job.field] = nd;

    if(!g || (ev.button != null && ev.button !== 0)) return;
    var id = g.getAttribute('data-nid');
    if(!id) return;
    ev.preventDefault();
    ntDrag = { id:id, over:null, moved:false, sx:ev.clientX, sy:ev.clientY };
    try{ g.setPointerCapture(ev.pointerId); }catch(e){}
  });
  $('#panel').addEventListener('pointermove', function(ev){
    if(!ntDrag) return;
    if(Math.abs(ev.clientX - ntDrag.sx) + Math.abs(ev.clientY - ntDrag.sy) > 3) ntDrag.moved = true;
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    var row = el && el.closest ? el.closest('.ntrow') : null;
    ntDrag.over = row ? row.getAttribute('data-nid') : null;
    /* 落在目标行的下半部 = 插到它后面，否则插到它前面 */
    var after = false;
    if(row){
      var r = row.getBoundingClientRect();
      after = ev.clientY > r.top + r.height / 2;
    }
    ntDrag.after = after;
  });
  $('#panel').addEventListener('pointerup', function(){
    if(!ntDrag) return;
    var from = ntDrag.id, to = ntDrag.over, moved = ntDrag.moved, after = !!ntDrag.after;
    ntDrag = null;
    if(!moved || !to || to === from) return;
    var p = selection.type === 'person' ? personById(selection.id) : null;
    if(!p) return;
    var fi = -1, ti = -1;
    p.notes.forEach(function(n, i){ if(n.id === from) fi = i; if(n.id === to) ti = i; });
    if(fi < 0 || ti < 0) return;
    pushHistory();
    var mv = p.notes.splice(fi, 1)[0];
    if(fi < ti) ti--;
    if(after) ti++;
    p.notes.splice(ti, 0, mv);
    commit(false);
  });
  $('#panel').addEventListener('pointercancel', function(){ ntDrag = null; });

  $('#toolbar').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-cmd]');
    if(!b || b.disabled) return;
    handleCmd(b.getAttribute('data-cmd'), b);
  });

  $('#title').addEventListener('input', function(){
    doc.meta.title = this.value;
    $('#printTitle').textContent = this.value;
    commit(false, {noLayout:true, skipPanel:true});
  });

  $('#file').addEventListener('change', function(){
    var f = this.files && this.files[0];
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var d = normalizeDoc(JSON.parse(String(fr.result)));
        doc = d;
        selection = { type:null, id:null };
        renderedPos = {};
        pushHistory();
        commit(false); fitToContent();
        toast('已导入：' + (doc.meta.title || '未命名'));
      }catch(e){ toast('导入失败：不是有效的家谱图 JSON'); }
    };
    fr.readAsText(f, 'utf-8');
    this.value = '';
  });

  var escHold = { t0:0, done:false };
  document.addEventListener('focusin', function(ev){
    if(!ev.target || !ev.target.closest) return;
    var n = ev.target.closest('.gx-node');
    if(n){ navFocusId = n.getAttribute('data-id'); applyNavFocus(); }
  });

  document.addEventListener('keydown', function(ev){
    panelHold = false;
    var tag = (ev.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || ev.target.isContentEditable;
    var inTB = !!(ev.target.closest && ev.target.closest('#toolbar'));
    var inPanel = !!(ev.target.closest && ev.target.closest('#panel'));
    if(ev.key === 'Escape'){
      /* 浮动动作条优先收起（遥控器返回键同理，见 navBack） */
      if(actBarIsOpen()){ ev.preventDefault(); hideActBar(); return; }
      /* 自绘下拉展开时：Esc 只收起列表并回到该字段，不退出面板 */
      if(closeDDPopFocus()){ ev.preventDefault(); return; }
      /* 遥控器只有方向键+确认+返回：长按返回 900ms 删除当前焦点人物（可撤销） */
      if(ev.repeat && navFocusId && !escHold.done && performance.now() - escHold.t0 > 900){
        escHold.done = true;
        deletePerson(navFocusId);
        return;
      }
      if(!ev.repeat){ escHold.t0 = performance.now(); escHold.done = false; }
      /* 面板输入框里按 Esc：撤销这次编辑（回滚到聚焦前快照），不关面板 */
      if(typing && ev.target.getAttribute && ev.target.getAttribute('data-field') && ev.target.__docSnap){
        try{ doc = JSON.parse(ev.target.__docSnap); }catch(e){}
        ev.target.__docSnap = null;
        commit(false);
        return;
      }
      if($('#xprev').classList.contains('open')){ closeExport(); return; }
      if($('#help').classList.contains('open')){ closeHelp(); return; }
      if($('#menu').classList.contains('open')){ hideMenu(); return; }
      /* Esc 返回上一层：面板 → 画布，工具栏 → 画布（再按一次才关闭选中） */
      if(inPanel && (!typing || tag === 'select')){ ev.preventDefault(); exitToCanvas(); return; }
      if(inTB){ ev.preventDefault(); exitToCanvas(); return; }
      if(pickTarget){ pickTarget = null; commit(false, {noSave:true}); return; }
      if((!typing || tag === 'select') && selection.type){
        selection = { type:null, id:null };
        commit(false, {noSave:true});
        if(navFocusId) setNavFocus(navFocusId);
        return;
      }
    }
    if(typing && ev.target && ev.target.hasAttribute && ev.target.hasAttribute('data-chiptag') && ev.key === 'Enter'){
      ev.preventDefault();
      var pp = selection.type === 'person' ? personById(selection.id) : null;
      if(pp && ev.target.value){ addTags(pp, ev.target.value); ev.target.value = ''; }
      return;
    }
    /* 输入框无文本时退格：最后一个标签回到输入框可编辑，光标停在末尾；再删空继续往前退 */
    if(typing && ev.target && ev.target.hasAttribute && ev.target.hasAttribute('data-chiptag') &&
       ev.key === 'Backspace' && !ev.ctrlKey && !ev.metaKey && !ev.altKey && !(ev.target.value || '')){
      var bp = selection.type === 'person' ? personById(selection.id) : null;
      if(bp){
        var btags = tagsOf(bp);
        if(btags.length){
          ev.preventDefault();
          var lastTag = btags[btags.length - 1];
          pushHistory();
          removeTag(bp, lastTag);
          commit(false, { skipPanel: true });
          paintTags(bp);
          var cin = ev.target;
          cin.value = lastTag;
          try{ cin.focus(); cin.setSelectionRange(lastTag.length, lastTag.length); }catch(e){}
        }
      }
      return;
    }
    /* 文本类字段（输入框）不参与分区导航：按键留给输入法/光标，不卡住焦点 */
    if(typing && !(inPanel && tag === 'select')) return;
    if(!ev.ctrlKey && !ev.metaKey && !ev.altKey &&
       (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight' || ev.key === 'ArrowUp' || ev.key === 'ArrowDown')){
      var dir2 = ev.key === 'ArrowLeft' ? 'left' : ev.key === 'ArrowRight' ? 'right' : ev.key === 'ArrowUp' ? 'up' : 'down';
      /* 顶层浮层打开时：方向键只在层内移动，不落到画布人物 */
      var lay = navLayer();
      if(lay){ ev.preventDefault(); layerStep(lay, dir2); return; }
      if(inTB){
        ev.preventDefault();
        if(dir2 === 'down') exitToCanvas(); else moveToolbarFocus(dir2);
        return;
      }
      if(inPanel){
        /* 展开的自绘下拉：方向键只在这一层里选 */
        var ddIt = ev.target.closest && ev.target.closest('.dd-it');
        if(ddIt){
          ev.preventDefault();
          var pop0 = ddIt.closest('.dd-pop');
          var items0 = ddPopItems(pop0);
          var ix0 = items0.indexOf(ddIt);
          if(dir2 === 'up' || dir2 === 'left') ix0 = Math.max(0, ix0 - 1);
          else ix0 = Math.min(items0.length - 1, ix0 + 1);
          focusCtrl(items0[ix0]);
          return;
        }
        var ddBtn = ev.target.closest && ev.target.closest('.dd-btn');
        if(ddBtn && (dir2 === 'left' || dir2 === 'right')){
          ev.preventDefault(); cycleDD(ddBtn, dir2 === 'left' ? -1 : 1); return;
        }
        /* 原生下拉：左右键改值，上下键在字段间移动 */
        if(tag === 'select' && (dir2 === 'left' || dir2 === 'right')) return;
        ev.preventDefault();
        movePanelFocus(dir2);
        return;
      }
      /* 面板开着但焦点落在画布：方向键先回到面板，不移动画布人物 */
      if(panelVis && enterPanelNav()){ ev.preventDefault(); return; }
      if(dir2 === 'up' && atTopRow()){ ev.preventDefault(); enterToolbar(); return; }
      ev.preventDefault();
      var moved2 = moveFocus(dir2);
      /* 画布最上排继续按上 → 进入工具栏 */
      if(!moved2 && dir2 === 'up') enterToolbar();
      return;
    }
    /* Enter 激活：工具栏按钮、面板按钮/勾选；画布上仍走 navActivate */
    if(ev.key === 'Enter' && inTB && !typing){
      ev.preventDefault(); ev.target.click(); return;
    }
    if(ev.key === 'Enter' && inPanel && !typing){
      ev.preventDefault(); activatePanelControl(ev.target); return;
    }
    if(ev.key === '?' || (ev.key === '/' && ev.shiftKey)){ openHelp(); ev.preventDefault(); return; }
    if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z'){
      ev.preventDefault();
      if(ev.shiftKey) redo(); else undo();
      return;
    }
    if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y'){ ev.preventDefault(); redo(); return; }
    if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's'){ ev.preventDefault(); exportJSON(); return; }
    if(ev.key === 'Delete' || ev.key === 'Backspace'){ ev.preventDefault(); deleteSelected(); return; }
    if(ev.key === 'f' || ev.key === 'F'){ fitToContent(); return; }
    if(ev.key === '0'){ resetZoom(); return; }
    if(ev.key === '+' || ev.key === '='){ zoomBy(1.15); return; }
    if(ev.key === '-'){ zoomBy(1/1.15); return; }
    /* 键盘可达：Tab 聚焦到人物符号后，Enter / 空格 = 选中该人物并开面板 */
    var foc = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.gx-node') : null;
    if(foc && (ev.key === 'Enter' || ev.key === ' ')){
      ev.preventDefault();
      navFocusId = foc.getAttribute('data-id');
      navActivate();
      return;
    }
    if(ev.key === 'Enter' && selection.type === 'person'){
      var firstCtrl = panelNavList()[0];
      if(firstCtrl) focusCtrl(firstCtrl);
    }
    if(ev.key === ' ' && selection.type === 'person'){ ev.preventDefault(); toggleCollapse(selection.id); }
  });

  $('#help').addEventListener('click', function(ev){
    if(ev.target === this || (ev.target.hasAttribute && ev.target.hasAttribute('data-close'))){ closeHelp(); return; }
    var lr = ev.target.closest('.legend-row[data-code]');
    if(lr){ applyRelation(lr.getAttribute('data-kind'), lr.getAttribute('data-code')); return; }
    var tc = ev.target.closest('[data-theme]');
    if(tc){
      var id = tc.getAttribute('data-theme');
      if(id === 'reset'){ themeState = { id:'linen', accent:'', canvas:'', sym:'' }; }
      else if(id === 'symreset'){ themeState.sym = ''; applyTheme(); openTheme(); toast('符号填充已恢复跟随主题'); return; }
      else{ themeState.id = id; themeState.accent = ''; themeState.canvas = ''; themeState.sym = ''; }
      applyTheme(); closeHelp(); toast('已应用主题');
      return;
    }
  });
  $('#help').addEventListener('input', function(ev){
    if(ev.target.id === 'lgQ'){
      var q = (ev.target.value || '').trim().toLowerCase();
      $$('#helpBox .legend-row').forEach(function(r){
        var kw = (r.getAttribute('data-kw') || '').toLowerCase();
        r.style.display = (!q || kw.indexOf(q) >= 0) ? '' : 'none';
      });
      return;
    }
    if(ev.target.id === 'thAccent'){ themeState.accent = ev.target.value; applyTheme(); }
    if(ev.target.id === 'thCanvas'){ themeState.canvas = ev.target.value; applyTheme(); }
    if(ev.target.id === 'thSym'){ themeState.sym = ev.target.value; applyTheme(); }
  });
  /* 颜色选择器的 change（松手提交）也要生效，避免只拖不松时丢值 */
  $('#help').addEventListener('change', function(ev){
    if(ev.target.id === 'thSym'){ themeState.sym = ev.target.value; applyTheme(); }
  });
  var xpv = $('#xprev');
  xpv.addEventListener('click', function(ev){
    if(ev.target === xpv){ closeExport(); return; }
    var tab = ev.target.closest('button[data-xp]');
    if(tab){ setExpPage(+tab.getAttribute('data-xp')); return; }
    var sc = ev.target.closest('button[data-xps]');
    if(sc){
      expState.scale = +sc.getAttribute('data-xps');
      $('#xpS1').classList.toggle('on', expState.scale === 1);
      $('#xpS2').classList.toggle('on', expState.scale === 2);
      return;
    }
    if(ev.target.closest('#xpDo')){ runExport(); return; }
    if(ev.target.closest('#xpClose')){ closeExport(); }
  });
  /* 「附明细页」开关：预览立即同步，PDF / HTML 导出共用同一状态 */
  xpv.addEventListener('change', function(ev){
    if(ev.target.id === 'xpDetail'){ expState.detail = ev.target.checked; syncDetail(); }
  });
  xpv.addEventListener('pointerdown', function(ev){ ev.stopPropagation(); });
  document.addEventListener('pointerdown', function(ev){
    if(!ev.target.closest('#menu') && !ev.target.closest('#toolbar')) hideMenu();
    if(actBarIsOpen() && !ev.target.closest('#actbar')) hideActBar();
    var t = ev.target, inPanel = !!(t.closest && t.closest('#panel'));
    /* 类别浮层：点在它和触发按钮之外 → 立即收起 */
    if(catPopEl && !catPopEl.hasAttribute('hidden') &&
       !t.closest('#catPop') && !t.closest('[data-act="catPopAdd"]')){
      catPopClose();
      if(!inPanel) popupSwallow = true;
    }
    /* 符号下拉 / 日期选择器：点在其触发控件和浮层之外 → 收起 */
    var ptOpen = $('#panel .pt-list:not([hidden])');
    var dpOpen = $('#panel .dp:not([hidden])');
    if(ptOpen && !t.closest('.ptype')){
      $$('#panel .pt-list').forEach(function(x){ x.setAttribute('hidden',''); });
      if(!inPanel) popupSwallow = true;
    }
    if(dpOpen && !t.closest('.dp') && !t.closest('.din')){
      $$('#panel .dp').forEach(function(x){ x.setAttribute('hidden',''); });
      if(!inPanel) popupSwallow = true;
    }
    /* 自绘下拉：点在 .dd 之外 → 收起（点选项本身在 .dd 内，不受影响） */
    var ddOpen = $('#panel .dd-pop:not([hidden])');
    if(ddOpen && !t.closest('.dd')){
      closeDDPops();
      if(!inPanel) popupSwallow = true;
    }
  }, true);
  var rsTimer = null;
  window.addEventListener('resize', function(){
    if(window.innerWidth > 760) $('#panel').classList.remove('open');
    /* 视口尺寸变化：用户没动过视图就重新 fit 居中；手动 pan/zoom 过则原样保留，不强行拽回 */
    clearTimeout(rsTimer);
    rsTimer = setTimeout(function(){
      if(!layout || !layout.bounds) return;
      if(userPanned){ contentClamp(); applyView(); }
      else centerContent({ fit:true });
    }, 150);
  });
  /* 地址栏收放 / 软键盘：visual viewport 与 layout viewport 高度不同时，仍按画布实际矩形校正 */
  if(window.visualViewport){
    var vvTimer = null;
    window.visualViewport.addEventListener('resize', function(){
      clearTimeout(vvTimer);
      vvTimer = setTimeout(function(){
        if(!layout || !layout.bounds) return;
        if(userPanned){ contentClamp(); applyView(); }
        else centerContent({ fit:true });
      }, 180);
    });
    window.visualViewport.addEventListener('scroll', function(){ applyView(false); });
  }
  window.addEventListener('beforeunload', function(){ saveNow(); });
}

/* ============ 20. 启动 ============ */
var savedViewLoaded = false;
function boot(){
  doc = loadDoc();
  loadTheme();
  $('#title').value = doc.meta.title;
  $('#printTitle').textContent = doc.meta.title;
  relayout();
  render(false);
  /* 加载即自动 fit 居中（不再读取上次视图，避免打开时图形跑到视野外） */
  fitToContent();
  bindEvents();
  pollGamepads();
  updateToolbar();
  if(!localStorage.getItem(K_DOC) || docMigrated) saveNow();   /* R16：旧数据修正后回写一次磁盘，之后幂等 */
}

boot();
})();
</script>
</body>
