}
var toastTimer = null;
function toast(msg){
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2200);
}
function hideMenu(){ $('#menu').classList.remove('open'); }
function showMenu(x, y, items){
  var m = $('#menu');
  m.innerHTML = items.map(function(it, i){
    if(it === '-') return '<div class="msep"></div>';
    return '<button data-mi="' + i + '"' + (it.disabled ? ' disabled style="opacity:.4"' : '') +
      (it.danger ? ' class="danger"' : '') + '>' + esc(it.label) + '</button>';
  }).join('');
  m.classList.add('open');
  var w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
  m.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
  m.onclick = function(ev){
    var b = ev.target.closest('button[data-mi]');
    if(!b) return;
    var it = items[+b.getAttribute('data-mi')];
    hideMenu();
    if(it && it.run) it.run();
  };
}

/* ============ 13. 数据操作 ============ */
function fixPrimary(){
  var byChild = {};
  doc.parentLinks.forEach(function(l){ (byChild[l.child] = byChild[l.child] || []).push(l); });
  Object.keys(byChild).forEach(function(c){
    var ls = byChild[c];
    var prim = ls.filter(function(l){ return l.primary; });
    if(prim.length > 1) prim.slice(1).forEach(function(l){ l.primary = false; });
    if(!prim.length) ls[0].primary = true;
  });
}
function commit(animate, opts){
  opts = opts || {};
  fixPrimary();
  if(!opts.noLayout) relayout();
  render(animate === undefined ? false : animate, opts.skipPanel);
  if(!opts.noSave) autosave();
}
function newPerson(name, gender){
  var p = P(uid('p'), name || '', gender || 'unknown');
  doc.persons.push(p);
  return p;
}
function addStandalonePerson(){
  pushHistory();
  var p = newPerson('', 'unknown');
  selection = { type:'person', id:p.id };
  commit();
  recenterIfFree();
  toast('已新建人物，请在右侧填写姓名与性别');
}
function addPartner(){
  var p = personById(selection.id);
  if(!p){ toast('请先选中一个人物'); return; }
  pushHistory();
  var g = p.gender === 'male' ? 'female' : (p.gender === 'female' ? 'male' : 'unknown');
  var q = newPerson('', g);
  var orders = unionsOf(p.id).map(function(u){ return u.order || 0; });
  var ord = orders.length ? Math.max.apply(null, orders) + 1 : 0;
  doc.unions.push({ id:uid('u'), a:p.id, b:q.id, status:'married', since:null, until:null, order:ord, note:'' });
  selection = { type:'person', id:q.id };
  commit(true);
  recenterIfFree();
  toast('已添加伴侣（请填写姓名）');
}
function addChild(pid, unionId){
  var p = personById(pid || selection.id);
  if(!p){ toast('请先选中一个人物'); return; }
  pushHistory();
  var u = unionId ? unionById(unionId) : unionsOf(p.id)[0];
  if(!u){
    u = { id:uid('u'), a:p.id, b:null, status:'single', since:null, until:null, order:0, note:'' };
    doc.unions.push(u);
  }
  var ord = linksOfUnion(u.id).reduce(function(m,l){ return Math.max(m, l.order || 0); }, -1) + 1;
  var child = newPerson('', 'unknown');
  doc.parentLinks.push({ id:uid('l'), child:child.id, union:u.id, kind:'biological', order:ord, primary:true });
  selection = { type:'person', id:child.id };
  commit(true);
  recenterIfFree();
  toast('已添加子女（请填写姓名与性别）');
}
function deletePerson(id){
  pushHistory();
  var us = unionsOf(id).map(function(u){ return u.id; });
  doc.unions = doc.unions.filter(function(u){ return us.indexOf(u.id) < 0; });
  doc.parentLinks = doc.parentLinks.filter(function(l){ return us.indexOf(l.union) < 0 && l.child !== id; });
  doc.emotionalLinks = doc.emotionalLinks.filter(function(e){ return e.from !== id && e.to !== id; });
  doc.persons = doc.persons.filter(function(p){ return p.id !== id; });
  if(selection.type === 'person' && selection.id === id) selection = { type:null, id:null };
  commit(true);
  recenterIfFree();
}
function deleteSelected(){
  if(selection.type === 'person') deletePerson(selection.id);
  else if(selection.type === 'emotion'){
    pushHistory();
    doc.emotionalLinks = doc.emotionalLinks.filter(function(e){ return e.id !== selection.id; });
    selection = { type:null, id:null };
    commit(true);
    recenterIfFree();
  }
}
function toggleCollapse(id){
  var p = personById(id);
  if(!p || !hasDescendants(id)) return;
  pushHistory();
  p.collapsed = !p.collapsed;
  commit(true);
  recenterIfFree();
  toast(p.collapsed ? '已折叠该分支（徽标显示隐藏人数）' : '已展开该分支');
}
function autoLayout(){
  pushHistory();
  doc.persons.forEach(function(p){ p.offset = { x:0, y:0 }; });
  commit(true);
  centerContent({ fit:true, pad:60 });
  toast('已重新自动排版并居中');
}
function createUnionBetween(aId, bId){
  if(!aId || !bId || aId === bId) return;
  if(isAncestor(aId, bId) || isAncestor(bId, aId)){ toast('不能为直系亲属建立伴侣关系'); return; }
  var ex = doc.unions.filter(function(u){
    return (u.a === aId && u.b === bId) || (u.a === bId && u.b === aId);
  })[0];
  if(ex){ selection = { type:'union', id:ex.id }; commit(false, {noSave:true}); toast('两人已有伴侣关系，已选中'); return; }
  pushHistory();
  var single = doc.unions.filter(function(u){ return u.a === aId && !u.b; })[0];
  var u;
  if(single){ single.b = bId; single.status = 'married'; u = single; }
  else{
    u = { id:uid('u'), a:aId, b:bId, status:'married', since:null, until:null, order:0, note:'' };
    doc.unions.push(u);
  }
  selection = { type:'union', id:u.id };
  commit(true);
  toast('已建立伴侣关系（已婚，可在面板修改）');
}
function createParentChild(parentId, childId){
  if(!parentId || !childId || parentId === childId) return;
  if(isAncestor(childId, parentId)){ toast('不能形成循环亲子关系'); return; }
  var us = unionsOf(parentId);
  var u = us.filter(function(x){ return x.b; })[0] || us[0];
  if(!u){
    u = { id:uid('u'), a:parentId, b:null, status:'single', since:null, until:null, order:0, note:'' };
    doc.unions.push(u);
  }
  if(doc.parentLinks.some(function(l){ return l.child === childId && l.union === u.id; })){
    toast('该亲子关系已存在'); return;
  }
  pushHistory();
  var hasPrimary = doc.parentLinks.some(function(l){ return l.child === childId && l.primary; });
  var ord = linksOfUnion(u.id).reduce(function(m, l){ return Math.max(m, l.order || 0); }, -1) + 1;
  var l = { id:uid('l'), child:childId, union:u.id, kind:'biological', order:ord, primary:!hasPrimary };
  doc.parentLinks.push(l);
  selection = { type:'link', id:l.id };
  commit(true);
  toast('已建立亲子关系（默认亲生，可在面板修改）');
}
function newEmotionFrom(){
  if(selection.type !== 'person') return;
  pickTarget = { from: selection.id };
  commit(false, {noSave:true});
  toast('请点击目标人物以建立情感关系，Esc 取消');
}
function createEmotion(fromId, toId){
  if(fromId === toId) return;
  var exist = doc.emotionalLinks.filter(function(e){
    return (e.from === fromId && e.to === toId) || (e.from === toId && e.to === fromId);
  })[0];
  if(exist){ selection = { type:'emotion', id: exist.id }; commit(false, {noSave:true}); toast('这两人之间已有情感线，已选中'); return; }
  pushHistory();
  var e = { id: uid('e'), from: fromId, to: toId, type:'conflict', note:'' };
  doc.emotionalLinks.push(e);
  selection = { type:'emotion', id: e.id };
  commit(true);
  toast('已新建情感线（默认冲突，可在面板切换类型）');
}

/* ============ 14. 面板事件 ============ */
function onPanelInput(ev){
  var t = ev.target;
  if(t.classList && t.classList.contains('pk-q')){
    var q = (t.value || '').trim().toLowerCase();
    var list = t.parentNode.querySelector('.pk-list');
    if(list){
      Array.prototype.forEach.call(list.querySelectorAll('.pk-item'), function(b){
        /* 命中范围：中文名 + 英文 code（含 cpl_/emo_ 前缀）+ 含义，中英文都能搜 */
        var kw = (b.getAttribute('data-kw') || '') + ' ' + b.textContent;
        b.style.display = kw.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
      });
      list.scrollTop = 0;
    }
    return;
  }
  var p = selection.type === 'person' ? personById(selection.id) : null;
  var isText = t.type === 'text' || t.type === 'number';
  if(t.hasAttribute('data-field') && p){
    if(!isText) pushHistory();
    else{
      var now = Date.now();
      if(now - lastInputAt > 800) pushHistory();
      lastInputAt = now;
    }
    var f = t.getAttribute('data-field');
    if(f && !t.__docSnap) t.__docSnap = JSON.stringify(doc);   /* Esc 回滚用的快照：本次编辑开始前的状态 */
    if(f === 'name') p.name = t.value;
    else if(f === 'gender'){ p.gender = t.value; p.symbol = ''; }
    else if(f === 'symbol') p.symbol = t.value;
    else if(f === 'isIndex'){
      var prevIdx = doc.probandId;
      if(t.checked && prevIdx && prevIdx !== p.id){
        /* 拒绝操作：不转移、不覆盖；回滚勾选，不产生撤销步，也不改写 doc */
        t.checked = false;
        dropNoopHistory();
        toast('索引咨访已选中 ' + probandName(prevIdx) + '，更改请先取消选中。');
        commit(false, {skipPanel:true, noSave:true});
        return;
      }
      if(t.checked){ doc.probandId = p.id; if(!prevIdx) toast('已设为索引咨访：' + personName(p.id)); }
      else if(prevIdx === p.id){ doc.probandId = null; toast('已取消索引咨访（全图无双框）'); }
      else dropNoopHistory();
    }
    else if(f === 'deceased') p.deceased = t.checked;
    else if(f === 'pregnancy') p.pregnancy = (t.value === 'pregnant' || t.value === 'miscarriage') ? t.value : null;
    else if(f === 'birthYear'){
      var by = t.value.trim() ? parseInt(t.value, 10) : null;
      if(by != null && (!isFinite(by) || by < 1850 || by > new Date().getFullYear() + 1)){
        dropNoopHistory();
        toast('出生年份无效，已恢复'); commit(false, {noSave:true}); return;
      }
      p.birthYear = by;
    }
    else if(f === 'deathYear'){
      var dy = t.value.trim() ? parseInt(t.value, 10) : null;
      if(dy != null && (!isFinite(dy) || dy < 1850 || dy > new Date().getFullYear() + 1)){
        dropNoopHistory();
        toast('死亡年份无效，已恢复'); commit(false, {noSave:true}); return;
      }
      p.deathYear = dy;
      /* 只填死亡年也必须能看见死亡信息：自动勾选"已故"，否则叉线/寿年/年份都不会画出来 */
      if(dy != null && !p.deceased) p.deceased = true;
    }
    else if(f === 'birthDate'){
      if(t.value && !parseDay(t.value)){ dropNoopHistory(); toast('日期格式应为 1990-05-12'); commit(false, {noSave:true}); return; }
      p.birthDate = t.value; if(parseDay(t.value)) p.birthYear = parseDay(t.value).y;
    }
    else if(f === 'deathDate'){
      if(t.value && !parseDay(t.value)){ dropNoopHistory(); toast('日期格式应为 1990-05-12'); commit(false, {noSave:true}); return; }
      p.deathDate = t.value; if(parseDay(t.value)){ p.deathYear = parseDay(t.value).y; if(!p.deceased) p.deceased = true; }
    }
    commit(false, {skipPanel:isText});
    var cbx = $('#panel input[data-field="deceased"]');
    if(cbx) cbx.checked = !!p.deceased;
    var calc = $('#panel .calc');
    if(calc) calc.innerHTML = '年龄 <b>' + (ageOf(p) == null ? '—' : ageOf(p)) + '</b>';
    return;
  }
  if(t.hasAttribute('data-ntype') && p){
    pushHistory();
    var n = p.notes.filter(function(x){ return x.id === t.getAttribute('data-ntype'); })[0];
    if(n){ n.type = t.value; if(!n.label || n.label === NOTE_DEFAULT[n.type]) n.label = NOTE_DEFAULT[n.type]; }
    commit(false); return;
  }
  if(t.hasAttribute('data-nlabel') && p){
    var now2 = Date.now();
    if(now2 - lastInputAt > 800) pushHistory();
    lastInputAt = now2;
    var n2 = p.notes.filter(function(x){ return x.id === t.getAttribute('data-nlabel'); })[0];
    if(n2) n2.label = t.value;
    commit(false, {skipPanel:true}); return;
  }
  if(t.hasAttribute('data-nvalue') && p){
    var now3 = Date.now();
    if(now3 - lastInputAt > 800) pushHistory();
    lastInputAt = now3;
    var n3 = p.notes.filter(function(x){ return x.id === t.getAttribute('data-nvalue'); })[0];
    if(n3) n3.value = t.value;
    commit(false, {skipPanel:true}); return;
  }
  /* 事件三字段：同样按 800ms 静默窗口合并成一步撤销，不做日期格式校验（只截断长度） */
  if((t.hasAttribute('data-evtime') || t.hasAttribute('data-evplace') || t.hasAttribute('data-evtext')) && p){
    var nowE0 = Date.now();
    if(nowE0 - lastInputAt > 800) pushHistory();
    lastInputAt = nowE0;
    var evId = t.getAttribute('data-evtime') || t.getAttribute('data-evplace') || t.getAttribute('data-evtext');
    var ev = (p.events || []).filter(function(x){ return x.id === evId; })[0];
    if(ev){
      if(t.hasAttribute('data-evtime')) ev.time = t.value.slice(0, 40);
      else if(t.hasAttribute('data-evplace')) ev.place = t.value.slice(0, 80);
      else ev.text = t.value.slice(0, 200);
    }
    commit(false, {skipPanel:true}); return;
  }
  if(t.hasAttribute('data-ufield')){
    var ur = t.closest('.urec');
    var u = ur ? unionById(ur.getAttribute('data-uid')) : null;
    if(!u) return;
    pushHistory();
    var uf = t.getAttribute('data-ufield');
    if(uf === 'status'){ u.status = t.value; if(!u.b) u.status = 'single'; }
    if(uf === 'since') u.since = num(t.value);
    if(uf === 'until') u.until = num(t.value);
    commit(false, {skipPanel:true}); return;
  }
  if(t.hasAttribute('data-lfield')){
    var l = doc.parentLinks.filter(function(x){ return x.id === t.getAttribute('data-lid'); })[0];
    if(!l) return;
    pushHistory();
    l.kind = t.value;
    commit(true); return;
  }
  if(t.hasAttribute('data-efield')){
    var e = doc.emotionalLinks.filter(function(x){ return x.id === t.getAttribute('data-eid'); })[0];
    if(!e) return;
    var nowE = Date.now();
    if(t.type === 'text'){ if(nowE - lastInputAt > 800) pushHistory(); lastInputAt = nowE; }
    else pushHistory();
    var ef = t.getAttribute('data-efield');
    if(ef === 'type'){ e.type = t.value; commit(true); }
    else { e.note = t.value; commit(false, {skipPanel:true}); }
    return;
  }
  if(t.hasAttribute('data-act') && t.tagName === 'SELECT' && t.getAttribute('data-act') === 'addExtraParent'){
    if(!t.value) return;
    pushHistory();
    doc.parentLinks.push({ id:uid('l'), child:p.id, union:t.value, kind:'biological', order:99, primary:false });
    commit(true);
    toast('已添加附加父母线（虚线）');
    return;
  }
}

function onPanelClick(ev){
  var pk = ev.target.closest('.pk-item');
  if(pk){
    var set = pk.getAttribute('data-set'), val = pk.getAttribute('data-val');
    pushHistory();
    if(set === 'emo' && selection.type === 'emotion'){
      var ex = doc.emotionalLinks.filter(function(x){ return x.id === selection.id; })[0];
      if(ex) ex.type = val;
    }else if(set === 'cpl' && selection.type === 'union'){
      var uu = unionById(selection.id);
      if(uu && uu.b) uu.status = val;
    }else if(set === 'kid' && selection.type === 'link'){
      var ll = doc.parentLinks.filter(function(x){ return x.id === selection.id; })[0];
      if(ll) ll.kind = val;
    }
    showMeaning = true;
    commit(true);
    var sp = set === 'emo' ? emoOf(val) : (set === 'cpl' ? CPL_BY_STATUS[val] : KID_BY_KIND[val]);
    if(sp) toast('已改为「' + sp.zh + '」');
    return;
  }
  var b = ev.target.closest('[data-act]');
  if(!b) return;
  var act = b.getAttribute('data-act');
  var p = selection.type === 'person' ? personById(selection.id) : null;
  if(act === 'addNote'){
    if(!p) return;
    pushHistory();
    p.notes.push({ id: uid('n'), type:'occupation', label:'职业', value:'' });
    commit(false); return;
  }
  if(act === 'delNote' && p){
    pushHistory();
    p.notes = p.notes.filter(function(n){ return n.id !== b.getAttribute('data-nid'); });
    commit(true); return;
  }
  if(act === 'addEvent' && p){
    pushHistory();
    (p.events = p.events || []).push({ id: uid('ev'), time:'', place:'', text:'', note:'', tag:'' });
    commit(false); return;
  }
  if(act === 'delEvent' && p){
    pushHistory();
    p.events = (p.events || []).filter(function(e){ return e.id !== b.getAttribute('data-ev'); });
    commit(true); return;
  }
  if((act === 'evUp' || act === 'evDown') && p){
    var evs3 = p.events || [], ei2 = -1;
    evs3.forEach(function(e, i){ if(e.id === b.getAttribute('data-ev')) ei2 = i; });
    var to2 = ei2 + (act === 'evUp' ? -1 : 1);
    if(ei2 < 0 || to2 < 0 || to2 >= evs3.length) return;
    pushHistory();
    var tmpE = evs3[ei2]; evs3[ei2] = evs3[to2]; evs3[to2] = tmpE;
    commit(true); return;
  }
  if(act === 'addPartner'){ addPartner(); return; }
  if(act === 'addChildTo'){ addChild(selection.id, b.getAttribute('data-uid')); return; }
  if(act === 'delUnion'){
    pushHistory();
    var uidv = b.getAttribute('data-uid');
    doc.unions = doc.unions.filter(function(u){ return u.id !== uidv; });
    doc.parentLinks = doc.parentLinks.filter(function(l){ return l.union !== uidv; });
    commit(true); return;
  }
  if(act === 'delLink'){
    pushHistory();
    var lid = b.getAttribute('data-lid');
    doc.parentLinks = doc.parentLinks.filter(function(l){ return l.id !== lid; });
    commit(true); return;
  }
  if(act === 'linkUp' || act === 'linkDown'){
    var l2 = doc.parentLinks.filter(function(x){ return x.id === b.getAttribute('data-lid'); })[0];
    if(!l2) return;
    pushHistory();
    l2.order = (l2.order || 0) + (act === 'linkUp' ? -1 : 1);
    if(l2.order < 0) l2.order = 0;
    commit(true); return;
  }
  if(act === 'makePrimary'){
    pushHistory();
    var lid2 = b.getAttribute('data-lid');
    var l3 = doc.parentLinks.filter(function(x){ return x.id === lid2; })[0];
    if(l3){ doc.parentLinks.filter(function(x){ return x.child === l3.child; }).forEach(function(x){ x.primary = (x.id === lid2); }); }
    commit(true); return;
  }
  if(act === 'toggleCollapse'){ toggleCollapse(selection.id); return; }
  if(act === 'delPerson'){ if(confirm('确定删除该人物及其全部关系？')) deletePerson(selection.id); return; }
  if(act === 'newEmo'){ newEmotionFrom(); return; }
  if(act === 'delEmo'){
    pushHistory();
    var eid = b.getAttribute('data-eid');
    doc.emotionalLinks = doc.emotionalLinks.filter(function(e){ return e.id !== eid; });
    if(selection.type === 'emotion' && selection.id === eid) selection = { type:null, id:null };
    commit(true); return;
  }
  if(act === 'swapEmo'){
    pushHistory();
    var e2 = doc.emotionalLinks.filter(function(x){ return x.id === b.getAttribute('data-eid'); })[0];
    if(e2){ var tmp = e2.from; e2.from = e2.to; e2.to = tmp; }
    commit(true); return;
  }
}

/* ============ 15. 画布：缩放 / 平移 / 拖拽 ============ */
function canvasRect(){ return $('#canvas').getBoundingClientRect(); }
/* 小屏局部聚焦：只把"选中人物（没选中就用索引咨访）+ 其父母/伴侣/子女"这一支算进包围盒；
   其余元素仍然渲染，只是落在视野外，拖动即可看到（「排版」= 回到整图 fit） */
function branchRoot(){
  if(selection && selection.type === 'node' && personById(selection.id)) return selection.id;
  var idx = (doc.probandId ? personById(doc.probandId) : null) || doc.persons[0];
  return idx ? idx.id : null;
}
function branchIds(pid){
  pid = pid || branchRoot();
  if(!pid || !personById(pid)) return null;
  var ids = {}, uids = {};
  ids[pid] = 1;
  doc.parentLinks.forEach(function(l){
    if(!l.primary) return;
    var u = unionById(l.union); if(!u) return;
    if(l.child === pid){ if(u.a) ids[u.a] = 1; if(u.b) ids[u.b] = 1; uids[u.id] = 1; }
    else if(u.a === pid || u.b === pid){ ids[l.child] = 1; uids[u.id] = 1; }
  });
  doc.unions.forEach(function(u){
    if(u.a === pid || u.b === pid){
      if(u.a) ids[u.a] = 1; if(u.b) ids[u.b] = 1; uids[u.id] = 1;
      doc.parentLinks.forEach(function(l){ if(l.primary && l.union === u.id) ids[l.child] = 1; });
    }
  });
  return { ids:ids, uids:uids };
}
function branchPred(pid){
  var bi = branchIds(pid); if(!bi) return null;
  var lm = {}, em = {};
  doc.parentLinks.forEach(function(l){ lm[l.id] = l; });
  doc.emotionalLinks.forEach(function(e){ em[e.id] = e; });
  return function(el){
    var g;
    if((g = el.closest('.gx-node'))) return !!bi.ids[g.getAttribute('data-id')];
    if((g = el.closest('.gx-ulink'))) return !!bi.uids[g.getAttribute('data-uid')];
    if((g = el.closest('.gx-lkin'))){
      var l = lm[g.getAttribute('data-lid')];
      return !!(l && bi.ids[l.child]);
    }
    if((g = el.closest('.gx-elink'))){
      var e = em[g.getAttribute('data-eid')];
      return !!(e && bi.ids[e.from] && bi.ids[e.to]);
    }
    return false;
  };
}
function settleAnims(){
  /* 结构变化时 render() 会给 .gx-inner 挂 FLIP 过渡（translate 旧位置→新位置），
     墨迹盒靠 getCTM 取坐标，会把"旧位置"的临时位移量算进去：折叠张建国这一支后
     实测居中偏了 -252px。测量前先让动画直接到位（finish），坐标才等于最终布局 */
  $$('.gx-inner').forEach(function(el){
    if(!el.getAnimations) return;
    el.getAnimations().forEach(function(a){ try{ a.finish(); }catch(e){} });
  });
}
function centerContent(opt){
  opt = opt || {};
  settleAnims();
  var r = canvasRect(), b = layout && layout.bounds;
  if(!r.width) return;
  var pad = opt.pad == null ? 56 : opt.pad;
  /* 居中基准改用可见墨迹包围盒：layout.bounds 的左右留白算法不对称
     （左侧 max(w/2+8,72)、右侧 max(w/2+8,40)），会带来十几 px 偏移 */
  var small = r.width < 620;
  var bp = small ? branchPred() : null;     /* 小屏只测选中分支，字号才够读 */
  var cb = (function(){ try{ return contentBox(bp); }catch(e){ return null; } })();
  if(cb && cb.w > 1 && cb.h > 1) b = { x:cb.x, y:cb.y, w:cb.w, h:cb.h };
  if(!b) return;
  if(opt.fit){
    var s = Math.min((r.width - pad*2) / Math.max(b.w, 1), (r.height - pad*2) / Math.max(b.h, 1), 1);
    /* 小屏（画布窄于 620px）整图 fit 会把正文压到 2px 左右，完全不可读：
       默认只把"选中分支"填满视口（缩放下限 0.8，正文≈10px 可读），其余部分拖动查看；
       桌面端仍按整图 fit。「排版」按钮 = 整图 */
    view.scale = small ? clamp(s, 0.8, 1) : clamp(s, 0.16, 1);
    if(small && !narrowTipDone){
      narrowTipDone = true;
      setTimeout(function(){ toast('小屏：只显示当前分支，拖动看其余；点「排版」看整图'); }, 320);
    }
  }
  view.x = (r.width - b.w*view.scale)/2 - b.x*view.scale;
  view.y = (r.height - b.h*view.scale)/2 - b.y*view.scale;
  /* 用"墨迹盒"在屏幕上的实际中心做一次补正：命中层（.gx-hit/.gx-ehit）比可见图形大 14px，
     拿 #world.getBoundingClientRect 校正会把不可见层算进去，实测偏差约 2.6px */
  applyView(false);
  var gm = $('#world').getCTM();
  if(gm && b && b.w > 1){
    var cxw = b.x + b.w/2, cyw = b.y + b.h/2;
    /* gm 是 #world 在画布 SVG 用户坐标里的 CTM（原点 = 画布左上角），
       所以和画布自身的 w/2、h/2 比，不能混入窗口坐标 */
    view.x -= (gm.a*cxw + gm.c*cyw + gm.e) - r.width/2;
    view.y -= (gm.b*cxw + gm.d*cyw + gm.f) - r.height/2;
  }
  applyView(true);
  saveView();
  updateToolbar();
  userPanned = false;
}
function fitToContent(){ centerContent({ fit:true, pad:56 }); }
/* 结构发生变化（增删节点、折叠展开）后：整体自动 fit 并居中，不再依赖用户是否平移过 */
function recenterIfFree(){
  if(!layout || !layout.bounds) return;
  centerContent({ fit:true, pad:56 });
}
function zoomBy(factor){
  var r = $('#canvas').getBoundingClientRect();
  zoomAt(r.width/2, r.height/2, factor);
}
function zoomAt(sx, sy, factor){
  var s2 = clamp(view.scale * factor, 0.25, 4);
  var wx = (sx - view.x) / view.scale, wy = (sy - view.y) / view.scale;
  view.x = sx - wx*s2;
  view.y = sy - wy*s2;
  view.scale = s2;
  userPanned = true;
  applyView(false);
  saveView();
  updateToolbar();
}
function resetZoom(){ zoomAt($('#canvas').getBoundingClientRect().width/2, $('#canvas').getBoundingClientRect().height/2, 1/view.scale); }

var drag = null;
var lastSnapInfo = null;   /* 最近一次松手贴合重排的诊断信息（调试/验收用） */
function canvasPoint(ev){
  var r = $('#canvas').getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
/* 这一点上叠着哪些关系线（上→下）：Alt+点击时用来循环命中，避免只能选最上层 */
function edgeStackAt(x, y){
  var out = [];
  (document.elementsFromPoint(x, y) || []).forEach(function(el){
    if(!el.closest) return;
    var g = el.closest('.gx-lkin') || el.closest('.gx-elink') || el.closest('.gx-ulink');
    if(g && out.indexOf(g) < 0) out.push(g);
  });
  return out;
}
function edgeSelOf(g){
  if(g.classList.contains('gx-elink')) return { type:'emotion', id:g.getAttribute('data-eid') };
  if(g.classList.contains('gx-ulink')) return { type:'union', id:g.getAttribute('data-uid') };
  return { type:'link', id:g.getAttribute('data-lid') };
}
function onPointerDown(ev){
  if(ev.button === 2) return;
  hideMenu();
  var nodeEl = ev.target.closest ? ev.target.closest('.gx-node') : null;
  var linkEl = ev.target.closest ? ev.target.closest('.gx-elink') : null;
  var uEl = ev.target.closest ? ev.target.closest('.gx-ulink') : null;
  var lEl = ev.target.closest ? ev.target.closest('.gx-lkin') : null;
  /* 触屏没有 hover：按下时短暂打上 .gx-tap，给出和 hover 一样的反馈 */
  var tapEl = nodeEl || linkEl || uEl || lEl;
  if(ev.pointerType === 'touch' && tapEl){
    tapEl.classList.add('gx-tap');
    setTimeout(function(){ tapEl.classList.remove('gx-tap'); }, 700);
  }
  /* 交叉/重叠的线：按住 Alt 点击，在这一点上的线里循环切换，否则只能选中 z 序最上层那条 */
  if(ev.altKey && !nodeEl && (linkEl || uEl || lEl) && edgeStackAt && edgeSelOf){
    var st = edgeStackAt(ev.clientX, ev.clientY);
    if(st.length > 1){
      var at = -1;
      st.forEach(function(g, i){
        var s = edgeSelOf(g);
        if(s.type === selection.type && s.id === selection.id) at = i;
      });
      var nxg = st[(at + 1) % st.length];
      selection = edgeSelOf(nxg);
      showMeaning = true;
      commit(false, {noSave:true});
      toast('重叠 ' + st.length + ' 条线 · 已切到下一层（重复 Alt+点击继续）');
      return;
    }
  }
  if(nodeEl){
    var pid = nodeEl.getAttribute('data-id');
    if(pickTarget){
      var from = pickTarget.from;
      pickTarget = null;
      if(pid !== from){ createEmotion(from, pid); return; }
      commit(false, {noSave:true}); return;
    }
    var needPaint = selection.type !== 'person' || selection.id !== pid || !showMeaning;
    selection = { type:'person', id:pid };
    showMeaning = true;
    if(needPaint) commit(false, {noSave:true});
    var p = personById(pid);
    if(!p) return;
    if(linkMode || ev.shiftKey){
      drag = { mode:'link', from:pid, sx:ev.clientX, sy:ev.clientY, moved:false, pointerId:ev.pointerId };
    }else{
      drag = { mode:'node', id:pid, sx:ev.clientX, sy:ev.clientY, ox:p.offset.x, oy:p.offset.y,
        moved:false, pointerId:ev.pointerId, pre:snapshot() };
    }
    try{ $('#canvas').setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
    return;
  }
  if(linkEl){
    selection = { type:'emotion', id: linkEl.getAttribute('data-eid') };
    showMeaning = true;
    commit(false, {noSave:true});
    return;
  }
  if(uEl){
    selection = { type:'union', id: uEl.getAttribute('data-uid') };
    showMeaning = true;
    commit(false, {noSave:true});
    return;
  }
  if(lEl){
    selection = { type:'link', id: lEl.getAttribute('data-lid') };
    showMeaning = true;
    commit(false, {noSave:true});
    return;
  }
  selection = { type:null, id:null };
  showMeaning = false;
  commit(false, {noSave:true});
  drag = { mode:'pan', sx:ev.clientX, sy:ev.clientY, vx:view.x, vy:view.y, moved:false, pointerId:ev.pointerId };
  $('#canvas').classList.add('panning');
  try{ $('#canvas').setPointerCapture(ev.pointerId); }catch(e){}
}
function worldPoint(ev){
  var r = canvasRect();
  return { x: (ev.clientX - r.left - view.x) / view.scale, y: (ev.clientY - r.top - view.y) / view.scale };
}
function drawGhost(fromId, wp, targetId){
  var g = $('#ghost');
  if(!g) return;
  var A = layout.nodes[fromId];
  if(!A){ g.innerHTML = ''; return; }
  var p0 = portOf(A, sideOf(A, wp || { x:A.x, y:A.y }));
  var B = targetId ? layout.nodes[targetId] : null;
  var pts;
  if(B){
    var side = sideOf(B, A);
    var p1 = portOf(B, side);
    pts = orthoRoute(A, B, 0, 0).pts;
  }else{
    var q = wp || p0;
    pts = [p0, { x:p0.x, y:q.y }, { x:q.x, y:q.y }];
  }
  var scr = pts.map(function(p){ return { x:view.x + p.x*view.scale, y:view.y + p.y*view.scale }; });
  var r = canvasRect();
  g.setAttribute('viewBox', '0 0 ' + Math.round(r.width) + ' ' + Math.round(r.height));
  g.innerHTML = '<path d="' + polyD(scr) + '" stroke="#2f6b5f" stroke-width="2" stroke-dasharray="6 5" fill="none"/>' +
    '<circle cx="' + r2(scr[scr.length-1].x) + '" cy="' + r2(scr[scr.length-1].y) + '" r="3.5" fill="#2f6b5f"/>';
}
/* ============ 拖动松手后的「贴合重排」 ============
   拖动过程只跟随指针（不改挤压）；松手后依次做：
   1) 轴向吸附：12 CSS px 折算世界坐标；伴侣优先吸到伴侣线 y，否则吸到本代基准线
   2) 关系侧重排：按落点 x 在兄弟姐妹中的次序重排 order（伴侣则左右互换）
   3) 清掉平移偏移 → 布局引擎按硬约束重算（净距 ≥70、文字盒不重叠、整组居中）
   4) 连线走正交布线（render 内同源），最后复核净距与中继线冲突
   跨代（纵向位移 ≥ 0.9 个行距）按落点推断归属；空白处保持原归属但允许自由摆放，均给提示 */
function snapAndRelayout(pid){
  var p = personById(pid), n = layout.nodes[pid];
  if(!p || !n) return null;
  var TH = 12 / (view.scale || 1);
  var info = { pid:pid, threshold:+TH.toFixed(1), before:{x:+n.x.toFixed(1), y:+n.y.toFixed(1)},
    baseY:+(n.y - (p.offset.y || 0)).toFixed(1), snapY:null, snapDelta:null,
    reparent:null, keptFree:false, gap:null, warn:[] };

  /* 每代基准 y（不含个人偏移）与最近行距 */
  var rowW = {};
  for(var id in layout.nodes){
    var q = layout.nodes[id], qp = personById(id);
    var by = q.y - ((qp && qp.offset.y) || 0);
    if(rowW[q.gen] == null || by < rowW[q.gen]) rowW[q.gen] = by;
  }
  var gens = Object.keys(rowW).map(Number).sort(function(a,b){ return a-b; });
  var gapRow = Infinity;
  for(var gi=1; gi<gens.length; gi++) gapRow = Math.min(gapRow, rowW[gens[gi]] - rowW[gens[gi-1]]);
  if(!isFinite(gapRow) || gapRow <= 0) gapRow = 160;

  var dragY = n.y, baseY = n.y - (p.offset.y || 0);
  var crossGen = Math.abs(dragY - baseY) >= gapRow * 0.9;

  if(crossGen){
    var targetG = n.gen, bd = Infinity;
    gens.forEach(function(g){ var d = Math.abs(rowW[g] - dragY); if(d < bd){ bd = d; targetG = g; } });
    var dragX = n.x, pick = null, pickD = Infinity;
    doc.unions.forEach(function(u){
      if(!layout.visible[u.a] || (u.b && !layout.visible[u.b])) return;
      if(layout.nodes[u.a].gen !== targetG - 1) return;
      if(u.a === pid || u.b === pid || isAncestor(pid, u.a) || (u.b && isAncestor(pid, u.b))) return;
      var kids = linksOfUnion(u.id).filter(function(l){ return l.primary && layout.visible[l.child]; });
      var lo = Infinity, hi = -Infinity;
      kids.forEach(function(l){
        var k = layout.nodes[l.child], kp = personById(l.child);
        var bx = k.x - ((kp && kp.offset.x) || 0);
        lo = Math.min(lo, bx); hi = Math.max(hi, bx);
      });
      if(!kids.length || !isFinite(lo)) return;
      var pad = SYMBOL/2 + 40;
      if(dragX < lo - pad || dragX > hi + pad) return;
      var d2 = Math.abs(dragX - (lo + hi)/2);
      if(d2 < pickD){ pickD = d2; pick = u; }
    });
    if(pick){
      var kids2 = linksOfUnion(pick.id).filter(function(l){ return l.primary; });
      var mine = doc.parentLinks.filter(function(l){ return l.child === pid && l.primary; })[0];
      if(mine){ mine.union = pick.id; mine.order = kids2.length; }
      else doc.parentLinks.push({ id:uid('l'), child:pid, union:pick.id, kind:'biological', order:kids2.length, primary:true });
      p.offset = { x:0, y:0 };
      info.reparent = pick.id;
      info.reparentWho = personName(pick.a) + (pick.b ? ' & ' + personName(pick.b) : '');
      commit(false);
      centerContent({ fit:false, pad:56 });
      toast('已移入 ' + info.reparentWho + ' 的家庭');
      info.gap = gapsOfRow(layout.nodes[pid].gen);
      warnConflicts(info);
      return info;
    }
    /* 空白处：保持原归属，允许自由摆放（不动 offset） */
    info.keptFree = true;
    commit(false);
    toast('未落在任何家庭的子女区，保持在原归属与自由位置');
    info.gap = gapsOfRow(layout.nodes[pid].gen);
    warnConflicts(info);
    return info;
  }

  /* ---- 同代：轴向吸附 ---- */
  var partnerY = null;
  unionsOf(pid).forEach(function(u){
    var q2 = otherOf(u, pid); if(!q2) return;
    var qn = layout.nodes[q2]; if(!qn) return;
    var qp2 = personById(q2), by2 = qn.y - ((qp2 && qp2.offset.y) || 0);
    if(partnerY == null || Math.abs(by2 - dragY) < Math.abs(partnerY - dragY)) partnerY = by2;
  });
  var targetY = partnerY == null ? baseY : partnerY;
  var dySnap = dragY - targetY;
  info.snapDelta = +dySnap.toFixed(1);
  if(Math.abs(dySnap) <= TH){
    p.offset.y = targetY - baseY;
    info.snapY = +targetY.toFixed(1);
  }else{
    info.snapY = null;   /* 超出阈值：认为用户要脱离原位，y 保持自由 */
  }

  /* ---- 兄弟侧重排：按落点 x 在兄弟姐妹中的相对次序重排 order ---- */
  var pu = primaryParentUnionOf(pid), dragX0 = n.x, reordered = false;
  if(pu){
    var ls = doc.parentLinks.filter(function(l){ return l.union === pu.id && l.primary && layout.nodes[l.child]; });
    if(ls.length >= 2){
      var others = ls.filter(function(l){ return l.child !== pid; }).map(function(l){
        var kn = layout.nodes[l.child], kp2 = personById(l.child);
        return { l:l, bx:kn.x - ((kp2 && kp2.offset.x) || 0) };
      }).sort(function(a,b){ return a.bx - b.bx; });
      var rank = 0; others.forEach(function(o){ if(o.bx < dragX0) rank++; });
      var seq = others.slice(); seq.splice(rank, 0, { l:null });
      var mine2 = ls.filter(function(l){ return l.child === pid; })[0];
      seq.forEach(function(o, i){ if(o.l) o.l.order = i; else if(mine2) mine2.order = i; });
      reordered = true;
      info.siblingRank = rank;
    }
  }else{
    unionsOf(pid).forEach(function(u){
      if(!u.b) return;
      var q3 = otherOf(u, pid), qn3 = layout.nodes[q3];
      if(!qn3) return;
      var qp3 = personById(q3), qbx = qn3.x - ((qp3 && qp3.offset.x) || 0);
      var mineLeft = (u.a === pid);
      if((dragX0 < qbx) !== mineLeft){ var ta = u.a; u.a = u.b; u.b = ta; }
    });
  }

  /* 清掉 x 偏移，交给布局引擎（70px 净距 / 两端对齐 / 整组居中） */
  p.offset = { x:0, y:p.offset.y };
  commit(false);
  centerContent({ fit:false, pad:56 });
  info.persisted = { x:+layout.nodes[pid].x.toFixed(1), y:+layout.nodes[pid].y.toFixed(1) };

  /* 间距复核：不足 70 就硬撑开（并告警），再整组居中 */
  var rowList = Object.keys(layout.nodes).map(function(k){ return layout.nodes[k]; })
    .filter(function(x){ return x.gen === layout.nodes[pid].gen; }).sort(function(a,b){ return a.x - b.x; });
  var idxp = -1; rowList.forEach(function(x, i){ if(x.id === pid) idxp = i; });
  var deficits = [];
  [idxp-1, idxp+1].forEach(function(i){
    if(i < 0 || i >= rowList.length) return;
    var A = rowList[Math.min(i, idxp)], B = rowList[Math.max(i, idxp)];
    /* 净距按符号边到边计算（不能用文字盒 w：w 比符号宽 8px，会误判出 8px 缺口并把节点推错方向） */
    var edge = (B.x - SYMBOL/2) - (A.x + SYMBOL/2);
    if(edge < SYM_GAP - 0.5) deficits.push({ gap:+edge.toFixed(2), left:i < idxp });
  });
  if(deficits.length){
    var need = 0; deficits.forEach(function(d){ need = Math.max(need, SYM_GAP - d.gap); });
    /* 缺口在右 → 往左推；缺口在左 → 往右推（原逻辑方向写反，会把缺口越推越大） */
    var dir = deficits.every(function(d){ return !d.left; }) ? -1 : 1;
    p.offset.x = dir * (need + 1);
    commit(false);
    centerContent({ fit:false, pad:56 });
    var msg = '净距不足 ' + SYM_GAP + 'px，已自动撑开 ' + need.toFixed(1) + 'px';
    info.warn.push(msg);
    console.warn('[genogram] 拖动后' + msg + '（person ' + pid + '）');
  }
  info.gap = gapsOfRow(layout.nodes[pid].gen);
  warnConflicts(info);
  if(reordered) toast('已贴合对齐，并按落点重排间距');
  return info;
}
function gapsOfRow(g){
  var row = Object.keys(layout.nodes).map(function(k){ return layout.nodes[k]; })
    .filter(function(x){ return x.gen === g; }).sort(function(a,b){ return a.x - b.x; });
  var out = [];
  for(var i=1;i<row.length;i++) out.push(+((row[i].x - SYMBOL/2) - (row[i-1].x + SYMBOL/2)).toFixed(2));
  return out;
}
/* 约束冲突不粉饰：中继线偏离子女跨度中点（如避让婚外情的 ×）时告警，说明走的是兜底路径 */
function warnConflicts(info){
  if(!layout || !lastTrunks) return;
  lastTrunks.forEach(function(t){
    if(t.single) return;
    if(t.kx != null && Math.abs(t.x - t.kx) > 6){
      var msg = '中继线偏移 ' + Math.abs(t.x - t.kx).toFixed(1) + 'px（union ' + t.u.id + ' 避让冲突），已按兜底路径布线';
      info.warn.push(msg);
      console.warn('[genogram] ' + msg);
    }
  });
}
function onPointerMove(ev){
  if(!drag) return;
  var dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if(!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  if(drag.mode === 'pan'){
    view.x = drag.vx + dx;
    view.y = drag.vy + dy;
    userPanned = true;
    applyView();
    return;
  }
  if(drag.mode === 'link'){
    var wp = worldPoint(ev);
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    var tn = el && el.closest ? el.closest('.gx-node') : null;
    drag.target = tn && tn.getAttribute('data-id') !== drag.from ? tn.getAttribute('data-id') : null;
    drawGhost(drag.from, wp, drag.target);
    return;
  }
  var p = personById(drag.id);
  if(!p) return;
  p.offset = {
    x: clamp(drag.ox + dx / view.scale, -600, 600),
    y: clamp(drag.oy + dy / view.scale, -600, 600)
  };
  commit(false, {skipPanel:true, noSave:true});
  $('#canvas').classList.add('panning');
}
function onPointerUp(ev){
  if(!drag) return;
  $('#canvas').classList.remove('panning');
  if(drag.mode === 'link'){
    var from = drag.from, target = drag.target;
    var g = $('#ghost'); if(g) g.innerHTML = '';
    drag = null;
    if(target) linkDrop(from, target);
    else toast('拖到另一个人的符号上松手，即可建立关系');
    return;
  }
  if(drag.moved && drag.mode === 'node'){
    /* 拖动 + 贴合重排算一步：入栈的是"拖动前"快照，Ctrl+Z 一次回拖动前 */
    var pre = drag.pre, pidMoved = drag.id;
    drag = null;
    pushHistoryOf(pre);
    var sinfo = snapAndRelayout(pidMoved);
    if(sinfo && sinfo.warn && sinfo.warn.length) toast(sinfo.warn[0]);
    lastSnapInfo = sinfo;
    return;
  }
  /* 小屏 tap 选中：把刚选中的人所在分支铺满视野，否则他可能落在视野外 */
  if(!drag.moved && drag.mode === 'node' && window.innerWidth <= 620) centerContent({ fit:true, pad:56 });
  if(drag.mode === 'pan' && drag.moved){ saveView(); }
  drag = null;
}
function linkDrop(from, target){
  var A = layout.nodes[from], B = layout.nodes[target];
  if(!A || !B) return;
  if(Math.abs(B.y - A.y) > 24) createParentChild(from, target);
  else createUnionBetween(from, target);
}
function onWheel(ev){
  ev.preventDefault();
  var pt = canvasPoint(ev);
  var f = ev.deltaY < 0 ? 1.12 : 1/1.12;
  zoomAt(pt.x, pt.y, f);
}
function onContextMenu(ev){
  ev.preventDefault();
  var nodeEl = ev.target.closest ? ev.target.closest('.gx-node') : null;
  hideMenu();
  if(nodeEl){
    var pid = nodeEl.getAttribute('data-id');
    if(selection.type !== 'person' || selection.id !== pid){

    }

      '-',
      { label: isProband(pid) ? '取消索引咨访' : '设为索引咨访', run: function(){ setProband(isProband(pid) ? null : pid); } },
      { label:'新建情感线…', run: newEmotionFrom },
      { label:'删除人物', run: function(){ if(confirm('确定删除该人物及其全部关系？')) deletePerson(pid); }, danger:true }
    ]);

    { label:'新建人物', run: addStandalonePerson },

    { label:'自动排版', run: autoLayout },

/* ============ 16. 导出 ============ */
function safeName(){
  var t = (doc.meta.title || 'genogram').replace(/[\\/:*?"<>|\s]+/g, '_');
  return (t || 'genogram').slice(0, 40);
}
/* R6：导出恒定 fit —— 完全无视用户当前 pan/zoom，每次导出都重新计算。
   1) 取内容真实包围盒（#world.getBBox，含文字、外侧年份、箭头、线宽）
   2) 等比套进固定页幅 A4 横向 1122×793（96dpi），四周统一安全边距 48px（≥40）
   3) 内容在页面水平/垂直居中（按包围盒中心对齐）
   4) 视口即整页，因此内容一定完整、不会被裁
   预览与最终导出共用同一个 fit 计算结果（存进 expState.fit）。 */
var EXP_PAGE = { w:1122, h:793 }, EXP_PAD = 48;
/* 真实“可见墨迹”包围盒（#world 局部坐标系）。
   getBBox 的根因缺陷：① 把透明命中矩形 .gx-hit/.gx-ehit 与选中框 .sel 算进去；
   ② 文字返回的是字体 em 框而不是实际字形墨迹（左右边距/上下升部降部不对称），
   导致按几何框居中后，真正看得到的图形仍偏 2–4px。这里改为：
   - 形状：getBBox 再按 stroke-width/2 外扩（描边也算墨迹）
   - 文字：用 Canvas2D measureText 的 actualBoundingBox 取字形真实墨迹，
     再按 text-anchor / dominant-baseline 换算到基线坐标系
   - 全部按元素自身的 CTM 映射回 #world 坐标后取并集 */
var _inkCtx = null;
function inkBoxWorld(pred){
  var w = $('#world'), gm = w && w.getCTM();
  if(!gm) return null;
  var inv = gm.inverse();
  _inkCtx = _inkCtx || document.createElement('canvas').getContext('2d');
  var ctx = _inkCtx, l = 1e9, r = -1e9, t = 1e9, b = -1e9, n = 0;
  function add(x, y, M){
    var px = M.a*x + M.c*y + M.e, py = M.b*x + M.d*y + M.f;
    if(px < l) l = px; if(px > r) r = px;
    if(py < t) t = py; if(py > b) b = py; n++;
  }
  $$('path,rect,circle,ellipse,line,polygon,text', w).forEach(function(el){
    if(el.closest('.gx-hit,.gx-ehit,.sel')) return;
    if(pred && !pred(el)) return;
    var cs = getComputedStyle(el);
    if(cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity === 0) return;
    var M = inv.multiply(el.getCTM());
    if(el.tagName === 'text'){
      var str = (el.textContent || '').trim();
      if(!str) return;
      var fs = parseFloat(cs.fontSize) || 12;
      ctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + fs + 'px ' + cs.fontFamily;
      try{ ctx.letterSpacing = cs.letterSpacing; }catch(e){}
      var mt = ctx.measureText(str), iw = mt.width;
      var ax = parseFloat(el.getAttribute('x')) || 0, ay = parseFloat(el.getAttribute('y')) || 0;
      var x0 = cs.textAnchor === 'middle' ? ax - iw/2 : (cs.textAnchor === 'end' ? ax - iw : ax);
      var il = x0 - (mt.actualBoundingBoxLeft || 0);
      var ir = x0 + (mt.actualBoundingBoxRight == null ? iw : mt.actualBoundingBoxRight);
      var it, ib;
      if(cs.dominantBaseline === 'middle' || cs.dominantBaseline === 'central'){
        it = ay - fs*0.38; ib = ay + fs*0.38;
      }else{
        it = ay - (mt.actualBoundingBoxAscent || fs*0.8);
        ib = ay + (mt.actualBoundingBoxDescent || fs*0.2);
      }
      add(il, it, M); add(ir, it, M); add(il, ib, M); add(ir, ib, M);
      return;
    }
    var bb, hw = 0;
    if(el.tagName === 'line'){
      var x1 = +el.getAttribute('x1') || 0, y1 = +el.getAttribute('y1') || 0;
      var x2 = +el.getAttribute('x2') || 0, y2 = +el.getAttribute('y2') || 0;
      bb = { x:Math.min(x1,x2), y:Math.min(y1,y2), width:Math.abs(x2-x1), height:Math.abs(y2-y1) };
    }else{
      bb = el.getBBox();
    }
    if(cs.stroke !== 'none' && cs.stroke !== '') hw = (parseFloat(cs.strokeWidth) || 0) / 2;
    if(cs.fill === 'none' && hw === 0) return;
    add(bb.x - hw, bb.y - hw, M); add(bb.x + bb.width + hw, bb.y - hw, M);
    add(bb.x - hw, bb.y + bb.height + hw, M); add(bb.x + bb.width + hw, bb.y + bb.height + hw, M);
  });
  if(!n || r <= l || b <= t) return null;
  var pad = 0.75;
  return { x:l - pad, y:t - pad, w:(r - l) + pad*2, h:(b - t) + pad*2 };
}
function contentBox(pred){
  var bb = null;
  try{ bb = inkBoxWorld(pred); }catch(e){ bb = null; }
  if(!bb || !bb.w || !bb.h){
    var l = layout && layout.bounds;
    if(!l) return { x:0, y:0, w:1, h:1 };
    bb = { x:l.x, y:l.y, w:l.w, h:l.h };
  }
  return bb;
}
function expFit(){
  var b = contentBox();
  var s = Math.min((EXP_PAGE.w - EXP_PAD*2) / Math.max(b.w,1), (EXP_PAGE.h - EXP_PAD*2) / Math.max(b.h,1));
  var vw = EXP_PAGE.w / s, vh = EXP_PAGE.h / s;
  return { x:(b.x + b.w/2) - vw/2, y:(b.y + b.h/2) - vh/2, w:vw, h:vh, s:s, box:b, pad:EXP_PAD };
}
/* 导出文档里没有 html 根，CSS 变量必须自带一份（:root 在独立 SVG 里就是 <svg> 本身） */
function themeVarsCSS(){
  var t = themeNow();
  var acc = themeState.accent || t.v['--accent'];
  var can = themeState.canvas || t.v['--canvas'];
  return ':root{--gx-sym:' + (themeState.sym || t.sym) + ';--gx-ink:' + t.ink + ';--gx-halo:' + can +
    ';--gx-t2:' + t.v['--ink-2'] + ';--gx-t3:' + t.v['--muted'] + ';--gx-acc:' + acc + ';--gx-edge:' + t.edge + '}';
}
function canvasBg(){ return themeState.canvas || themeNow().v['--canvas']; }
/* 唯一序列化路径：预览、PNG、HTML、打印都用它 */
function svgMarkup(scale, fit){
  fit = fit || expFit();
  var vx = fit.x, vy = fit.y, vw = fit.w, vh = fit.h;
  var W = Math.round(EXP_PAGE.w * scale), H = Math.round(EXP_PAGE.h * scale);
  while(W > 8192 || H > 8192){ scale = scale / 2; W = Math.round(EXP_PAGE.w*scale); H = Math.round(EXP_PAGE.h*scale); }
  var holder = document.createElement('div');
  holder.innerHTML = '<svg xmlns="' + SVG_NS + '">' + $('#world').innerHTML + '</svg>';
  var root = holder.firstElementChild;
  $$('.sel, .gx-hit, .gx-ehit', root).forEach(function(n){ if(n.parentNode) n.parentNode.removeChild(n); });
  var style = $('#svstyle').outerHTML.replace(/^<style[^>]*>/, '').replace(/<\/style>$/, '');
  var str = '<svg xmlns="' + SVG_NS + '" width="' + W + '" height="' + H + '" viewBox="' +
    r2(vx) + ' ' + r2(vy) + ' ' + r2(vw) + ' ' + r2(vh) + '" preserveAspectRatio="xMidYMid meet">' +
    '<style>' + themeVarsCSS() + style + '</style>' +
    '<rect x="' + r2(vx) + '" y="' + r2(vy) + '" width="' + r2(vw) + '" height="' + r2(vh) +
    '" fill="' + canvasBg() + '"/>' + root.innerHTML + '</svg>';
  return { str: str, w: W, h: H };
}
function exportSVGString(scale, fit){ return svgMarkup(scale, fit); }
function downloadBlob(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 1200);
}
function exportPNG(scale, rect){
  if(!layout) return;
  try{
    var s = svgMarkup(scale || 1, rect);
    var svgBlob = new Blob([s.str], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(svgBlob);
    var img = new Image();
    img.onload = function(){
      try{
        var cv = document.createElement('canvas');
        cv.width = s.w; cv.height = s.h;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = canvasBg();
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function(b){
          if(!b){ toast('PNG 生成失败'); return; }
          downloadBlob(b, safeName() + '_' + scale + 'x.png');
          toast('PNG 已导出：' + s.w + '×' + s.h);
        }, 'image/png');
      }catch(e){ toast('PNG 生成失败：' + e.message); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); toast('PNG 渲染失败，请尝试导出 SVG'); };
    img.src = url;
  }catch(e){ toast('导出失败：' + e.message); }
}
function exportSVG(){
  var s = exportSVGString(2);
  downloadBlob(new Blob([s.str], { type:'image/svg+xml;charset=utf-8' }), safeName() + '.svg');
  toast('SVG 已导出');
}
function exportJSON(){
  downloadBlob(new Blob([JSON.stringify(doc, null, 2)], { type:'application/json;charset=utf-8' }), safeName() + '.json');
  toast('JSON 已导出');
}

function specOf(set, code){
  if(set === 'emo') return EMO_BY_CODE[code] || SYM.emo[code] || null;
  if(set === 'cpl') return CPL_BY_STATUS[code] || SYM.cpl[code] || null;
  if(set === 'kid') return KID_BY_KIND[code] || SYM.kid[code] || null;

function specPreview(set, code, W, H){
  W = W || 56; H = H || 18;

  if(!s.color) s.color = themeNow().edge;
  if(s.w > 2.5) s.w = 2;                 // 缩略图里过粗的线会糊成一团
  var pts = [{ x:7, y:H/2 }, { x:W-7, y:H/2 }];

function themeNow(){ return THEMES.filter(function(x){ return x.id === themeState.id; })[0] || THEMES[0]; }
/* 主题同时驱动：符号填充 + 符号描边 + 内部文字 + 连线 + 画布底色 + 面板配色。
   全部通过 CSS 变量下发，#svstyle 里的规则直接引用变量，避免逐处改色导致漏改。 */
function applyTheme(){
  var t = themeNow();
  var root = document.documentElement;
  for(var k in t.v) root.style.setProperty(k, t.v[k]);
  var acc = themeState.accent || t.v['--accent'];
  var can = themeState.canvas || t.v['--canvas'];
  var sym = themeState.sym || t.sym;          // 手动覆盖优先于主题值
  root.style.setProperty('--accent', acc);
  root.style.setProperty('--accent-hover', acc);
  root.style.setProperty('--canvas', can);
  root.style.setProperty('--gx-sym', sym);
  root.style.setProperty('--gx-ink', t.ink);
  root.style.setProperty('--gx-halo', can);
  root.style.setProperty('--gx-t2', t.v['--ink-2']);
  root.style.setProperty('--gx-t3', t.v['--muted']);
  root.style.setProperty('--gx-acc', acc);
  root.style.setProperty('--gx-edge', t.edge);
  try{ localStorage.setItem(K_THEME, JSON.stringify(themeState)); }catch(e){}
}
function loadTheme(){
  try{
    var s = localStorage.getItem(K_THEME);
    if(s){ var o = JSON.parse(s); if(o && o.id) themeState = o; }
  }catch(e){}
  applyTheme();
}

var inlineEdit = null;
function endInlineEdit(doCommit){
  var job = inlineEdit;
  if(!job) return;
  inlineEdit = null;
  var inp = job.inp, val = inp.value;
  if(inp.parentNode) inp.parentNode.removeChild(inp);
  if(!doCommit) return;
  var p = personById(job.pid);
  if(!p) return;
  var v = val.trim();
  if(job.field === 'name'){
    if(v === p.name) return;
    if(!v){ toast('姓名不能为空，已恢复'); return; }
    pushHistory();
    p.name = v;
    commit(false);
    return;
  }
  var maxY = new Date().getFullYear();
  if(v === ''){
    if(p[job.field] == null) return;
    pushHistory();
    p[job.field] = null;
    if(job.field === 'birthYear') p.birthDate = '';
    else p.deathDate = '';
    commit(false);
    return;
  }
  if(!/^\d{4}$/.test(v)){ toast('请输入 4 位数字年份，已恢复'); return; }
  var y = Number(v);
  if(y < 1850 || y > maxY){ toast(y > maxY ? '不能填未来年份，已恢复' : '年份不能早于 1850，已恢复'); return; }
  if(job.field === 'birthYear'){
    if(p.deathYear != null && y > p.deathYear){ toast('出生年份不能晚于死亡年份，已恢复'); return; }
    if(p.birthYear === y && !p.birthDate) return;
    pushHistory();
    p.birthYear = y;
    var bd = parseDay(p.birthDate);
    p.birthDate = bd ? y + '-' + (bd.m < 10 ? '0' : '') + bd.m + '-' + (bd.d < 10 ? '0' : '') + bd.d : '';
    commit(false);
    return;
  }
  if(p.birthYear != null && y < p.birthYear){ toast('死亡年份不能早于出生年份，已恢复'); return; }
  if(p.deathYear === y && !p.deathDate) return;
  pushHistory();
  p.deathYear = y;
  p.deathDate = '';
  commit(false);
}
function beginInlineEdit(pid, field, textEl){
  endInlineEdit(false);
  var p = personById(pid);
  if(!p || !textEl) return;
  var val = field === 'name' ? (p.name || '') : (p[field] == null ? '' : String(p[field]));
  var b = textEl.getBoundingClientRect(), vr = $('#view').getBoundingClientRect();
  var w = Math.max(72, Math.min(240, b.width + 22));
  var h = Math.max(22, b.height + 8);
  var inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'gx-inline';
  inp.value = val;
  inp.setAttribute('aria-label', field === 'name' ? '编辑姓名' : '编辑年份');
  if(field === 'name') inp.style.left = (b.left - vr.left + b.width/2 - w/2) + 'px';
  else inp.style.left = (b.left - vr.left - 5) + 'px';
  inp.style.top = (b.top - vr.top - 4) + 'px';
  inp.style.width = w + 'px';
  inp.style.height = h + 'px';
  $('#view').appendChild(inp);
  inlineEdit = { pid:pid, field:field, inp:inp };
  inp.focus();
  inp.select();
  inp.addEventListener('keydown', function(ev){
    ev.stopPropagation();
    if(ev.key === 'Enter'){ ev.preventDefault(); endInlineEdit(true); }
    else if(ev.key === 'Escape'){ ev.preventDefault(); endInlineEdit(false); }
  });
  inp.addEventListener('blur', function(){ if(inlineEdit && inlineEdit.inp === inp) endInlineEdit(true); });
}
function bindEvents(){
  var cv = $('#canvas');
  cv.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
  cv.addEventListener('wheel', onWheel, { passive:false });
  cv.addEventListener('contextmenu', onContextMenu);
  cv.addEventListener('dblclick', function(ev){
    var el = ev.target;
    var n = el.closest && el.closest('.gx-node');
    var t = el.closest && el.closest('.gx-yr[data-ef], .gx-nm[data-ef]');
    var hit = document.elementFromPoint(ev.clientX, ev.clientY);
    if(!n && hit) n = hit.closest ? hit.closest('.gx-node') : null;
    if(!t && hit) t = hit.closest ? hit.closest('.gx-yr[data-ef], .gx-nm[data-ef]') : null;
    if(!n) return;
    var field = t ? t.getAttribute('data-ef') : 'name';
    if(field !== 'name' && field !== 'birthYear' && field !== 'deathYear') field = 'name';
    var textEl = t && field !== 'name' ? t : n.querySelector('.gx-nm');
    beginInlineEdit(n.getAttribute('data-id'), field, textEl);
  });

  $('#panel').addEventListener('input', onPanelInput);
  /* 一次编辑会话结束（回车提交 / 失焦提交 / 下拉变更）后清掉 Esc 回滚快照：
     否则下一次在同一个输入框里接着改时，快照仍是上一次编辑开始前的旧值，
     Esc 会把两轮编辑一起回滚 */
  function clearSnap(ev){
    var t = ev.target;
    if(t && t.__docSnap && (ev.type === 'change' || ev.type === 'focusout' || ev.type === 'keydown' && ev.key === 'Enter')){
      t.__docSnap = null;
    }
  }
  ['change','focusout','keydown'].forEach(function(ty){ $('#panel').addEventListener(ty, clearSnap); });
  $('#panel').addEventListener('click', onPanelClick);

  $('#toolbar').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-cmd]');
    if(!b || b.disabled) return;
    handleCmd(b.getAttribute('data-cmd'), b);
  });

  $('#title').addEventListener('input', function(){
    doc.meta.title = this.value;
    $('#printTitle').textContent = this.value;
    commit(false, {noLayout:true, skipPanel:true});
  });

  $('#file').addEventListener('change', function(){
    var f = this.files && this.files[0];
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var d = normalizeDoc(JSON.parse(String(fr.result)));
        doc = d;
        selection = { type:null, id:null };
        renderedPos = {};
        pushHistory();
        commit(false); fitToContent();
        toast('已导入：' + (doc.meta.title || '未命名'));
      }catch(e){ toast('导入失败：不是有效的家谱图 JSON'); }
    };
    fr.readAsText(f, 'utf-8');
    this.value = '';
  });

  document.addEventListener('keydown', function(ev){
    var tag = (ev.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || ev.target.isContentEditable;
    if(ev.key === 'Escape'){
      /* 面板输入框里按 Esc：撤销这次编辑（回滚到聚焦前快照），不关面板 */
      if(typing && ev.target.getAttribute && ev.target.getAttribute('data-field') && ev.target.__docSnap){
        try{ doc = JSON.parse(ev.target.__docSnap); }catch(e){}
        ev.target.__docSnap = null;
        commit(false);
        return;
      }
      if($('#xprev').classList.contains('open')){ closeExport(); return; }
      if($('#help').classList.contains('open')){ closeHelp(); return; }
      if($('#menu').classList.contains('open')){ hideMenu(); return; }
      if(pickTarget){ pickTarget = null; commit(false, {noSave:true}); toast('已取消建立情感线'); return; }
      if(!typing && selection.type){ selection = { type:null, id:null }; commit(false, {noSave:true}); return; }
    }
    if(typing) return;
    if(ev.key === '?' || (ev.key === '/' && ev.shiftKey)){ openHelp(); ev.preventDefault(); return; }
    if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z'){
      ev.preventDefault();
      if(ev.shiftKey) redo(); else undo();
      return;
    }
    if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y'){ ev.preventDefault(); redo(); return; }
    if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's'){ ev.preventDefault(); exportJSON(); return; }
    if(ev.key === 'Delete' || ev.key === 'Backspace'){ ev.preventDefault(); deleteSelected(); return; }
    if(ev.key === 'f' || ev.key === 'F'){ fitToContent(); return; }
    if(ev.key === '0'){ resetZoom(); return; }
    if(ev.key === '+' || ev.key === '='){ zoomBy(1.15); return; }
    if(ev.key === '-'){ zoomBy(1/1.15); return; }
    /* 键盘可达：Tab 聚焦到人物符号后，Enter / 空格 = 选中该人物（打开右侧面板） */
    var foc = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.gx-node') : null;
    if(foc && (ev.key === 'Enter' || ev.key === ' ')){
      ev.preventDefault();
      selection = { type:'person', id: foc.getAttribute('data-id') };
      commit(false, { noSave:true });
      return;
    }
    if(ev.key === 'Enter' && selection.type === 'person'){
      var inp2 = $('#panel [data-field="name"]');
      if(inp2){ inp2.focus(); inp2.select(); }
    }
    if(ev.key === ' ' && selection.type === 'person'){ ev.preventDefault(); toggleCollapse(selection.id); }
  });

  $('#help').addEventListener('click', function(ev){
    if(ev.target === this || (ev.target.hasAttribute && ev.target.hasAttribute('data-close'))){ closeHelp(); return; }
    var lr = ev.target.closest('.legend-row[data-code]');
    if(lr){ applyRelation(lr.getAttribute('data-kind'), lr.getAttribute('data-code')); return; }
    var tc = ev.target.closest('[data-theme]');
    if(tc){
      var id = tc.getAttribute('data-theme');
      if(id === 'reset'){ themeState = { id:'linen', accent:'', canvas:'', sym:'' }; }
      else if(id === 'symreset'){ themeState.sym = ''; applyTheme(); openTheme(); toast('符号填充已恢复跟随主题'); return; }
      else{ themeState.id = id; themeState.accent = ''; themeState.canvas = ''; themeState.sym = ''; }
      applyTheme(); closeHelp(); toast('已应用主题');
      return;
    }
  });
  $('#help').addEventListener('input', function(ev){
    if(ev.target.id === 'lgQ'){
      var q = (ev.target.value || '').trim().toLowerCase();
      $$('#helpBox .legend-row').forEach(function(r){
        var kw = (r.getAttribute('data-kw') || '').toLowerCase();
        r.style.display = (!q || kw.indexOf(q) >= 0) ? '' : 'none';
      });
      return;
    }
    if(ev.target.id === 'thAccent'){ themeState.accent = ev.target.value; applyTheme(); }
    if(ev.target.id === 'thCanvas'){ themeState.canvas = ev.target.value; applyTheme(); }
    if(ev.target.id === 'thSym'){ themeState.sym = ev.target.value; applyTheme(); }
  });
  /* 颜色选择器的 change（松手提交）也要生效，避免只拖不松时丢值 */
  $('#help').addEventListener('change', function(ev){
    if(ev.target.id === 'thSym'){ themeState.sym = ev.target.value; applyTheme(); }
  });
  var xpv = $('#xprev');
  xpv.addEventListener('click', function(ev){
    if(ev.target === xpv){ closeExport(); return; }
    var tab = ev.target.closest('button[data-xp]');
    if(tab){ setExpPage(+tab.getAttribute('data-xp')); return; }
    var sc = ev.target.closest('button[data-xps]');
    if(sc){
      expState.scale = +sc.getAttribute('data-xps');
      $('#xpS1').classList.toggle('on', expState.scale === 1);
      $('#xpS2').classList.toggle('on', expState.scale === 2);
      return;
    }
    if(ev.target.closest('#xpDo')){ runExport(); return; }
    if(ev.target.closest('#xpClose')){ closeExport(); }
  });
  xpv.addEventListener('pointerdown', function(ev){ ev.stopPropagation(); });
  document.addEventListener('pointerdown', function(ev){
    if(!ev.target.closest('#menu') && !ev.target.closest('#toolbar')) hideMenu();
  }, true);
  var rsTimer = null;
  window.addEventListener('resize', function(){
    if(window.innerWidth > 760) $('#panel').classList.remove('open');
    /* 视口尺寸变化：用户没动过视图就重新 fit 居中；手动 pan/zoom 过则原样保留，不强行拽回 */
    clearTimeout(rsTimer);
    rsTimer = setTimeout(function(){
      if(!layout || !layout.bounds) return;
      if(userPanned) applyView();
      else centerContent({ fit:true, pad:56 });
    }, 150);
  });
  window.addEventListener('beforeunload', function(){ saveNow(); });
}

/* ============ 20. 启动 ============ */
var savedViewLoaded = false;
function boot(){
  doc = loadDoc();
  loadTheme();
  $('#title').value = doc.meta.title;
  $('#printTitle').textContent = doc.meta.title;
  relayout();
  render(false);
  /* 加载即自动 fit 居中（不再读取上次视图，避免打开时图形跑到视野外） */
  fitToContent();
  bindEvents();
  updateToolbar();
  if(!localStorage.getItem(K_DOC)) saveNow();
  setTimeout(function(){
    if(!doc.persons.length) toast('空白图：点「＋人物」开始，或在画布右键新建');
  }, 600);
}

boot();
})();
</script>
